  UserBoard:
    type: object
    description: Represents a user's board
    required:
      - id
      - name
      - folder_name
    properties:
      id:
        type: integer
        description: Unique identifier of the board
      name:
        type: string
        description: Name of the board
      folder_name:
        type: string
        x-nullable: true
        description: Name of the folder this board belongs to, or null if not in a folder

  FavouriteFolder:
    type: object
    description: Represents a user's favourite folder
    required:
      - id
      - name
    properties:
      id:
        type: integer
        description: Unique identifier of the folder
      name:
        type: string
        description: Name of the folder

  NamedEntity:
    type: object
    required:
      - id
      - name
    properties:
      id:
        type: integer
      name:
        type: string

  ResponseMeta:
    type: object
    description: Response metadata included when the request has a credits cost
    properties:
      credits_cost:
        type: integer
        description: Number of API credits deducted for this request

  ErrorModel:
    type: object
    description: Common error response model
    required:
      - errorMessage
      - errorCode
    properties:
      errorMessage:
        type: string
        description: Human-readable error message
      errorCode:
        type: integer
        description: Numeric error code for programmatic handling
      errorDescription:
        type: string
        description: Additional details about the error
    example:
      errorMessage: Invalid request
      errorCode: 400
      errorDescription: Parameter 'start_date' must be in 'Y-m-d' format

  CountryModel:
    type: object
    required:
      - name
      - code
    properties:
      name:
        type: string
      code:
        type: string
    example:
      name: France
      code: FR

  Ad:
    type: object
    description: Represents an ad with its associated landing pages
    required:
      - id
      - type
    properties:
      id:
        type: integer
        description: Unique identifier of the ad
      type:
        type: integer
        description: Type of the ad from /dictionary/ad_types
      title:
        type: string
        description: Title or headline of the ad
      description:
        type: string
        description: Description text of the ad
      image_url:
        type: string
        format: uri
        description: URL to the ad's main image
      video_url:
        type: string
        format: uri
        description: URL to the ad's video if available
      days_total:
        type: integer
        description: Total number of days the ad has been running. When `meta_grouping_id` is set, holds the group's value.
      first_seen:
        type: string
        format: date
        description: Date the ad was first seen (format 'Y-m-d').
      last_seen:
        type: string
        format: date
        description: Date the ad was last seen (format 'Y-m-d').
      countries:
        type: array
        description: List of country codes the ad has been seen in. When `meta_grouping_id` is set, holds the group's value.
        items:
          type: string
      tracking_tools:
        type: array
        description: List of tracking tool IDs detected across the ad's landing pages.
        items:
          type: integer
      affiliate_networks:
        type: array
        description: List of affiliate network IDs associated with the ad.
        items:
          type: integer
      affiliate_offers:
        type: array
        description: List of affiliate offer IDs detected across the ad's landing pages (see /dictionary/affiliate_offers).
        items:
          type: integer
      arbitrage_networks:
        type: array
        description: List of arbitrage network IDs associated with the ad's landing pages.
        items:
          type: integer
      technologies:
        type: array
        description: List of technology IDs detected across the ad's landing pages.
        items:
          type: integer
      verticals:
        type: array
        description: List of vertical IDs of the ad (see /dictionary/verticals).
        items:
          type: integer
      meta_ad_id:
        type: string
        description: Meta (Facebook) ad library ID. Only for Meta ads.
      meta_page_id:
        type: string
        description: Meta (Facebook) page ID running the ad. Only for Meta ads.
      meta_ad_type:
        type: integer
        description: Meta ad media type (see /dictionary/meta_ad_types). Only for Meta ads.
      meta_cta_type:
        type: integer
        description: Meta CTA button type (see /dictionary/meta_cta_types). Only for Meta ads with a CTA button.
      meta_page_name:
        type: string
        description: Name of the Meta page running the ad. Only for Meta ads.
      meta_caption:
        type: string
        description: Caption (display link/domain) of the Meta ad. Only for Meta ads.
      meta_platforms:
        type: array
        description: List of Meta publisher platform IDs the ad runs on (see /dictionary/meta_platforms). Only for Meta ads.
        items:
          type: integer
      meta_status:
        type: integer
        enum:
          - 1
          - 0
        description: Whether the Meta ad is currently active (1) or inactive (0). Only for Meta ads. When `meta_grouping_id` is set, reflects the group's status.
      meta_grouping_id:
        type: integer
        description: Grouping type the results are grouped by. Only present when the `meta_grouping_id` request parameter is set.
      meta_group_ads_count:
        type: integer
        description: Number of ads grouped together under this ad. Only present when `meta_grouping_id` is set.
      meta_group_pages_count:
        type: integer
        description: Number of landing pages grouped together under this ad. Only present when `meta_grouping_id` is set.
      meta_group_active_ads:
        type: integer
        description: Number of currently active ads in the group. Only present when `meta_grouping_id` is set.
      meta_group_active_ads_change:
        type: number
        format: float
        description: Percentage change of active ads in the group compared to the previous period (7 days), rounded to one decimal. 0 when there is no previous value. Only present when `meta_grouping_id` is set.
      meta_group_new_ads:
        type: integer
        description: Number of ads in the group first seen within the last 7 days. Only present when `meta_grouping_id` is set.
      meta_group_new_ads_change:
        type: number
        format: float
        description: Percentage change of new ads in the group compared to the previous period (7 days), rounded to one decimal. 0 when there is no previous value. Only present when `meta_grouping_id` is set.
      meta_group_score:
        type: number
        format: float
        description: Group activity score combining active ads, new ads, ads count, days running and their growth. Higher is better. Only present when `meta_grouping_id` is set.
      meta_group_score_change:
        type: number
        format: float
        description: Percentage change of the group score compared to the previous period (7 days), rounded to one decimal. 0 when there is no previous value. Only present when `meta_grouping_id` is set.
      landing_pages:
        type: array
        description: List of landing pages associated with this ad
        items:
          $ref: '#/definitions/LandingPage'

  LandingPage:
    type: object
    description: Represents a landing page with its URLs and metadata
    required:
      - id
      - ad_id
      - url
    properties:
      id:
        type: integer
        description: Unique identifier of the landing page
      ad_id:
        type: integer
        description: Unique identifier of the ad this landing page belongs to
      url:
        type: string
        format: uri
        description: Original URL of the landing page
      redirects:
        type: array
        description: List of redirect URLs in the landing page redirect chain
        items:
          type: string
          format: uri
      outgoing_urls:
        type: object
        description: Map of outbound URLs where key is url and value is redirect chain
        additionalProperties:
          type: array
          items:
            type: string
            format: uri
      screenshot_url:
        type: string
        format: uri
        description: URL to the screenshot of the landing page
      archive_url:
        type: string
        format: uri
        description: URL to the archived version of the landing page
      technologies:
        type: array
        description: List of technology IDs detected on the landing page
        items:
          type: integer
      tracking_tools:
        type: array
        description: List of tracking tool IDs detected on the landing page
        items:
          type: integer
      affiliate_networks:
        type: array
        description: List of affiliate network IDs associated with the landing page
        items:
          type: integer
      affiliate_offers:
        type: array
        description: List of affiliate offer IDs detected on the landing page (see /dictionary/affiliate_offers)
        items:
          type: integer
      arbitrage_networks:
        type: array
        description: List of arbitrage network IDs associated with the landing page
        items:
          type: integer
      days_total:
        type: integer
        description: Total number of days the landing page has been running.
      first_seen:
        type: string
        format: date
        description: Date the landing page was first seen (format 'Y-m-d').
      last_seen:
        type: string
        format: date
        description: Date the landing page was last seen (format 'Y-m-d').
      countries:
        type: array
        description: List of country codes the landing page has been seen in.
        items:
          type: string
      verticals:
        type: array
        description: List of vertical IDs of the landing page (see /dictionary/verticals).
        items:
          type: integer
      lp_grouping_id:
        type: integer
        description: Grouping type the results are grouped by. Only present when the `lp_grouping_id` request parameter is set.
      lp_group_lps_count:
        type: integer
        description: Number of landing pages grouped together under this landing page. Only present when `lp_grouping_id` is set.
      lp_group_ads_count:
        type: integer
        description: Number of ads grouped together under this landing page. Only present when `lp_grouping_id` is set.

<!-- Aisle and pill: a small brand word, a big white headline, a wide offer pill and one small line under it, all stacked at the top of the frame. Sizes are at full scale; the fit step shrinks them together. -->
<div class="area" data-fit style="justify-content:flex-start;gap:calc(var(--s)*20px);color:{{ink}}">
 <div class="line" style="font:400 calc(var(--s)*40px)/1 Display;letter-spacing:.14em">{{brand}}</div>
 <div class="line" style="font:400 calc(var(--s)*94px)/1.06 Display;white-space:normal;max-width:88%">{{head}}</div>
 <div class="line" style="font:400 calc(var(--s)*50px)/1 Display;background:{{ground}};padding:calc(var(--s)*20px) calc(var(--s)*36px)">{{lead}}</div>
 <div class="line" style="font:400 calc(var(--s)*36px)/1.2 Sans;white-space:normal;max-width:90%">{{price}}</div>
</div>

<!-- Question and offer: a big question, its one-line answer and an offer set in dark ink on the round shape behind the product. Sizes are at full scale; the fit step shrinks the question block, the offer keeps its place. -->
<div class="area" data-fit style="align-items:flex-start;text-align:left;justify-content:flex-start;gap:calc(var(--s)*16px);color:{{ink}};text-shadow:0 calc(var(--s)*3px) calc(var(--s)*14px) rgba(0,0,0,.55)">
 <div class="line" style="font:400 calc(var(--s)*118px)/1.04 Display">{{lead}}</div>
 <div class="line" style="font:400 calc(var(--s)*62px)/1.12 Sans">{{price}}</div>
</div>
<div style="position:fixed;left:27%;right:13%;top:30.6%;text-align:center;color:{{ground}};font:400 45px/1.22 Display">{{note}}</div>

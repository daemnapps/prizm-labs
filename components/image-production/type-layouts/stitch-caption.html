<!-- Stitch caption: a green-screen stitch's short in-app caption, medium weight white with a thin soft black outline, the writer's lines kept. Set keep_lines to ["head"]. Sizes are at full scale; the fit step shrinks it. -->
<div class="area" data-fit style="justify-content:center;gap:0;color:#fff;paint-order:stroke fill;-webkit-text-stroke:calc(var(--s)*5px) #000">
 <div class="line" style="font:600 calc(var(--s)*52px)/1.14 'Helvetica Neue',-apple-system,Sans">{{head}}</div>
</div>

<!-- Selfie two captions: the phone's plain white caption with a soft shadow at the top, and a separate heavy outlined capitals line on the chest whose last word sits on a bright box. `head` is the top caption with keep_lines; `pivot` is the words before the box, `boxed` the boxed word; `ink` is the box colour. The face between them stays clear. -->
<div class="area" data-fit style="justify-content:flex-start;color:#fff;text-shadow:0 calc(var(--s)*2px) calc(var(--s)*6px) rgba(0,0,0,.7)">
 <div class="line" style="font:400 calc(var(--s)*62px)/1.26 'Helvetica Neue',-apple-system,Sans">{{head}}</div>
</div>
<div style="position:fixed;left:5%;right:5%;top:72%;text-align:center;white-space:nowrap;font:700 88px/1.2 'Arial Narrow','Helvetica Neue',-apple-system,Sans;color:#fff;-webkit-text-stroke:7px #000;paint-order:stroke fill">{{pivot}} <span style="background:{{ink}};border-radius:10px;padding:0 12px">{{boxed}}</span></div>

<!-- Centre shadow line: one bold white phone caption dead centre with a heavy soft black drop, no outline and no box. Sizes are at full scale; the fit step shrinks it. -->
<div class="area" data-fit style="justify-content:center;color:#fff;text-shadow:0 calc(var(--s)*4px) calc(var(--s)*5px) rgba(0,0,0,.95),0 0 calc(var(--s)*12px) rgba(0,0,0,.7)">
 <div class="line" style="font:700 calc(var(--s)*62px)/1.15 'Helvetica Neue',-apple-system,Sans">{{head}}</div>
</div>

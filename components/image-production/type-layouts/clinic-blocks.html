<!-- Clinic blocks: a corner block top right, a pill under each subject, a banner with a struck line bottom left. Sizes are at full scale; the fit step shrinks them together. -->
<style>.pill{position:absolute;background:#fff;color:#111;font:500 calc(var(--s)*40px)/1 Sans;padding:calc(var(--s)*12px) calc(var(--s)*40px);border-radius:calc(var(--s)*10px);box-shadow:0 2px 10px #0003}</style>
<div class="area" data-fit style="justify-content:flex-start">
 <div class="line pill" style="left:10%;top:70%">{{before}}</div>
 <div class="line pill" style="left:44%;top:70%">{{after}}</div>
</div>
<div style="position:absolute;left:0;top:78.6%;width:42%;height:6.6%;background:{{ground}};color:#fff;display:flex;flex-direction:column;justify-content:center;padding-left:54px"><div style="font:500 28px/1.1 Sans;text-decoration:line-through">{{old}}</div><div style="font:800 52px/1.05 Display">{{note}}</div></div>
<div style="position:absolute;right:0;top:14.8%;width:38%;height:15%;background:{{ground}};color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font:800 76px/1.05 Display;text-transform:uppercase;padding:0 24px">{{head}}</div>

<!-- Badge and foot: a perfect brown circle with a thin white stroke holding the lines, and a small line over the brand name low in the frame. Sizes are at full scale; the fit step shrinks the badge words. -->
<div class="area" data-fit style="justify-content:center;color:#fff;background:{{ground}};border:5px solid #fff;border-radius:50%;padding:calc(var(--s)*52px)">
 <div class="line" style="font:400 calc(var(--s)*50px)/1.1 Display;white-space:normal">{{head}}</div>
</div>
<div style="position:fixed;left:8%;right:8%;top:73.5%;text-align:center;font:400 44px/1.2 Sans;color:{{ink}}">{{foot}}</div>
<div style="position:fixed;left:8%;right:8%;top:77%;text-align:center;font:400 92px/1.1 Display;letter-spacing:.14em;color:{{ink}}">{{mark}}</div>

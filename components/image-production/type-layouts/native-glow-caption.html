<!-- Native glow caption: a bright coloured phone caption with a hard black drop, white lines under it. Sizes are at full scale; the fit step shrinks them together. -->
<div class="area" data-fit style="justify-content:flex-start;gap:calc(var(--s)*12px);color:#fff;text-shadow:calc(var(--s)*3px) calc(var(--s)*3px) 0 #000,0 0 calc(var(--s)*6px) #000">
 <div class="line" style="font:400 calc(var(--s)*64px)/1.14 Sans;color:{{ink}}">{{head}}</div>
 <div class="line" style="font:400 calc(var(--s)*52px)/1.16 Sans">{{lead}}</div>
 <div class="line" style="font:400 calc(var(--s)*40px)/1.16 Sans">{{price}}</div>
</div>

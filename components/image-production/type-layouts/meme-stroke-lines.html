<!-- Meme stroke lines: a repost's caption on a picture. Centred bold mixed-case white lines with a hard black outline, no box. Set keep_lines to ["head"] so the writer's lines hold. Sizes are at full scale; the fit step shrinks them. -->
<div class="area" data-fit style="justify-content:center">
 <div class="line" style="font:700 calc(var(--s)*72px)/1.24 'Helvetica Neue',-apple-system,Sans;color:#fff;-webkit-text-stroke:calc(var(--s)*7px) #000;paint-order:stroke fill">{{head}}</div>
</div>

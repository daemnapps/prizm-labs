<!-- Forum page: a web article's chrome. Wordmark and links, a section bar between two rules, a big headline and a subhead, all on the page's white. Sizes are at full scale; the fit step shrinks them together. -->
<div class="area" data-fit style="align-items:flex-start;text-align:left;justify-content:flex-start;gap:calc(var(--s)*16px);color:{{ink}}">
 <div class="line" style="display:flex;align-items:baseline;gap:calc(var(--s)*26px);width:100%;border-bottom:3px solid {{ground}};padding-bottom:calc(var(--s)*12px)"><span style="font:800 calc(var(--s)*44px)/1 Display;color:{{ground}}">{{logo}}</span><span style="font:500 calc(var(--s)*25px)/1 Sans">{{nav}}</span></div>
 <div class="line" style="width:100%;font:600 calc(var(--s)*22px)/1 Sans;letter-spacing:.05em;color:#333;border-bottom:3px solid {{ground}};padding-bottom:calc(var(--s)*12px)">{{sub}}</div>
 <div style="font:800 calc(var(--s)*72px)/1.08 Display;margin-top:calc(var(--s)*8px)">{{head}}</div>
 <div style="font:500 calc(var(--s)*34px)/1.22 Sans">{{note}}</div>
</div>

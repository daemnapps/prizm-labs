<!-- Headline and seal: a small line over a big centred headline, with a round sale seal set beside the face at the right. Sizes are at full scale; the fit step shrinks the headline block, the seal keeps its place. -->
<div class="area" data-fit style="justify-content:flex-start;gap:calc(var(--s)*16px);color:{{ink}}">
 <div class="line" style="font:400 calc(var(--s)*40px)/1.15 Sans">{{note}}</div>
 <div class="line" style="font:400 calc(var(--s)*96px)/1.08 Display;white-space:normal">{{head}}</div>
</div>
<div style="position:fixed;left:69%;top:31%;width:270px;height:270px;border-radius:50%;background:{{ground}};color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px">
 <div style="font:400 41px/1.05 Display">{{lead}}</div>
 <div style="font:400 25px/1.2 Sans;margin-top:10px">{{price}}</div>
</div>

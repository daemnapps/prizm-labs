<!-- Mom and me caption: a phone text tool's post. A white outlined bold line with a thin serif line under it near the top, then low down a black square platform badge on the corner of a slightly tilted white box with one bold black line. Sizes are at full scale. Set `area` to the top line's band; the box keeps its fixed place. -->
<div class="area" data-fit style="justify-content:flex-start">
 <div class="line" style="font:800 calc(var(--s)*66px)/1.05 'Helvetica Neue',-apple-system,Sans;color:#fff;-webkit-text-stroke:calc(var(--s)*5px) #3a3a3a;paint-order:stroke fill;letter-spacing:-.01em">{{head}}</div>
 <div class="line" style="font:400 calc(var(--s)*44px)/1.1 Georgia,serif;color:#fff;margin-top:calc(var(--s)*2px);text-shadow:0 0 calc(var(--s)*6px) rgba(0,0,0,.35)">{{sub}}</div>
</div>
<div style="position:fixed;left:12%;width:76%;top:64.5%;transform:rotate(-1.2deg)">
 <div style="background:#fff;border-radius:6px;padding:40px 24px 42px;text-align:center;white-space:nowrap;font:700 60px/1.05 'Helvetica Neue',-apple-system,Sans;color:#111">{{box}}</div>
 <div style="position:absolute;left:2px;top:-112px;width:106px;height:106px;background:#0b0b0b;border-radius:10px;border:3px solid #fff;display:flex;align-items:center;justify-content:center;transform:rotate(-5deg)">
  <svg viewBox="0 0 60 60" width="66" height="66"><path d="M12 42 L10 22 L22 26 L24 10 L36 20 L48 14 L44 30 L52 40 L36 40 L30 52 L24 42 Z" fill="#fff"/></svg>
 </div>
</div>

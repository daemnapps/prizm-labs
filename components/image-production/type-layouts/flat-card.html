<!-- Flat card: a big bold centred headline with a soft shadow on a flat colour ground, and one dark button under it. Sizes are at full scale; the fit step shrinks them together. -->
<div class="area" data-fit style="justify-content:flex-start;gap:calc(var(--s)*84px);color:{{ink}}">
 <div class="line" style="font:400 calc(var(--s)*170px)/1.14 Display;-webkit-text-stroke:calc(var(--s)*3px) currentColor;white-space:normal;max-width:100%;text-shadow:0 0 calc(var(--s)*26px) rgba(0,0,0,.22)">{{head}}</div>
 <div class="line" style="font:400 calc(var(--s)*52px)/1 Sans;letter-spacing:.01em;color:#fff;background:{{ground}};padding:calc(var(--s)*40px) calc(var(--s)*62px)">{{cta}}</div>
</div>

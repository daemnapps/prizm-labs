<!-- Native two captions: one big line at the top of the area, the second line and the offer at its foot, so a face between them stays clear. Sizes are at full scale; the fit step shrinks them together. -->
<div class="area" data-fit style="justify-content:space-between;paint-order:stroke fill;-webkit-text-stroke:calc(var(--s)*8px) #000">
 <div class="line" style="font:400 calc(var(--s)*72px)/1.12 Sans">{{head}}</div>
 <div style="display:flex;flex-direction:column;align-items:center;gap:calc(var(--s)*12px)">
  <div class="line" style="font:400 calc(var(--s)*60px)/1.12 Sans;white-space:normal;max-width:86%">{{lead}}</div>
  <div class="line" style="font:400 calc(var(--s)*46px)/1.16 Sans;white-space:normal;max-width:90%">{{price}}</div>
 </div>
</div>

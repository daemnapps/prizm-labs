<!-- Palm offer: on a flat colour ground, the brand name small and spaced at the top, a giant two-line offer (`head`, one line per written line), a spaced caps line under it, then the product held up below. A solid tag (`tag`) sits beside the product and a short footer (`foot`) sits low in the frame; their places (`tag_x`, `tag_y`, `foot_x`, `foot_y`, `foot_align`: percent of the frame, left edge and top) come from `fixed`, set clear of the product and the hand. Sizes are at full scale; the fit step shrinks the top block together. -->
<style>.tag:empty,.foot:empty{display:none}</style>
<div class="area" data-fit style="justify-content:flex-start;gap:calc(var(--s)*26px);color:{{ink}}">
 <div class="line" style="font:600 calc(var(--s)*40px)/1 Sans;letter-spacing:.42em;padding-left:.42em;text-transform:uppercase">{{mark}}</div>
 <div class="line" style="font:500 calc(var(--s)*178px)/.98 Display;letter-spacing:-.01em;text-transform:uppercase">{{head}}</div>
 <div class="line" style="font:600 calc(var(--s)*40px)/1.1 Sans;letter-spacing:.16em;text-transform:uppercase">{{note}}</div>
</div>
<div class="tag" style="position:fixed;left:{{tag_x}}%;top:{{tag_y}}%;background:{{ink}};color:{{ground}};font:600 34px/1.05 Sans;letter-spacing:.06em;text-transform:uppercase;padding:20px 26px;border-radius:999px;text-align:center;white-space:pre-line;transform:rotate(-6deg)">{{tag}}</div>
<div class="foot" style="position:fixed;left:{{foot_x}}%;right:5%;top:{{foot_y}}%;text-align:{{foot_align}};font:600 36px/1.25 Sans;letter-spacing:.08em;text-transform:uppercase;color:{{ink}};white-space:pre-line">{{foot}}</div>

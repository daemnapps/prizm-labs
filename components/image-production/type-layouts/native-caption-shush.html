<!-- Native caption with the swipe's row of shushing faces: headline, the faces, then the offer's two lines. Sizes are at full scale; the fit step shrinks them together. -->
<div class="area" data-fit style="justify-content:center;gap:calc(var(--s)*12px);paint-order:stroke fill;-webkit-text-stroke:calc(var(--s)*9px) #000">
 <div class="line" style="font:400 calc(var(--s)*72px)/1.12 Sans">{{lead}}</div>
 <div class="line" style="font:400 calc(var(--s)*56px)/1.1 Sans;-webkit-text-stroke:0">&#x1F92B;&#x1F92B;&#x1F92B;&#x1F92B;&#x1F92B;&#x1F92B;</div>
 <div class="line" style="font:400 calc(var(--s)*62px)/1.15 Sans">{{price}}</div>
 <div class="line" style="font:400 calc(var(--s)*62px)/1.15 Sans">{{cta}}</div>
</div>

<!-- Banner and ticket: a tilted paper banner, two big stacked lines, then a perforated ticket with one small line under it. Sizes are at full scale; the fit step shrinks them together. -->
<div class="area" data-fit style="justify-content:flex-start;gap:calc(var(--s)*14px);color:{{ink}}">
 <div class="line" style="font:400 calc(var(--s)*60px)/1 Display;letter-spacing:.04em;color:#fff;background:{{ground}};padding:calc(var(--s)*16px) calc(var(--s)*56px);transform:rotate(-4deg);margin:calc(var(--s)*16px) 0 calc(var(--s)*24px)">{{head}}</div>
 <div class="line" style="font:400 calc(var(--s)*78px)/1.02 Display">{{hook}}</div>
 <div class="line" style="font:400 calc(var(--s)*104px)/1.02 Display;color:{{ground}}">{{big}}</div>
 <div class="line" style="font:400 calc(var(--s)*50px)/1 Display;background:#fff;border:calc(var(--s)*4px) dashed {{ground}};border-radius:calc(var(--s)*14px);padding:calc(var(--s)*18px) calc(var(--s)*40px);margin-top:calc(var(--s)*8px)">{{lead}}</div>
 <div class="line" style="font:400 calc(var(--s)*38px)/1.1 Sans">{{price}}</div>
</div>

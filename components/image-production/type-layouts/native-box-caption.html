<!-- Native box caption: a phone post's bold line on a white rounded box, with an optional outlined caption at the foot of the area. Sizes are at full scale; the fit step shrinks them together. -->
<div class="area" data-fit style="justify-content:space-between">
 <div class="line" style="font:700 calc(var(--s)*60px)/1.16 -apple-system,'Helvetica Neue',Sans;color:#000;background:#fff;border-radius:calc(var(--s)*24px);padding:calc(var(--s)*16px) calc(var(--s)*28px);white-space:normal;max-width:92%;box-decoration-break:clone">{{head}}</div>
 <div class="line" style="font:600 calc(var(--s)*56px)/1.14 -apple-system,'Helvetica Neue',Sans;color:#fff;-webkit-text-stroke:calc(var(--s)*6px) #000;paint-order:stroke fill;white-space:normal;max-width:70%">{{note}}</div>
</div>

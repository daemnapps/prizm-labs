<!-- Native soft caption: a phone post's plain white caption with a soft dark shadow and no outline, the headline over the offer lines. Sizes are at full scale; the fit step shrinks them together. -->
<div class="area" data-fit style="justify-content:flex-start;gap:calc(var(--s)*12px);color:#fff;text-shadow:0 calc(var(--s)*2px) calc(var(--s)*8px) rgba(0,0,0,.75)">
 <div class="line" style="font:400 calc(var(--s)*76px)/1.12 Sans">{{lead}}</div>
 <div class="line" style="font:400 calc(var(--s)*46px)/1.2 Sans;white-space:normal;max-width:90%">{{price}}</div>
</div>

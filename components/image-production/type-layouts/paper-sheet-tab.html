<!-- Paper sheet and tab: a centred headline on a pinned paper sheet in the scene, with one short line over the tear-off tab strip below it. Sizes are at full scale; the fit step shrinks the headline. -->
<div class="area" data-fit style="justify-content:center;color:{{ink}}">
 <div class="line" style="font:400 calc(var(--s)*112px)/1.08 Display;white-space:normal;max-width:100%">{{head}}</div>
</div>
<div style="position:fixed;left:45%;right:31%;top:66.9%;text-align:center;font:400 34px/1.2 Sans;letter-spacing:.06em;color:#fff">{{cta}}</div>

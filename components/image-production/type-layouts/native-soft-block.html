<!-- Native soft block: a phone post's caption, large white lowercase centred lines with a soft dark glow and no outline, the writer's line breaks kept. Sizes are at full scale; the fit step shrinks them together. -->
<div class="area" data-fit style="justify-content:center">
 <div class="line" style="font:500 calc(var(--s)*80px)/1.26 Sans;color:#fff;text-shadow:0 0 calc(var(--s)*14px) rgba(0,0,0,.55),0 calc(var(--s)*2px) calc(var(--s)*6px) rgba(0,0,0,.45)">{{head}}</div>
</div>

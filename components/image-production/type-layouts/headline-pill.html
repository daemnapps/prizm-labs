<!-- Headline and pill: a bold centred headline over an offer pill, with a footer line set at the foot of the frame. Sizes are at full scale; the fit step shrinks the headline block, the footer keeps its place. -->
<div class="area" data-fit style="justify-content:flex-start;gap:calc(var(--s)*18px);color:{{ink}}">
 <div class="line" style="font:400 calc(var(--s)*74px)/1.06 Display;white-space:normal;max-width:62%">{{head}}</div>
 <div class="line" style="font:400 calc(var(--s)*54px)/1 Display;color:#fff;background:{{ground}};border-radius:calc(var(--s)*48px);padding:calc(var(--s)*20px) calc(var(--s)*44px)">{{lead}}</div>
</div>
<div style="position:fixed;left:5%;right:5%;top:82.7%;text-align:center;font:400 38px/1.2 Sans;color:{{ink}}">{{note}}</div>

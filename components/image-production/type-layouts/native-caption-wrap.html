<!-- Native caption wrap: the outlined caption as a block beside a held product, the headline wrapping over the offer. Sizes are at full scale; the fit step shrinks them together. -->
<div class="area" data-fit style="justify-content:center;gap:calc(var(--s)*16px);paint-order:stroke fill;-webkit-text-stroke:calc(var(--s)*9px) #000">
 <div class="line" style="font:400 calc(var(--s)*74px)/1.12 Sans;white-space:normal">{{lead}}</div>
 <div class="line" style="font:400 calc(var(--s)*46px)/1.18 Sans;white-space:normal">{{price}}</div>
</div>

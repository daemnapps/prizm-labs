<!-- Doodle offer: a short offer line with a hand-drawn oval round its end, one plain sentence under it, and a bold-ended footer lower down. Sizes are at full scale; the fit step shrinks the upper block, the footer keeps its place. -->
<div class="area" data-fit style="justify-content:flex-start;gap:calc(var(--s)*12px);color:{{ink}}">
 <div class="line" style="position:relative;font:400 calc(var(--s)*66px)/1.2 Display;padding:0 calc(var(--s)*26px)">{{lead}}<svg viewBox="0 0 300 100" preserveAspectRatio="none" style="position:absolute;right:calc(var(--s)*-6px);top:calc(var(--s)*-10px);width:calc(var(--s)*214px);height:calc(var(--s)*104px);overflow:visible"><path d="M40 16C110 2 240 2 284 30c26 26-6 58-96 62C96 98 12 84 8 50 6 26 60 8 150 8" fill="none" stroke="{{ink}}" stroke-width="3.4" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg></div>
 <div class="line" style="font:400 calc(var(--s)*50px)/1.2 Sans">{{note}}</div>
</div>
<div style="position:fixed;left:33%;right:33%;top:68%;text-align:center;font:400 34px/1.3 Display;color:{{ink}}">{{price}}</div>

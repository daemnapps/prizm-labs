<!-- Native caption: a phone post's outlined caption, the headline over one offer line. Sizes are at full scale; the fit step shrinks them together. -->
<div class="area" data-fit style="justify-content:center;gap:calc(var(--s)*14px);paint-order:stroke fill;-webkit-text-stroke:calc(var(--s)*9px) #000">
 <div class="line" style="font:400 calc(var(--s)*92px)/1.12 Sans">{{lead}}</div>
 <div class="line" style="font:400 calc(var(--s)*54px)/1.15 Sans">{{price}}</div>
</div>

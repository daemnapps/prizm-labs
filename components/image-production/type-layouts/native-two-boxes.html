<!-- Native two boxes: a phone post's text tool, one white rounded box holding the headline's lines near the top, and a smaller white rounded box with one line at mid frame, directly above a floating product. Set keep_lines to ["head"] so the writer's line break holds. Sizes are at full scale; the fit step shrinks the top box, the mid box keeps its place. -->
<div class="area" data-fit style="justify-content:flex-start">
 <div class="line" style="font:500 calc(var(--s)*66px)/1.2 'Helvetica Neue',-apple-system,Sans;color:#000;background:#fff;border-radius:calc(var(--s)*20px);padding:calc(var(--s)*14px) calc(var(--s)*28px);text-align:center">{{head}}</div>
</div>
<div style="position:fixed;left:0;right:0;top:56%;text-align:center"><span style="font:500 54px/1.2 'Helvetica Neue',-apple-system,Sans;color:#000;background:#fff;border-radius:18px;padding:10px 26px">{{note}}</span></div>

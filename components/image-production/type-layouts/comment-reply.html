<!-- Comment reply: a centred headline with a hard drop, and below it at the left a white reply-to-comment sticker with a round avatar, a grey name line and a bold comment. Sizes are at full scale; the fit step shrinks them together. -->
<div class="area" data-fit style="justify-content:flex-start;gap:calc(var(--s)*20px)">
 <div class="line" style="font:700 calc(var(--s)*54px)/1.1 -apple-system,'Helvetica Neue',Sans;color:#fff;text-shadow:calc(var(--s)*3px) calc(var(--s)*3px) 0 rgba(0,0,0,.8)">{{head}}</div>
 <div style="align-self:flex-start;width:30%;background:#fff;border-radius:calc(var(--s)*20px);padding:calc(var(--s)*14px) calc(var(--s)*16px);text-align:left;color:#111">
  <div style="display:flex;gap:calc(var(--s)*10px);align-items:center;margin-bottom:calc(var(--s)*8px)">
   <span style="flex:none;width:calc(var(--s)*36px);height:calc(var(--s)*36px);border-radius:50%;background:#c9bdb2;display:flex;align-items:center;justify-content:center;font-size:calc(var(--s)*25px)">{{mark}}</span>
   <span style="font:500 calc(var(--s)*17px)/1.15 -apple-system,'Helvetica Neue',Sans;color:#777">{{sub}}</span>
  </div>
  <div style="font:700 calc(var(--s)*23px)/1.2 -apple-system,'Helvetica Neue',Sans">{{note}}</div>
 </div>
</div>

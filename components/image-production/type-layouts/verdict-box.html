<!-- Verdict box: two centred lines, each on its own hard white box, the swipe's stark headline bars. Sizes are at full scale; the fit step shrinks them together. -->
<div class="area" data-fit style="justify-content:flex-start;gap:0;color:{{ink}}">
 <div class="line" style="font:400 calc(var(--s)*72px)/1.16 Display;background:{{ground}};padding:0 calc(var(--s)*20px)">{{lead}}</div>
 <div class="line" style="font:400 calc(var(--s)*72px)/1.16 Display;background:{{ground}};padding:0 calc(var(--s)*20px)">{{price}}</div>
</div>

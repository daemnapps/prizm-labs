<!-- Creator captions: a white serif italic line with a hard black drop over a plain bold phone caption, in clear space beside the subject. Sizes are at full scale; the fit step shrinks them together. -->
<div class="area" data-fit style="justify-content:flex-start;align-items:flex-start;text-align:left;gap:calc(var(--s)*18px);color:#fff;text-shadow:calc(var(--s)*2px) calc(var(--s)*2px) 0 #000,0 0 calc(var(--s)*5px) rgba(0,0,0,.8)">
 <div style="font:italic 400 calc(var(--s)*60px)/1.1 Display">{{head}}</div>
 <div class="line" style="font:700 calc(var(--s)*38px)/1.2 -apple-system,'Helvetica Neue',Sans">{{lead}}</div>
 <div style="font:700 calc(var(--s)*32px)/1.2 -apple-system,'Helvetica Neue',Sans;color:#d9d9d9">{{price}}</div>
</div>

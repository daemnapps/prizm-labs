<!-- Native serif stroke: a phone post's centred two-line caption in a white bold serif with a hard black outline. Set keep_lines to ["head"] so the writer's line break holds. Sizes are at full scale; the fit step shrinks the block. -->
<div class="area" data-fit style="justify-content:center">
 <div class="line" style="font:700 calc(var(--s)*84px)/1.2 Georgia,'Times New Roman',serif;color:#fff;-webkit-text-stroke:calc(var(--s)*9px) #000;paint-order:stroke fill">{{head}}</div>
</div>

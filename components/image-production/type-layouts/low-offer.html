<!-- Low offer: a one-line voice, a big offer line and a small line, centred low in the frame under the picture. Sizes are at full scale; the fit step shrinks them together. -->
<div class="area" data-fit style="justify-content:flex-end;gap:calc(var(--s)*12px);color:{{ink}}">
 <div class="line" style="font:400 calc(var(--s)*50px)/1.1 Display">{{lead}}</div>
 <div class="line" style="font:400 calc(var(--s)*96px)/1.04 Display;color:{{ground}}">{{price}}</div>
 <div class="line" style="font:400 calc(var(--s)*34px)/1.2 Sans;white-space:normal;max-width:92%">{{small}}</div>
</div>

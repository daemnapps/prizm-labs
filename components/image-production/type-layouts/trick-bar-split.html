<!-- Trick bar split: a square before-and-after meme held in a tall frame. A huge white condensed capital headline on the black band above the pictures, and one heavy black condensed label centred under each half on the white band below them. The set's print carries the black band, the split and the white band. Sizes are at full scale; the fit step shrinks the headline only. -->
<div class="area" data-fit style="justify-content:center">
 <div class="line" style="font:400 calc(var(--s)*150px)/1.1 Display;color:#fff;letter-spacing:.012em;text-transform:uppercase">{{head}}</div>
</div>
<div style="position:fixed;left:0;width:50%;top:81.2%;text-align:center;font:400 96px/1 Display;color:#000;text-transform:uppercase">{{left}}</div>
<div style="position:fixed;right:0;width:50%;top:81.2%;text-align:center;font:400 96px/1 Display;color:#000;text-transform:uppercase">{{right}}</div>

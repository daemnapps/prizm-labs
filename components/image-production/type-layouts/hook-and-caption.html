<!-- Hook and caption: a red bold hook with a hard white outline in the area, the offer as an outlined phone caption low in the frame at the place the set record's `foot` names. Sizes are at full scale; the fit step shrinks the hook. -->
<div class="area" data-fit style="justify-content:center">
 <div class="line" style="font:800 calc(var(--s)*70px)/1 -apple-system,'Helvetica Neue',Sans;color:#e62b2b;-webkit-text-stroke:calc(var(--s)*7px) #fff;paint-order:stroke fill">{{head}}</div>
</div>
<div style="position:fixed;left:36%;right:5%;top:79.2%;text-align:center;font:700 36px/1.2 -apple-system,'Helvetica Neue',Sans;color:#fff;-webkit-text-stroke:6px #000;paint-order:stroke fill">{{lead}}<br><span style="font-size:31px">{{price}}</span></div>

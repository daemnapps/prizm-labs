<!-- Sale and pill: one big sale word over a wide offer pill, with a bold footer line at the foot of the frame. Sizes are at full scale; the fit step shrinks the sale block, the footer keeps its place. -->
<div class="area" data-fit style="justify-content:flex-start;gap:calc(var(--s)*20px);color:{{ink}}">
 <div class="line" style="font:400 calc(var(--s)*132px)/1.04 Display">{{lead}}</div>
 <div class="line" style="font:400 calc(var(--s)*78px)/1 Display;color:#fff;background:{{ground}};border-radius:calc(var(--s)*38px);padding:calc(var(--s)*20px) calc(var(--s)*48px)">{{price}}</div>
</div>
<div style="position:fixed;left:5%;right:5%;top:75%;text-align:center;font:400 46px/1.25 Display;color:{{ink}}">{{note}}</div>

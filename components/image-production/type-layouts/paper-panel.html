<!-- Paper panel: two centred lines on a plain paper panel, set flat over a printed panel in the scene. Sizes are at full scale; the fit step shrinks them together. -->
<div class="area" data-fit style="justify-content:center;gap:calc(var(--s)*6px);background:{{ground}};box-shadow:0 0 36px 26px {{ground}};color:{{ink}}">
 <div class="line" style="font:400 calc(var(--s)*118px)/1.04 Display">{{lead}}</div>
 <div class="line" style="font:400 calc(var(--s)*118px)/1.04 Display">{{price}}</div>
</div>

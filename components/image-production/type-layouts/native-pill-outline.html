<!-- Native pill and outlined word: a phone post's black pill with one white line near the top, and one heavy white word with a hard black outline and a slight drop shadow at the foot of the frame, so the face between them stays clear. Sizes are at full scale; the fit step shrinks the pill, the foot word keeps its place. -->
<div class="area" data-fit style="justify-content:flex-start">
 <div class="line" style="font:500 calc(var(--s)*72px)/1.2 'Helvetica Neue',-apple-system,Sans;color:#fff;background:#000;border-radius:calc(var(--s)*20px);padding:calc(var(--s)*14px) calc(var(--s)*30px)">{{head}}</div>
</div>
<div style="position:fixed;left:5%;right:5%;top:80.6%;text-align:center;font:900 72px/1 'Arial Black','Helvetica Neue',-apple-system,Sans;letter-spacing:1px;color:#fff;-webkit-text-stroke:9px #000;paint-order:stroke fill;filter:drop-shadow(0 3px 2px rgba(0,0,0,.55))">{{note}}</div>

<!-- Paper tab: one line on a torn paper tab, set flat at a slight tilt inside its area, for a tab printed on a prop in the scene. Sizes are at full scale; the fit step shrinks the line. -->
<div class="area" data-fit style="justify-content:center;background:{{ground}};transform:rotate(2.5deg);clip-path:polygon(0 8%,6% 0,21% 6%,38% 1%,57% 5%,76% 0,94% 4%,100% 12%,99% 88%,92% 97%,71% 94%,50% 100%,29% 95%,12% 100%,1% 92%);color:{{ink}}">
 <div class="line" style="font:400 calc(var(--s)*42px)/1 Display">{{note}}</div>
</div>

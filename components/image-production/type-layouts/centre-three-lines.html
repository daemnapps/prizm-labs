<!-- Centre three lines: a wide tracked capital headline with a smaller line hugged under it above a clear middle band, and one line below it, all centred. Sizes are at full scale; the fit step shrinks them together. -->
<div class="area" data-fit style="justify-content:space-between;color:{{ink}}">
 <div style="display:flex;flex-direction:column;align-items:center;gap:calc(var(--s)*14px)">
  <div class="line" style="font:400 calc(var(--s)*62px)/1.1 Display;letter-spacing:.09em;text-transform:uppercase">{{head}}</div>
  <div class="line" style="font:400 calc(var(--s)*44px)/1.2 Sans">{{sub}}</div>
 </div>
 <div class="line" style="font:400 calc(var(--s)*44px)/1.2 Sans">{{foot}}</div>
</div>

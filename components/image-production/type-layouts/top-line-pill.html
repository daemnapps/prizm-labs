<!-- Top line and pill: one big line at the head of the frame, and at the foot a small line over a wide rounded pill. Sizes are at full scale; the fit step shrinks the top line, the foot keeps its place. -->
<div class="area" data-fit style="justify-content:flex-start;color:{{ink}}">
 <div class="line" style="font:400 calc(var(--s)*112px)/1.1 Display;letter-spacing:-1px">{{head}}</div>
</div>
<div style="position:fixed;left:7%;right:7%;top:79%;text-align:center;color:{{ink}}">
 <div style="font:400 32px/1.3 Sans">{{note}}</div>
 <div style="margin-top:9px;background:{{ground}};color:#fff;border-radius:44px;padding:15px 20px;font:400 36px/1 Display;white-space:nowrap">{{price}}</div>
</div>

<!-- Clearance bar: two lines of tall condensed headline, and a narrow solid bar with one white line at the foot of the frame. Sizes are at full scale; the fit step shrinks the headline, the bar keeps its place. -->
<div class="area" data-fit style="justify-content:flex-start;color:{{ink}}">
 <div class="line" style="font:400 calc(var(--s)*124px)/1.08 Impact,Display;letter-spacing:.5px">{{lead}}</div>
 <div class="line" style="font:400 calc(var(--s)*124px)/1.08 Impact,Display;letter-spacing:.5px">{{price}}</div>
 <svg viewBox="0 0 560 26" style="margin-top:calc(var(--s)*10px);width:calc(var(--s)*560px);height:calc(var(--s)*26px);overflow:visible"><path d="M4 16C120 8 300 6 556 9c-70 3-150 4-208 8 60-3 130-4 196-3" fill="none" stroke="{{ground}}" stroke-width="6" stroke-linecap="round"/></svg>
</div>
<div style="position:fixed;left:7%;right:7%;top:80.6%;height:4.1%;display:flex;align-items:center;justify-content:center;background:{{ground}};color:#fff;font:400 35px/1 Sans;white-space:nowrap">{{note}}</div>

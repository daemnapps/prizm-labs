<!-- Side descriptor: a light line, a bold category and a small line stacked beside the product, over a round arrow button. Sizes are at full scale; the fit step shrinks them together. -->
<div class="area" data-fit style="justify-content:center;gap:calc(var(--s)*18px);color:{{ink}}">
 <div class="line" style="font:400 calc(var(--s)*62px)/1.1 Sans">{{head}}</div>
 <div class="line" style="font:400 calc(var(--s)*84px)/1.05 Display;letter-spacing:.02em">{{cat}}</div>
 <div class="line" style="font:400 calc(var(--s)*40px)/1.25 Sans;white-space:normal">{{note}}</div>
 <svg style="width:calc(var(--s)*92px);height:calc(var(--s)*92px);margin-top:calc(var(--s)*14px)" viewBox="0 0 92 92"><circle cx="46" cy="46" r="46" fill="{{ink}}"/><path d="M38 28l18 18-18 18" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
</div>

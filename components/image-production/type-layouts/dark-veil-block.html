<!-- Dark veil block: one bold centred white block over a dark veil, the scene still readable through it, for a swipe that is white words on black. Sizes are at full scale; the fit step shrinks it. -->
<div style="position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.72),rgba(0,0,0,.72) 75%,rgba(0,0,0,.6))"></div>
<div class="area" data-fit style="justify-content:center;color:#fff">
 <div class="line" style="font:400 calc(var(--s)*86px)/1.2 Display;white-space:normal;max-width:100%">{{head}}</div>
</div>

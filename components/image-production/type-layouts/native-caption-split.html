<!-- Native caption split: the headline at the top of the area, the offer at its foot, so a face between them stays clear. Sizes are at full scale; the fit step shrinks them together. -->
<div class="area" data-fit style="justify-content:space-between;paint-order:stroke fill;-webkit-text-stroke:calc(var(--s)*10px) #000">
 <div class="line" style="font:400 calc(var(--s)*104px)/1.12 Sans">{{lead}}</div>
 <div class="line" style="font:400 calc(var(--s)*68px)/1.18 Sans;white-space:normal;max-width:82%">{{price}}</div>
</div>

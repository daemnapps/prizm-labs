<!-- Native caption for a thin band: headline and offer line at nearly one size, so the offer stays readable. Sizes are at full scale; the fit step shrinks them together. -->
<div class="area" data-fit style="justify-content:center;gap:calc(var(--s)*8px);paint-order:stroke fill;-webkit-text-stroke:calc(var(--s)*9px) #000">
 <div class="line" style="font:400 calc(var(--s)*76px)/1.08 Sans">{{lead}}</div>
 <div class="line" style="font:400 calc(var(--s)*68px)/1.08 Sans">{{price}}</div>
</div>

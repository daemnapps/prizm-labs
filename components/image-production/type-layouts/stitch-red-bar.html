<!-- Stitch red bar: a TikTok stitch's two labels. A white caption with a thin hard black outline over the picture, the writer's line breaks kept, and a solid red rounded bar with white words lower down. Fonts: the set's sans (TikTok Sans). Sizes are at full scale; the fit step shrinks the caption only. -->
<div class="area" data-fit style="justify-content:center">
 <div class="line" style="font:500 calc(var(--s)*53px)/1.2 Sans;color:#fff;paint-order:stroke fill;-webkit-text-stroke:calc(var(--s)*5px) #000">{{head}}</div>
</div>
<div style="position:fixed;left:5.5%;right:5.5%;top:77.2%;height:5.4%;background:#DC2B46;border-radius:12px;display:flex;align-items:center;justify-content:center;font:500 62px/1 Sans;color:#fff;white-space:nowrap">{{bar}}</div>

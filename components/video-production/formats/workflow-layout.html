<title>Format Workflow Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap">
<style>
/* Layout: one block, two printable lines, one quiet line under them. */
:root{
  --bg:#f5f6f8; --card:#ffffff; --fg:#16181d; --mute:#5d6472; --line:#dfe2e8; --live:#1f8a5b; --live-bg:#e3f4ec;
  --display:"Space Grotesk",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111318; --card:#1a1d24; --fg:#e9ebf0; --mute:#9aa1ae; --line:#2a2e37; --live:#4cc28d; --live-bg:#15301f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111318; --card:#1a1d24; --fg:#e9ebf0; --mute:#9aa1ae; --line:#2a2e37; --live:#4cc28d; --live-bg:#15301f; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 48px}
.blk{max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px 22px 18px;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-size:1.35rem;margin:0;text-wrap:balance}
.row{display:flex;gap:14px;align-items:center}
.mark{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--live-bg);color:var(--live);font-family:var(--display);font-weight:700;font-size:1.2rem}
.row b{display:block;font-family:var(--display);font-size:1.15rem}
.row span{color:var(--mute);font-size:.92rem}
.rest{border-top:1px solid var(--line);padding-top:12px;color:var(--mute);font-size:.92rem}
</style>

<div class="blk">
  <h1>What you can print</h1>
  <div class="row"><div class="mark">✓</div><div><b>Micro drama</b><span>characters act and talk on screen in one story</span></div></div>
  <div class="row"><div class="mark">✓</div><div><b>Song ad</b><span>a story told as a song, every line a shot</span></div></div>
  <div class="rest">Everything else is parked.</div>
</div>

<style>

<main id="main"><div class="empty">Loading…</div></main>
<div class="bar"><div class="in"><button id="back">Back</button><button id="restart">Restart</button><button class="go" id="next">Next</button></div></div>
<div class="sheet" id="sheet"><div class="box" id="sheetbox"></div></div>
<input type="file" id="file" accept="image/png,image/jpeg" style="display:none">
<script>
function breakdownBox(b){if(!b||!Object.keys(b).length)return '';const N={camera:'Camera',gaze:'Where she looks',manner:'How things are handled',props:'Props',continuity:'What goes where',actions:'What each action lands on',sound:'Sound',atmosphere:'Atmosphere',explainer:'Explainer',captions:'Captions',pace:'Pace'};return `<details class="vbreak" open><summary><b>The swipe, broken down</b> · what this scene must copy</summary>${(b.judge_checks||[]).length?`<p class="must"><b>The judge checks every take for:</b> ${b.judge_checks.map(esc).join(' · ')}</p>`:''}<dl>${Object.keys(N).filter(k=>(b[k]||[]).length).map(k=>`<dt>${N[k]}</dt><dd>${b[k].map(esc).join('<br>')}</dd>`).join('')}</dl></details>`}
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LOADED=Date.now(),url=p=>'/file?path='+encodeURIComponent(p)+'&v='+LOADED,   // a picture re-set in place must show new on a reload, never the browser's old copy
bg=p=>p?`background-image:url('${url(p)}')`:'';
const TITLES=['Pick a brief','Pick the elements','The words and the check','Make it'];
const CTITLES=['Pick a video','Pick what goes in','Change what you want','Make it'];
const JOB=()=>KIND==='clip'?((SEL&&SEL.job)||'clips.seedance'):'pictures.generate';   // a video made from a swipe names its own job (Genjutsu)
const FAILS={'seedream-5-pro-edit':'Seedream','gemini-3-pro-image':'Nano Banana','gpt-image-2.5':'GPT Image'};
let KIND='pic',ORIG={},O=null,STEP=0,BRAND=null,ONLYNEW=false,ONLYREADY=true,SORT='new',Q='',SEL=null,B={},R=null,T=null,OUT=null;

// every step has Back, Restart and Next (2026-10-27): on step 1 Next returns to the
// brief you had open; on the last step there is nothing after, so Next is off
function dots(){document.querySelectorAll('#dots i').forEach((d,i)=>d.classList.toggle('on',i<=STEP));
 $('#steplabel').textContent=(STEP+1)+' · '+(KIND==='clip'?CTITLES:TITLES)[STEP];
 $('#back').disabled=!STEP;
 $('#next').disabled=(STEP===0&&!SEL)||STEP===3||(STEP===1&&R&&tooMany());
 $('#next').textContent='Next'}
// the board remembers the ad you had open and the step you were on, so a reload comes back to it (2026-10-27)
function keep(){try{localStorage.setItem('pb.open',JSON.stringify(SEL&&STEP?{kind:KIND,run:SEL.run,brand:SEL.brand,step:STEP}:null))}catch(e){}}
function go(n){STEP=n;dots();(KIND==='clip'?[s1,c2,c3,s4]:[s1,s2,s3,s4])[n]();scrollTo(0,0);keep()}
$('#back').onclick=()=>go(Math.max(0,STEP-1));$('#next').onclick=()=>go(STEP+1);
$('#restart').onclick=()=>{SEL=null;B={};R=null;T=null;OUT=null;Q='';try{localStorage.removeItem('pb.open')}catch(e){}go(0)};

// 1 · pick a brief
const LIST=()=>KIND==='clip'?O.videos:O.pictures;
function s1(){const brands=[...new Set(LIST().map(p=>p.brand))];if(!brands.includes(BRAND))BRAND=brands[0];
 // in order, each labelled (2026-10-27)
 const lab=(n,t)=>`<h2 class="part" style="margin:18px 0 8px">${n} · ${t}</h2>`;
 let h=`<h1>Which ${KIND==='clip'?'video':'ad'} do you want to make?</h1>`+lab(1,'Kind of ad')+`<div class="row"><button class="big ${KIND==='pic'?'on':''}" data-k="pic">Picture ad</button><button class="big ${KIND==='clip'?'on':''}" data-k="clip">Video ad</button></div>`+
  lab(2,'Brand')+`<div class="row">`+brands.map(b=>`<button class="big ${b===BRAND?'on':''}" data-b="${b}">${b==='<brand>'?'<brand>':b[0].toUpperCase()+b.slice(1)}</button>`).join('')+`</div>`+
  lab(3,'Which ones to show')+`<div class="row"><button class="big ${ONLYNEW?'on':''}" id="onlynew">Only ones not made yet</button>${KIND==='pic'?`<button class="big ${ONLYREADY?'on':''}" id="onlyready">Ready only</button>`:''}</div>
  <div class="row"><span class="hint" style="margin:0">Sort:</span>${[['new','Newest first'],['old','Oldest first'],['num','Brief number']].map(([k,t])=>`<button class="big ${SORT===k?'on':''}" data-sort="${k}">${t}</button>`).join('')}</div>
  <p class="hint" style="margin:0">Anything already in Meta or live is not shown here. It is done.</p>`+
  lab(4,'New deliveries')+`<div class="row"><button class="big" id="deliv">Check for new deliveries</button><span class="hint" style="margin:0">${esc(delivWho())}</span></div>`+
  lab(5,'Pick a brief')+`<div class="row"><input class="search" id="q" placeholder="Search, e.g. grandma, razor bumps, 0213" value="${esc(Q)}"></div><div class="cards" id="cards"></div>`;
 $('#main').innerHTML=h;
 document.querySelectorAll('[data-b]').forEach(e=>e.onclick=()=>{BRAND=e.dataset.b;s1()});
 const dvb=$('#deliv');if(dvb)dvb.onclick=delivCheck;
 $('#onlynew').onclick=()=>{ONLYNEW=!ONLYNEW;s1()};
 document.querySelectorAll('[data-sort]').forEach(e=>e.onclick=()=>{SORT=e.dataset.sort;s1()});const orb=$('#onlyready');if(orb)orb.onclick=()=>{ONLYREADY=!ONLYREADY;s1()};
 document.querySelectorAll('[data-k]').forEach(e=>e.onclick=()=>{KIND=e.dataset.k;dots();s1()});
 $('#q').oninput=e=>{Q=e.target.value;cards()};cards()}
function cards(){const q=Q.toLowerCase().split(/\s+/).filter(Boolean);
 const list=LIST().filter(p=>p.brand===BRAND&&(!ONLYNEW||!p.made)&&(KIND!=='pic'||!ONLYREADY||p.ready)&&q.every(w=>(p.name+' '+p.run+' '+(p.brief||'')).toLowerCase().includes(w)))
  // sort (2026-10-27): newest written first by default
  .sort((a,b)=>SORT==='num'?(+(b.brief||0))-(+(a.brief||0)):SORT==='old'?(a.t||0)-(b.t||0):(b.t||0)-(a.t||0)).slice(0,90);
 // each card says its brief number and its stage in the Queue; a real customer review says so, its words are the customer's
 $('#cards').innerHTML=list.map((p,i)=>`<button class="card" data-i="${i}"><div class="im" style="${bg(p.thumb)}">${p.made?'<span class="done">Made</span>':''}</div>${p.ready===undefined?'':p.ready?'<span class="rdy ok">Ready</span>':`<span class="rdy no">Not ready: ${esc(p.first)}</span>`}${p.review?'<span class="rdy rev">Real review: nothing made up</span>':''}<b>${esc(p.name)}</b>${p.brief||p.stage?`<small class="qst">${p.brief?'Brief '+esc(p.brief):''}${p.brief&&p.stage?' · ':''}${esc(p.stage||'')}</small>`:''}</button>`).join('')||`<div class="empty">Nothing matches.${KIND==='pic'&&ONLYREADY?' Tap Ready only to see the ones that are not ready.':''}</div>`;
 document.querySelectorAll('.card').forEach(e=>e.onclick=()=>{e.style.opacity=.5;e.querySelector('b').textContent='Opening…';SEL=list[+e.dataset.i];B=KIND==='clip'?{run:SEL.run,skip:[]}:{brand:SEL.brand,run:SEL.run,product:SEL.product,skip:[],added:[]};OUT=null;R=null;load().then(()=>{if(KIND==='clip')snapOrig();go(1)})})}

// new deliveries (2026-10-27). One press:
// image-edit's delivery check reads the returned/ folder in each role's brief hand-off folders, takes the brief from the
// folder's name and brings each file to the same path in the repo; each brief then goes to the Meta approval page with
// one more press. Named by role; who fills it today is shown beside it. The board only shows.
let DV=null;
const today=x=>x.filled_by?` (${x.filled_by} today)`:'';
function delivWho(){const p=(O&&O.deliverers)||[];return p.map(x=>`${x.name}${today(x)}`).join(' · ')}
async function djob(path,body,after){const r=await fetch(path,{method:'POST',body:JSON.stringify(body)}).then(r=>r.json());
 if(r.error){DV={...(DV||{}),state:'failed',error:r.error};return delivDraw()}
 const poll=async()=>{const j=await fetch('/api/prompt-job?id='+r.id).then(r=>r.json());if(j.state==='running')return setTimeout(poll,3000);after(j)};poll()}
function delivCheck(){DV={state:'running'};$('#sheet').classList.add('on');delivDraw();
 djob('/api/prompt-delivery',{brand:BRAND},j=>{DV=j.state==='failed'?{state:'failed',error:j.error}:{state:'done',result:j.result,delivered:j.delivered};delivDraw()})}
function delivSend(label){DV.sending=label;DV.sent=null;DV.senderr=null;delivDraw();
 djob('/api/prompt-delivery-card',{brand:BRAND,label},j=>{DV.sending=null;if(j.state==='failed')DV.senderr={label,error:j.error};else{DV.delivered=j.delivered;DV.sent=label}delivDraw()})}
const vid=p=>'/media?path='+encodeURIComponent(p);
function delivTile(f){return /\.(mp4|mov|m4v)$/i.test(f)?`<video src="${vid(f)}#t=0.5" preload="metadata" muted playsinline controls style="flex:0 0 120px;width:120px;aspect-ratio:9/16;border-radius:10px;background:#000"></video>`:`<div class="bpic" style="flex:0 0 92px;${bg(f)}"></div>`}
function delivDraw(){const box=$('#sheetbox');
 let h=`<div class="row" style="justify-content:space-between;flex-wrap:nowrap"><h1 style="margin:0">New deliveries</h1><button class="big" id="dvclose">Close</button></div>`;
 if(!DV||DV.state==='running'){box.innerHTML=h+`<div class="wait">Checking the hand-off folders on the Drive: ${esc(delivWho())}…</div>`;return wireDv()}
 if(DV.state==='failed'){box.innerHTML=h+`<div class="msg no">It stopped: ${esc(DV.error)}</div>`;return wireDv()}
 const rows=DV.delivered||[];
 (DV.result.roles||[]).forEach(r=>{const who='the '+r.words,kind=r.delivers,one=kind.replace(/s$/,''),nw=new Set((r.new||[]).map(n=>n.label));
  h+=`<h2 class="part">${esc(kind[0].toUpperCase()+kind.slice(1))} from ${esc(who)}${esc(today(r))}</h2><p class="hint">They go in returned/ inside each brief's folder: ${esc(r.folder)}/&lt;brief&gt;/returned${r.confirmed?'':' · the team is confirming this folder'}</p>`;
  if(!r.found)h+=`<div class="msg no">No hand-off folder for ${esc(who)} on the Drive yet.</div>`;
  else if(r.new.length){const n=r.new.reduce((a,x)=>a+x.count,0);h+=`<div class="msg ok">✓ ${n} new ${n===1?one:kind} for ${r.new.length} brief${r.new.length===1?'':'s'}, matched and filed.</div>`}
  else h+=`<div class="msg ok">Nothing new from ${esc(who)} since the last check.</div>`;
  if(r.untagged&&r.untagged.length){const u=r.untagged.length;h+=`<div class="msg no">${u} ${u===1?one+' is':kind+' are'} in a folder that is not one of this brand's briefs, so ${u===1?'it was':'they were'} left where ${u===1?'it is':'they are'}:<ul style="margin:6px 0 0;font-weight:400">${r.untagged.map(x=>`<li>${esc(x.file)}: ${esc(x.why)}</li>`).join('')}</ul></div>`}
  rows.filter(d=>d.role===r.role).forEach(d=>{const c=d.card,sent=DV.sent===d.label,err=DV.senderr&&DV.senderr.label===d.label;
   h+=`<div class="field"><div class="lab"><span>${esc(d.brief)} <span class="hint">${esc(d.product||'')}</span></span>${nw.has(d.label)?'<span class="pill ok">New</span>':''}</div>
   <div class="clips">${d.files.map(delivTile).join('')}</div>`;
   if(sent&&c)h+=`<div class="msg ok">✓ Sent. The ${c.files} ${c.files===1?one:kind} are on the Meta approval page, in To check (${esc(c.name)}). Nothing goes live until you press Approve there.<br><a href="http://localhost:8795" target="_blank" rel="noopener">Open the Meta approval page</a></div>`;
   else if(c)h+=`<p class="hint">On the Meta approval page, in To check: ${esc(c.name)} · sent ${esc((c.at||'').replace('T',' '))}</p>`;
   if(err)h+=`<div class="msg no">It stopped: ${esc(DV.senderr.error)}</div>`;
   h+=DV.sending===d.label?`<div class="wait">Sending to the Meta approval page… about a minute</div>`:`<button class="makebtn" data-dvsend="${esc(d.label)}"${DV.sending?' disabled':''}>${c?'Send again (updates the card in To check)':`Send the ${d.files.length} to the Meta approval page`}</button>`;
   h+=`</div>`})});
 box.innerHTML=h;wireDv()}
function wireDv(){const c=$('#dvclose');if(c)c.onclick=()=>$('#sheet').classList.remove('on');
 document.querySelectorAll('[data-dvsend]').forEach(e=>e.onclick=()=>delivSend(e.dataset.dvsend))}

// the check, after every change
async function load(){try{if(B&&B.run)localStorage.setItem('pb.brief',JSON.stringify(B))}catch(e){}const r=await fetch('/api/prompt-preview',{method:'POST',body:JSON.stringify({job:JOB(),brief:B,quote:false})}).then(r=>r.json());
 if(r.error){R={error:r.error};return}R=r}
function relo(after){clearTimeout(T);T=setTimeout(async()=>{await load();after()},450)}
function tooMany(){return R&&R.findings&&R.findings.some(f=>f.id==='max-images')}
function plain(f){if(f.id==='max-images'){const m=f.say.match(/(\d+) images.*\((\d+)\)/);return m?`Too many pictures: ${m[1]}, the most is ${m[2]}. Untick one.`:f.say}
 if(f.id==='prompt-length')return 'The words are too long. Make "What is happening" shorter.';
 if(f.id==='image-format')return 'One picture is the wrong kind of file. Untick it.';
 if(f.id==='image-size')return 'One picture is too big a file. Untick it.';
 let t=String(f.say||'').replace(/\s*\((?:[A-Z]{2,4}-\d+)[^()]*(?:\([^)]*\))?[^()]*\)/g,'').replace(/\s+\./g,'.');
 if(/^(Who exactly|Their age|Their look|What they wear): missing/i.test(t))return 'Pick who is in it: one of our cast, or say who in a swap row.';
 return t}
function status(){if(!R||R.error)return `<div class="msg no">Fix this first: ${esc(R&&R.error||'this brief could not be read.')}</div>`;
 const e=R.findings.filter(f=>f.level==='error');return e.length?`<div class="msg no">Fix this first: ${esc(plain(e[0]))}</div>`:`<div class="msg ok">✓ Ready</div>`}

// 2 · the matrix: every element of the swipe (keep it or swap it, and what for), every dial (the swipe, ours, the winners)
// and every other variable, on one screen. A change to an element rebuilds the swap words from these rows.
const KINDS=[['cast','Our cast'],['product','Our product'],['drawn','Drawn from words'],['words','Words'],['library','Library photo']];
const KIND_TIP={cast:'Our banked person: their photo goes in, so the face is theirs',product:'Our real product photos go in; the model never draws the product',drawn:'Made from the words only; no extra picture goes in',words:'The words on the ad: set on top after, or drawn into the picture',library:'A banked prop or set photo goes in'};
// the element groups, in the order you pick them (2026-10-27)
const CATS=[
 ['person','The person','Who is in it: their face, age, hair. A cast swap brings our person\'s photo.',/\b(woman|man|girl|boy|person|she|he|her|his|grand|mother|father|lady|guy|model|face shape|hair|skin tone|age)\b/i],
 ['problem','The problem on screen','What is wrong and how big it is: the thing the eye hits first.',/\b(spot|spots|lips|swollen|bump|acne|wrinkle|pore|scar|rash|patch|pigment|anomaly|problem|overfilled|bulge|bulging)\b/i],
 ['props','Props and wardrobe','What she wears and holds: jewellery, clothes, objects. Swap anything that names another brand.',/\b(pendant|chain|necklace|earring|ring|garment|fur|shirt|jacket|hat|cap|glasses|bag|bottle|jar|tube|box|prop|object|tag|pouch|cup|towel|razor|brush|scrubber|device)\b/i],
 ['set','The set and the light','Where it is and how it is lit: wall, room, background, light.',/\b(wall|room|background|set|floor|ceiling|light|lit|shadow|lamp|window|bathroom|kitchen|street|texture|colou?r)\b/i],
 ['camera','The camera and the frame','How it is shot: crop, angle, distance, pose, grain.',/\b(crop|frame|framing|angle|camera|lens|shot|close|wide|high|low|pose|tilt|head|gaze|profile|9:16|4:5|grain|phone|selfie|mouth|expression|softness|blur|focus|contact point)\b/i],
 ['words','The words','The caption, headline or any text and graphics on the ad.',/\b(caption|headline|text|words|title|overlay|lettering|stroke|typography|font|attribution|stars|review|margin|margins|badge|logo)\b/i]];
function catOf(text,kind){if(kind==='cast')return 'person';if(kind==='words')return 'words';if(kind==='product')return 'props';
 const order=['words','problem','camera','person','props','set'];const byId=Object.fromEntries(CATS.map(c=>[c[0],c[3]]));
 for(const id of order)if(byId[id].test(text||''))return id;return 'set'}
function M(){const f=(R&&R.fields)||{};if(!B.swap_list){const o=f.swap_list_original||f.swap_list;if(!o)return null;B.swap_list=JSON.parse(JSON.stringify({swaps:o.swaps||[],stays:o.stays||[],words:o.words,kept_back:[]}))}return B.swap_list}
function edited(){const f=(R&&R.fields)||{};return !!f.swap_edited}
function lvName(id,lv){return lv==null?'–':scaleName(id,lv)}
function win(id){const a=(O.anatomy&&O.anatomy.dials||{})[id];return a&&a.winners_level!=null?Math.round(a.winners_level):null}
function thumb(c,big){if(!c)return'';const miss=c.exists===false;
 return `<div class="pic ${big?'swipe':'th'} ${c.on?'':'off'} ${miss?'miss':''}" data-k="${c.key}"><div class="im" style="${miss?'':bg(c.path)}">${miss?'<span class="nf">Not on file</span>':''}</div>${miss?'':'<div class="tick">✓</div>'}<b>${esc(c.label)}</b></div>`}
function s2(){const ch=(R&&R.choices)||[],f=(R&&R.fields)||{};const n=ch.filter(c=>c.on).length;const by=Object.fromEntries(ch.map(c=>[c.key,c]));
 let h=`<h1>${esc(SEL.name)}</h1>`+notesHTML();const m=M();
 if(!m){h+=`<div class="msg no">No swap list for this ad yet, so nothing can be made. The teardown writes it.</div><div class="pics">`+ch.map(c=>thumb(c)).join('')+`</div>`;$('#main').innerHTML=h;dots();wire2();return}
 h+=topMsg();
 h+=`<div class="swtop mxtop">${thumb(by.swipe,true)}<div><p class="sub" style="margin:0">Every part of the swipe is a row. <b>Keep</b> it as it is, or <b>Swap</b> it and say what it becomes. The pictures that go in follow from the rows.</p>${edited()?`<p class="hint">You changed the rows, so the swap words are rebuilt from them. <a id="mxreset" class="lnk">Put the teardown's rows back</a></p>`:''}</div></div>`;
 // A · the elements
 h+=`<h2 class="part">The elements</h2><p class="sub">Grouped the way you build the ad: the person first, then the problem, props, set, camera and words. Hover any button for what it does.</p><div class="mx">`;
 const rowSwap=(r,i)=>{const kinds=KINDS.filter(([k])=>k!=='library'||r.kind==='library'||r.ref&&String(r.ref).includes('/'));
  let pic='';if(r.kind==='cast'){const c=by['cast:'+r.ref],s=by['cast-sheet:'+r.ref];pic=c?[c,s].filter(Boolean).map(x=>thumb(x)).join(''):`<div class="pill no">Pick who</div>`}
  else if(r.kind==='library'){const c=ch.find(x=>x.key.startsWith('library:')&&x.for&&x.for.includes(r.to.slice(0,30)));pic=c?thumb(c):'<div class="pill no">Library photo not on file</div>'}
  else pic=`<div class="pill">${r.kind==='words'?((m.words==='set_on_top')?'Set on top after':'Drawn in the picture'):r.kind==='product'?'Real product photos':'Drawn from words'}</div>`;
  const cast=r.kind==='cast'?`<div class="castpick">`+castHTML(O.cast[SEL.brand]||[],c=>`<button class="cp ${r.ref===c.id?'on':''} ${c.working?'':'dead'}" data-cast="${i}" data-id="${c.id}" data-nm="${esc(c.name)}" title="Use ${esc(c.label||c.name)}: their photo goes in and the face stays theirs"><span style="${bg(c.thumb)}"></span>${esc(c.label||c.name)} <small>${esc(castTag(c))}</small></button>`)+`</div>`:'';
  return `<div class="mxrow"><div class="mxfrom"><small>In the swipe</small><textarea class="mxin" data-from="${i}" rows="2">${esc(r.from)}</textarea></div>
  <div class="seg2"><button data-keepi="${i}" title="Keep it exactly as the swipe has it">Keep</button><button class="on" title="Change it into what you write on the right">Swap</button></div>
  <div class="mxto"><small>Becomes</small><textarea class="mxin" data-to="${i}" rows="2" placeholder="Say what it becomes">${esc(r.to)}</textarea>
  <div class="kinds">${kinds.map(([k,l])=>`<button class="${r.kind===k?'on':''}" data-kind="${i}" data-k2="${k}" title="${esc(KIND_TIP[k]||'')}">${l}</button>`).join('')}</div>${cast}</div>
  <div class="mxpic">${pic}</div></div>`};
 const rowStay=(x,j)=>`<div class="mxrow stay"><div class="mxfrom"><small>In the swipe</small><b>${esc(x)}</b></div><div class="seg2"><button class="on" title="Keep it exactly as the swipe has it">Keep</button><button data-swapj="${j}" title="Turn this into a swap and say what it becomes">Swap</button></div><div class="mxto"><span class="hint">Same as the swipe</span></div><div class="mxpic"></div></div>`;
 for(const [cid,cname,ctip] of CATS){const sw=m.swaps.map((r,i)=>[r,i]).filter(([r])=>catOf(r.from+' '+r.to,r.kind)===cid);const st=m.stays.map((x,j)=>[x,j]).filter(([x])=>catOf(x,'')===cid);
  if(!sw.length&&!st.length)continue;
  h+=`<div class="mxcat"><div class="mxcath"><b>${cname}</b><span class="cnt">${sw.length} swap${sw.length===1?'':'s'} · ${st.length} kept</span></div><p class="hint">${esc(ctip)}</p>`+sw.map(([r,i])=>rowSwap(r,i)).join('')+st.map(([x,j])=>rowStay(x,j)).join('')+`</div>`}
 h+=`</div><button class="big addl" id="mxadd">+ Swap something else</button>`;
 // the product and the words
 const prod=ch.filter(c=>c.key.startsWith('product:'));const pa=String(f.product_answer||'');
 h+=`<div class="field" style="margin-top:14px"><div class="lab">Our product in this ad</div><div class="two"><button class="big ${prodOn()?'on':''}" data-s="on" title="Our real product photos go in, only the sides the swap list names">In the picture</button><button class="big ${prodOn()?'':'on'}" data-s="off" title="No product in this picture; nothing of it goes in">Not in it</button></div>${pa?`<p class="hint">The teardown says: ${esc(pa)}</p>`:''}${prodOn()&&prod.length?`<div class="needs">${prod.map(c=>thumb(c)).join('')}</div>`:''}</div>`;
 const wp=f.words_plain||[];

function summary(b){const out=[];
 if(b.product==='')out.push('Product off');if(b.people==='made-up')out.push('A made-up person');
 if(b.our_copy)out.push('Words: '+b.our_copy.join(' / '));if(b.swaps)out.push('Its own "what changes" text');

 if((b.emotions||[]).length)out.push('Feeling: '+b.emotions.join(', '));if((b.techniques||[]).length)out.push('Technique: '+b.techniques.join(', '));

 if($('#hookpart')){const w=S.workflow;const showChange=()=>{const part=$('#hookpart').value,impact=w.change_impacts[part];$('#hookvaluebox').innerHTML=part==='motion_reference'?`<label>Reference <select id="hookvalue"><option value="">Automatic selection</option><option value="none">No movement reference</option>${w.movements.map(m=>`<option value="${esc(m.id)}">${esc(m.id)} · ${esc(m.does.join(', '))}</option>`).join('')}</select></label>`:`<label>Replacement <textarea id="hookvalue" rows="4" style="width:100%">${esc(part==='spoken_line'?w.line:w.motion)}</textarea></label>`;if(part==='motion_reference')$('#hookvalue').value=w.movement_id;$('#hookimpact').innerHTML=`<p><b>Reuse:</b> ${impact.reuse.map(esc).join(', ')}.</p><p><b>Rebuild after saving:</b> ${impact.rebuild.map(esc).join(', ')}.</p>`};$('#hookpart').onchange=showChange;showChange();$('#hooksave').onclick=async()=>{const e=$('#hooksave');e.disabled=true;const r=await fetch('/api/prompt-hook-update',{method:'POST',body:JSON.stringify({run:SEL.run,part:$('#hookpart').value,value:$('#hookvalue').value})}).then(r=>r.json());if(r.error){$('#hookmsg').textContent=r.error;e.disabled=false;return}await shotsView();$('#hookmsg').textContent=r.unchanged?'No change saved; all files reused.':'Saved. No generation started. Reuse: '+r.impact.reuse.join(', ')+'. Rebuild: '+r.impact.rebuild.join(', ')+'.'}}
 document.querySelectorAll('[data-keep]').forEach(e=>e.onclick=async()=>{e.disabled=true;e.textContent='Keeping…';await fetch('/api/prompt-shot-keep',{method:'POST',body:JSON.stringify({run:SEL.run,take:e.dataset.keep})});shotsView()});
 if($('#toedit'))$('#toedit').onclick=()=>{window._view='edit';shotsView()};
 if($('#gotoedit'))$('#gotoedit').onclick=()=>{window._view='edit';shotsView()};
 document.querySelectorAll('[data-fxmake]').forEach(e=>e.onclick=async()=>{e.disabled=true;e.textContent='Starting…';await fetch('/api/prompt-effect-make',{method:'POST',body:JSON.stringify({run:SEL.run,effect:e.dataset.fxmake})});shotsView()});
 document.querySelectorAll('[data-shotok]').forEach(e=>e.onclick=async()=>{e.disabled=true;await fetch('/api/prompt-shot-approve',{method:'POST',body:JSON.stringify({run:SEL.run,section:e.dataset.shotok})});shotsView()});
 document.querySelectorAll('[data-shotfix]').forEach(e=>e.onclick=()=>{const b=document.getElementById('fix-'+e.dataset.shotfix);b.hidden=!b.hidden;if(!b.hidden)b.querySelector('textarea').focus()});
 document.querySelectorAll('[data-shotfixgo]').forEach(e=>e.onclick=async()=>{const gid=e.dataset.shotfixgo,note=document.querySelector('#fix-'+gid+' textarea').value.trim();if(!note)return;e.disabled=true;e.textContent='Sending…';const r=await fetch('/api/prompt-shot-change',{method:'POST',body:JSON.stringify({run:SEL.run,section:gid,note})}).then(r=>r.json());if(r.error){e.textContent=r.error;return}shotsView()});
 if($('#toclips'))$('#toclips').onclick=()=>{B={...B,toclips:true};load().then(c2)};
 document.querySelectorAll('[data-shotrecipe]').forEach(e=>e.onclick=async()=>{const s=S.shots.find(x=>x.id===e.dataset.shotrecipe),rec=s.picture_recipe,nm=SEL.name;KIND='pic';SEL={brand:rec.brief.brand,run:rec.brief.run,product:rec.brief.product,name:'Start frame · '+nm};B={...rec.brief,sheet:rec.sheet||{},video_shot:{run:S.run,picture:s.picture},skip:rec.brief.skip||[],added:rec.brief.added||[]};OUT=null;await load();go(1)});
 document.querySelectorAll('[data-shotopen]').forEach(e=>e.onclick=async()=>{e.disabled=true;e.textContent='Starting…';await fetch('/api/prompt-shot-open',{method:'POST',body:JSON.stringify({run:SEL.run,section:e.dataset.shotopen})});shotsView()});
 document.querySelectorAll('[data-shotmake]').forEach(e=>e.onclick=async()=>{const s=S.shots.find(x=>x.id===e.dataset.shotmake),nm=SEL.name;KIND='pic';SEL={brand:S.brand,run:s.picture_run,product:S.product,name:'Shot '+s.n+' start · '+nm};B={brand:S.brand,run:s.picture_run,product:S.product,skip:[],added:[],video_shot:{run:S.run,picture:s.picture}};OUT=null;await load();go(1)});
 clearTimeout(window._shotT);if(S.workflow_job?.state==='running'||shots.some(s=>s.picture_state==='opening'||s.remaking||s.keeping||(s.effecting||[]).length))window._shotT=setTimeout(shotsView,8000)}
function c2(){const f=R.fields||{};const calls=R.calls||[];
 if(SEL&&!String(SEL.run).startsWith('swap:')&&(!calls.length||!B.toclips))return shotsView();
 let h=`<h1>${esc(SEL.name)}</h1><p class="sub">Pick the clip, then what goes in.</p><div class="clips">`+calls.map((c,i)=>`<button class="clipt ${c.id===f.call?'on':''}" data-call="${c.id}"><div class="im" style="${bg(c.start)}"></div><b>Clip ${i+1}</b><span>${c.seconds} s · ${c.talking?'speaks':'silent'}</span></button>`).join('')+`</div>`;
 h+=`<div class="pics">`+(R.choices||[]).map(c=>{const vis=c.kind==='audio'?`<div class="im" style="display:flex;align-items:center;justify-content:center"><audio controls src="/media?path=${encodeURIComponent(c.path)}" style="width:92%"></audio></div>`:c.kind==='video'?`<div class="im"><video muted loop playsinline controls src="/media?path=${encodeURIComponent(c.path)}" style="width:100%;height:100%;object-fit:contain"></video></div>`:`<div class="im" style="${bg(c.path)}"></div>`;
  return `<div class="pic ${c.on?'':'off'}" data-ck="${c.key}" data-fixed="${c.fixed?1:''}">${vis}<div class="tick">✓</div><b>${esc(c.label)}${c.fixed?' <span class="hint">· always in</span>':''}</b></div>`}).join('')+`</div>`;
 const RF=(R.fields||{}).recipe;
 if(SEL&&String(SEL.job||'').startsWith('swipe_footage')&&RF)h+=`<h2 class="part">The start frame</h2><p class="hint">Its elements and dials are the picture steps: every Keep and Swap row, the dials and the same checks. Making it there makes this video's start frame.</p><button class="big" id="framepick">Change the start frame</button>`;
 $('#main').innerHTML=h;dots();
 if($('#framepick'))$('#framepick').onclick=async()=>{const vj=String(SEL.run).split(':')[1],nm=SEL.name;KIND='pic';SEL={brand:RF.brief.brand,run:RF.brief.run,product:RF.brief.product,name:'Start frame · '+nm};B={...RF.brief,sheet:RF.sheet||{},video_job:vj,skip:RF.brief.skip||[],added:RF.brief.added||[]};OUT=null;await load();go(1)};
 document.querySelectorAll('[data-call]').forEach(e=>e.onclick=()=>{B={run:SEL.run,call:e.dataset.call,skip:[],toclips:true};load().then(()=>{snapOrig();c2()})});
 document.querySelectorAll('[data-ck]').forEach(e=>e.onclick=ev=>{if(e.dataset.fixed||ev.target.closest('audio,video'))return;const k=e.dataset.ck;B.skip=B.skip.includes(k)?B.skip.filter(x=>x!==k):[...B.skip,k];load().then(c2)})}
// 3 · change what you want
function vlevel(id){if(B.dials&&B.dials[id]!==undefined)return B.dials[id];return ORIG[id]??null}
function vslider(id){const d=dial(id);if(!d)return'';const lv=vlevel(id),sc=d.scale,lo=sc[0],hi=sc[sc.length-1],ch=B.dials&&B.dials[id]!==undefined;const e=R.sheet&&R.sheet.recipe.sheet['dial.'+id];
 const note=e&&e.state==='not_applicable'?'<b>Not sent:</b> '+esc(e.reason):ch?'<b>Changed. Added to the look as:</b> '+esc((sc.find(x=>x.level===lv)||{}).name+', '+((sc.find(x=>x.level===lv)||{}).what||'').toLowerCase()):'<b>Recorded.</b> Reaches the clip through the scene\'s face, hands and camera.';
 return `<div class="field dial" data-d="${id}"><div class="lab">${esc(d.name)} <span class="lvl">${esc(lv==null?'not set':(sc.find(x=>x.level===lv)||{}).name)}</span></div><input type="range" min="${lo.level}" max="${hi.level}" step="1" value="${lv==null?lo.level:lv}" data-vr="${id}"><div class="ends"><span>${esc(lo.name)}</span><span>${esc(hi.name)}</span></div><div class="adds ${ch?'ch':''}">${note}</div></div>`}
function c3(){const f=R.fields||{};
 let h=`<h1>${esc(SEL.name)}</h1>`+checkHTML()+`<p class="sub">Change anything. Leave it if it looks right.</p>`;
 h+=`<div class="field"><div class="lab">What happens <a data-reset="scene">put it back</a></div><textarea data-v="scene">${esc(f.scene)}</textarea><p class="hint">One visible action every few seconds. The words she says are never typed here; they go in as her voice.</p></div>`;
 h+=`<div class="field"><div class="lab">The face <a data-reset="face">put it back</a></div><textarea class="sent" data-v="face">${esc(f.face)}</textarea></div>`;
 h+=`<div class="field"><div class="lab">The hands <a data-reset="gestures">put it back</a></div><textarea class="sent" data-v="gestures">${esc(f.gestures)}</textarea></div>`;
 h+=`<div class="field"><div class="lab">The camera</div><div class="tags">`+CAMS.map(([k,l])=>`<button class="tagb ${(B.camera_move||f.camera)===k?'on':''}" data-cam="${k}"><b>${l}</b></button>`).join('')+`</div></div>`;
 h+=`<div class="field"><div class="lab">The look <a data-reset="style">put it back</a></div><textarea class="sent" data-v="style">${esc(f.style)}</textarea></div>`;
 h+=`<div class="field"><div class="lab">How lived-in</div><div class="tags">`+[[1,'Clean'],[2,'Lived-in'],[3,'Fully lived']].map(([k,l])=>`<button class="tagb ${(B.spice??f.spice)==k?'on':''}" data-spice="${k}"><b>${l}</b></button>`).join('')+`</div></div>`;
 h+=`<h2 class="part">Dial it in</h2><div class="row">`+O.controls.presets.map(p=>`<button class="big" data-vpre="${p.id}">${esc(p.name)}</button>`).join('')+`<button class="big" data-vpre="">As it is</button></div>`+VMAIN.map(vslider).join('');
 h+=`<details data-o="vfeel" ${OPEN.has('vfeel')?'open':''}><summary>Feeling and technique</summary><div class="tags">`+O.controls.emotions.map(e=>`<button class="tagb ${(B.emotions||[]).includes(e.id)?'on':''}" data-vem="${e.id}"><b>${esc(e.name)}</b><span>${esc(e.what)}</span></button>`).join('')+`</div></details>`;
 h+=`<details><summary>See exactly what we send</summary><pre>${esc(R.prompt)}</pre></details>`;
 $('#main').innerHTML=h;dots();wireCheck();
 document.querySelectorAll('textarea.sent').forEach(t=>{t.style.height='auto';t.style.height=(t.scrollHeight+4)+'px'});
 document.querySelectorAll('[data-v]').forEach(e=>e.oninput=()=>{B[e.dataset.v]=e.value;relo(c3keep)});
 document.querySelectorAll('[data-reset]').forEach(e=>e.onclick=()=>{delete B[e.dataset.reset];load().then(c3)});
 document.querySelectorAll('[data-cam]').forEach(e=>e.onclick=()=>{B.camera_move=e.dataset.cam;load().then(c3)});
 document.querySelectorAll('[data-spice]').forEach(e=>e.onclick=()=>{B.spice=+e.dataset.spice;load().then(c3)});
 document.querySelectorAll('[data-vr]').forEach(e=>e.oninput=()=>{const id=e.dataset.vr,v=+e.value;B.dials={...(B.dials||{})};if(ORIG[id]===v)delete B.dials[id];else B.dials[id]=v;e.closest('.dial').outerHTML=vslider(id);relo(c3)});
 document.querySelectorAll('[data-vpre]').forEach(e=>e.onclick=()=>{const p=O.controls.presets.find(x=>x.id===e.dataset.vpre);B.dials={};if(p)for(const [k,v] of Object.entries(p.levels))if(ORIG[k]!==undefined&&ORIG[k]!==v)B.dials[k]=v;load().then(c3)});
 document.querySelectorAll('[data-vem]').forEach(e=>e.onclick=()=>{const k=e.dataset.vem;B.emotions=(B.emotions||[]).includes(k)?B.emotions.filter(x=>x!==k):[...(B.emotions||[]),k];load().then(c3)});
 document.querySelectorAll('details[data-o]').forEach(d=>d.ontoggle=()=>d.open?OPEN.add(d.dataset.o):OPEN.delete(d.dataset.o))}
function c3keep(){const c=document.querySelector('.check');if(c){c.outerHTML=checkHTML();wireCheck()}const p=document.querySelector('details:not([data-o]) pre');if(p)p.textContent=R.prompt}

fetch('/api/prompt-options').then(r=>r.json()).then(async o=>{O=o;let k=null;try{k=JSON.parse(localStorage.getItem('pb.open')||'null')}catch(e){}
 // a link can open one ad: /prompt#open=<run>[&step=N] (a session hands the owner the ad it just fixed)
 const hm=location.hash.match(/open=([^&]+)(?:&step=(\d))?/);if(hm){k={kind:o.pictures.some(p=>p.run===decodeURIComponent(hm[1]))?'pic':'clip',run:decodeURIComponent(hm[1]),step:+(hm[2]||2)}}
 const hit=k&&(k.kind==='clip'?o.videos:o.pictures).find(p=>p.run===k.run);
 if(!hit)return go(0);
 KIND=k.kind;BRAND=hit.brand;SEL=hit;B=KIND==='clip'?{run:SEL.run,skip:[]}:{brand:SEL.brand,run:SEL.run,product:SEL.product,skip:[],added:[]};try{const sb=JSON.parse(localStorage.getItem('pb.brief')||'null');if(sb&&sb.run===SEL.run)B=sb}catch(e){}
 await load();if(KIND==='clip')snapOrig();go(Math.min(3,k.step||1))});
</script></body></html>

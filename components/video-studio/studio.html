<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video Studio</title>
<style>
/* One front door for video work (the owner, 8 Nov): one menu, one look, always clear which brand, ad and stage.
   Look = the Storyboards board's own tokens, so every stage reads as one tool. */
:root{--bg:#eceee9;--panel:#fff;--ink:#16211c;--dim:#6b7871;--line:#d6dcd6;--green:#153c2b;--accent:#1d7a55;--soft:#f4f6f2;--hl:#e3efe8;--warn:#9a5b00}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161a18;--panel:#222826;--ink:#eef2ee;--dim:#98a49d;--line:#38413d;--green:#2f7d58;--accent:#52c79a;--soft:#1c211f;--hl:#1f3329;--warn:#f2b45a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161a18;--panel:#222826;--ink:#eef2ee;--dim:#98a49d;--line:#38413d;--green:#2f7d58;--accent:#52c79a;--soft:#1c211f;--hl:#1f3329;--warn:#f2b45a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,sans-serif;display:grid;grid-template-columns:248px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* left menu */
#rail{grid-row:1/3;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.logo{display:flex;align-items:center;gap:8px;padding:14px 14px 10px;font-weight:800;font-size:15px;letter-spacing:.02em}
.logo i{width:26px;height:26px;border-radius:7px;background:var(--green);display:grid;place-items:center;color:#fff}
.brands{display:flex;gap:4px;margin:0 12px 10px;background:var(--bg);border-radius:9px;padding:3px}
.brands button{flex:1;border:0;background:none;padding:6px 0;border-radius:7px;font-weight:600;font-size:13px;color:var(--dim)}
.brands button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
#list{flex:1;overflow:auto;padding:0 8px 8px}
details.grp summary{cursor:pointer;list-style:none}details.grp summary::-webkit-details-marker{display:none}details.grp summary::after{content:' ▸'}details.grp[open] summary::after{content:' ▾'}
.sec{font:700 11px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:12px 8px 6px}
.ad{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 9px;border-radius:8px;margin-bottom:2px}
.ad:hover{background:var(--soft)}.ad.on{background:var(--hl)}
.ad b{display:block;font-size:13px;line-height:1.25}
.ad .k{font:600 11px ui-monospace,Menlo,monospace;color:var(--dim)}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.chip{font:600 10.5px system-ui;border-radius:20px;padding:2px 7px;background:var(--bg);color:var(--dim)}
.chip.g{background:var(--hl);color:var(--accent)}
.chip.live{background:var(--accent);color:#fff}
.chip.w{background:#fff3d6;color:#8a5a00}
.foot{border-top:1px solid var(--line);padding:8px}
.foot button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:9px;border-radius:8px;text-align:left;font-weight:600;font-size:13px}
.foot button:hover,.foot button.on{background:var(--soft)}
.foot .n{margin-left:auto;background:var(--green);color:#fff;border-radius:20px;padding:1px 8px;font-size:12px}
/* header */
#scrim{display:none}
#head{grid-column:2;grid-row:1;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 18px 0;min-width:0}
.crumb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:28px}
.bb{font:800 11px system-ui;letter-spacing:.08em;background:var(--green);color:#fff;border-radius:5px;padding:3px 7px}
.crumb h1{font-size:18px;margin:0;font-weight:800;line-height:1.2}
.crumb .key{font:600 12px ui-monospace,Menlo,monospace;color:var(--dim)}
.crumb .sp{margin-left:auto}
.crumb a{font-size:12px;color:var(--dim)}
.tabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto}
.tab{display:flex;align-items:center;gap:7px;border:0;background:none;padding:9px 14px;border-bottom:3px solid transparent;font-weight:600;font-size:13.5px;color:var(--dim);white-space:nowrap}
.tab .num{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:var(--bg);color:var(--dim)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}.tab.on .num{background:var(--accent);color:#fff}
.tab.done .num{background:var(--hl);color:var(--accent)}
.tab:disabled{opacity:.45;cursor:default}
/* main */
#main{grid-column:2;grid-row:2;position:relative;min-height:0;overflow:hidden}
#main iframe{position:absolute;top:0;bottom:0;left:0;width:100%;height:100%;border:0;background:var(--bg)}
#main iframe.crop{left:-208px;width:calc(100% + 208px);top:-58px;height:calc(100% + 58px)}
#main iframe.under{top:44px;height:calc(100% - 44px)}
.verbar{position:absolute;top:0;left:0;right:0;height:44px;display:flex;gap:6px;align-items:center;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
.vb{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:5px 12px;font-size:12.5px;font-weight:600;white-space:nowrap}
.vb.on{background:var(--green);color:#fff;border-color:var(--green)}
.vedit{margin-top:8px;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px;font-weight:600;font-size:12.5px}
.empty{height:100%;display:grid;place-items:center;padding:24px;text-align:center;color:var(--dim)}
.empty h2{color:var(--ink);margin:0 0 6px;font-size:20px}
.go{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--green);color:#fff;border-radius:9px;padding:11px 18px;font-weight:700;font-size:14px;margin-top:14px}
.vers{height:100%;overflow:auto;padding:18px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.vcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.vcard video{width:100%;aspect-ratio:9/16;background:#000;border-radius:8px;display:block}
.vcard b{display:block;margin-top:8px;font-size:13.5px}
.vcard span{font-size:12px;color:var(--dim)}
.vnote{color:var(--dim);margin:0 0 14px;font-size:13px}
/* covers: per version, frame → swipe → cover, every pick and check one tap away (covers_stage.py, 12 Nov) */
.cvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.cv{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.cv.held{border-color:var(--warn)}
.cvtop{display:flex;align-items:center;gap:8px;margin-bottom:8px}.cvtop b{font-size:13.5px}.cvtop .sp{margin-left:auto}
.trio{display:grid;grid-template-columns:1fr 14px 1fr 14px 1.25fr;align-items:center;gap:4px}
.trio .ar{color:var(--dim);font-weight:700;text-align:center}
.pic{position:relative}.pic img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:7px;background:#111;display:block}
.pic .tag{position:absolute;left:4px;bottom:4px;right:4px;font:700 10.5px system-ui;color:#fff;background:rgba(0,0,0,.62);border-radius:5px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pic .none{width:100%;aspect-ratio:9/16;border-radius:7px;background:var(--soft);display:grid;place-items:center;color:var(--warn);font:700 22px system-ui}
.hl{margin:8px 0 6px;font-weight:700;font-size:13.5px}
.cks{display:flex;gap:4px;flex-wrap:wrap}
.ck{font:600 10.5px system-ui;border-radius:20px;padding:2px 7px;background:var(--hl);color:var(--accent)}
.ck.no{background:#fde7e2;color:#a3321c}.ck.na{background:var(--bg);color:var(--dim)}
.cv details{margin-top:8px;font-size:12.5px;color:var(--dim)}.cv summary{cursor:pointer;font-weight:600}
.cv dl{margin:6px 0 0;display:grid;grid-template-columns:78px 1fr;gap:4px 8px}.cv dt{font-weight:700;color:var(--ink)}.cv dd{margin:0}
.sweep{display:flex;gap:3px;margin-top:6px;overflow-x:auto}.sweep img{width:40px;aspect-ratio:9/16;object-fit:cover;border-radius:4px;opacity:.55}.sweep img.on{opacity:1;outline:2px solid var(--accent)}
.menub{display:none}
/* phone: the same studio reflowed — the menu becomes a drawer, the header stays, the stage fills the screen */
@media (max-width:760px){
 body{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);height:100dvh}
 #rail{position:fixed;inset:0 auto 0 0;width:min(86vw,320px);z-index:30;transform:translateX(-102%);transition:transform .2s;box-shadow:12px 0 32px rgba(0,0,0,.2)}
 body.drawer #rail{transform:none}
 #scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:29}
 body.drawer #scrim{display:block}
 #head{grid-column:1;grid-row:1;padding:8px 16px 0}
 .menub{display:inline-grid;place-items:center;width:34px;height:34px;border:1px solid var(--line);background:var(--bg);border-radius:9px;margin-right:2px}
 .crumb h1{font-size:15px;flex:1 1 60%;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .crumb .key,.crumb a{display:none}
 .tab{padding:9px 10px;font-size:13px}.tab .num{display:none}
 #main{grid-column:1;grid-row:2}
 #main iframe.crop{left:0;width:100%;top:0;height:100%}
 .vers{padding:12px 16px}.vgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .cvgrid{grid-template-columns:1fr}
 .ad{padding:10px 9px}
}
/* handoff: one click turns an approved idea into a brief and opens production (the owner, 9 Nov) */
#ho{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(3px)}
#ho[hidden]{display:none}
#ho .box{width:min(440px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 22px 18px;box-shadow:0 18px 48px rgba(0,0,0,.18)}
#ho .eye{font:700 11px system-ui;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
#ho h2{margin:4px 0 2px;font-size:20px}
#ho .sub{color:var(--dim);font-size:13px;margin-bottom:14px}
#ho .bar{height:8px;border-radius:5px;background:var(--soft);overflow:hidden;margin-bottom:16px}
#ho .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:5px;transition:width .45s ease}
#ho ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
#ho li{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start}
#ho .m{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:2px solid var(--line);color:var(--dim)}
#ho li.doing .m{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
#ho li.done .m{background:var(--accent);border-color:var(--accent);color:#fff}
#ho li.stopped .m{background:var(--warn);border-color:var(--warn);color:#fff}
#ho li b{display:block;font-size:14px}
#ho li span{display:block;font-size:12.5px;color:var(--dim)}
#ho li.stopped span{color:var(--warn)}
#ho li.waiting b{color:var(--dim)}
#ho li.later .m{border-style:dashed;color:var(--dim)}
#ho .box{position:relative}
#ho .act[hidden]{display:none}
#ho .x{position:absolute;top:10px;right:10px;width:30px;height:30px;border:0;border-radius:50%;background:var(--soft);color:var(--dim);font-size:14px;cursor:pointer}
#ho .x:hover{color:var(--ink,#111)}
#ho .act{display:flex;justify-content:flex-end;margin-top:16px;gap:8px}
#ho .act button{border:0;border-radius:9px;padding:9px 14px;font-weight:600;background:var(--green);color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#ho li.doing .m{animation:none}#ho .bar i{transition:none}}
.rmb{margin-right:12px;border:1px solid #d4d4d8;background:#fff;color:#b91c1c;border-radius:8px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}.rmb:hover{background:#fef2f2}.rmb:disabled{opacity:.6}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
 <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></symbol>
 <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></symbol>
 <symbol id="i-feed" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></symbol>
 <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></symbol>
 <symbol id="i-out" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></symbol>
</svg>

<aside id="rail" aria-label="Video ads">
 <div class="logo"><i><svg class="ic"><use href="#i-film"/></svg></i>Video Studio</div>
 <div class="brands" id="brands"></div>
 <nav id="list"></nav>
 <div class="foot">
  <button id="f-approve"><svg class="ic"><use href="#i-check"/></svg>Approval queue<span class="n" id="f-n">0</span></button>
  <button id="f-feed"><svg class="ic"><use href="#i-feed"/></svg>Swipe feed · new idea</button>
  <button id="f-hub"><svg class="ic"><use href="#i-feed"/></svg>Creator hub · open briefs</button>
  <button id="f-options"><svg class="ic"><use href="#i-feed"/></svg>Creative Options · order an ad</button>
  <button id="f-hf"><svg class="ic"><use href="#i-feed"/></svg>Higgsfield · every tool</button>
 </div>
</aside>

<div id="scrim" onclick="document.body.classList.remove('drawer')"></div>
<header id="head">
 <div class="crumb"><button class="menub" aria-label="Menu" onclick="document.body.classList.toggle('drawer')"><svg class="ic"><use href="#i-feed"/></svg></button><span class="bb" id="h-brand"></span><h1 id="h-title"></h1><span class="key" id="h-key"></span><span class="sp"></span><button id="h-rm" class="rmb" hidden>Remove</button><a id="h-open" target="_blank" rel="noopener">open on its own ↗</a></div>
 <div class="tabs" id="tabs"></div>
</header>

<main id="main"></main>

<div id="ho" hidden role="dialog" aria-modal="true" aria-labelledby="ho-t"><div class="box">
 <button class="x" id="ho-x" aria-label="Close: it keeps running" title="Close: it keeps running">✕</button>
 <div class="eye" id="ho-e">Handoff received</div><h2 id="ho-t"></h2><div class="sub" id="ho-s">Making the brief</div>
 <div class="bar"><i id="ho-b"></i></div><ol id="ho-l"></ol>
 <div class="act" id="ho-a" hidden><button id="ho-go">Open Production</button></div>
</div></div>
<script>
/* on the Mac the tools answer on 127.0.0.1; from the phone (over Tailscale) the same tools answer on this Mac's tailnet name */
const LOCAL = ['127.0.0.1', 'localhost'].includes(location.hostname);
const BOARD = '/board';       /* one address: the Studio serves the storyboard board and the approval page itself */
const APPROVE = '/approve';
const PHONE = () => matchMedia('(max-width:760px)').matches;
const STAGES = [['storyboard','Storyboard'],['production','Production'],['edit','Edit'],['versions','Versions'],['covers','Covers'],['approve','Approve']];
/* where the ad is, from its approval card first (live, approved, waiting, sent back), then its production */
/* where the ad is, read from the ledger (the Queue) in its own stage names; the colour says who it waits on */
const STAGE_LOOK = {idea: '', brief: '', 'brief-needs-you': 'w', making: 'g', editing: 'g', 'final-needs-you': 'w', launch: 'g', live: 'live'};
function stageChip(i){ const s = i.stage || {id: 'idea', name: 'Swipe teardown'};
  const name = s.flag === 'sent-back' ? 'Sent back' : s.name;
  return '<span class="chip ' + (s.flag === 'sent-back' ? 'w' : (STAGE_LOOK[s.id] || '')) + '">' + esc(name) + '</span>' + (i.versions ? '<span class="chip">' + i.versions + ' versions</span>' : ''); }
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const q = new URLSearchParams(location.search);
// The link speaks the glossary (Video Names): brief=0322 once an ad has its brief number, else idea=2. Old links
// (idea=brief2, n=P02) still open. The internal keys stay as the board and production folders name them.
// 2026-11-11: a number alone names a brief per brand AND product (one 0324 per product), so the link carries the
// full key (brief=acme_body-scrub_brief-0324). An old
// brief=0324 link opens only inside its own brand, and only when that brand has exactly one 0324.
const FULL = /^[a-z0-9-]+_[a-z0-9-]+_brief-\d{4}$/;
const qIdea = q.get('idea'), qRaw = q.get('brief'), qKey = qRaw && FULL.test(qRaw.toLowerCase()) ? qRaw.toLowerCase() : null, qNo = qKey ? null : qRaw;
let M = null, st = {key: qKey, lane: q.get('lane') || null, free: !q.get('brand') && !qKey, brand: q.get('brand') || (qKey ? qKey.split('_')[0] : ''), idea: qIdea ? (/^\d+$/.test(qIdea) ? 'idea-' + qIdea : qIdea.replace(/^brief(\d+)$/, 'idea-$1')) : null,
  no: qNo && /^\d{4}$/.test(qNo) ? qNo : null, n: q.get('n') || q.get('production') || (qNo && !/^\d{4}$/.test(qNo) ? qNo : null),
  stage: q.get('stage'), view: q.get('view'), ver: q.get('ver')};
const briefNo = k => (String(k || '').match(/brief-(\d+)/) || [])[1];

async function loadMenu(){ M = await (await fetch('/api/menu')).json(); if (!st.brand && M.brands && M.brands.length) st.brand = M.brands[0].id; }
function brandOf(b){ return M.brands.find(x => x.id === b) || M.brands[0]; }
const label = it => it.label || (briefNo(it.key) ? 'Brief ' + briefNo(it.key) : '');
// every lane, one identity: an item is its lane + its full brief key (video ideas and productions; picture briefs)
const laneOf = it => it.lane || 'video';
const all = b => b.ideas.concat(b.productions, b.pictures || []);
const video = b => b.ideas.concat(b.productions);
// The item a link names, inside the link's brand. Never the first brand that happens to share a number (2026-11-11: brief=0324 opened another brand's 0324).
// firstOk: an idea or production name is unique inside a brand; a bare number is not, so two hits there open nothing.
function only(test, firstOk){
  // a link that named a brand looks in that brand only; a link with no brand (st.free) looks in every brand at once
  const groups = st.free ? [M.brands] : [M.brands.filter(b => b.id === st.brand)];
  for (const group of groups) {
    const hits = [];
    for (const b of group) for (const i of video(b)) if (test(i)) hits.push({b, item: i});   // old links are video links
    if (hits.length === 1 || (hits.length && firstOk)) return hits[0];
    if (hits.length) return null;
  }
  return null;
}
function current(){
  if (st.key) {
    // the link's lane decides (lane=image); with none, the video item, else the one item with that key
    const hits = [];
    for (const b of M.brands) for (const i of all(b)) if (i.key === st.key) hits.push({b, item: i});
    const inLane = hits.filter(h => laneOf(h.item) === (st.lane || 'video'));
    if (inLane.length) return inLane[0];
    if (!st.lane && hits.length === 1) return hits[0];
    if (st.lane) return {b: brandOf(st.brand), item: null};
  }
  if (st.idea || st.n) { const hit = only(i => (st.idea && i.idea === st.idea) || (st.n && i.production === st.n), true); if (hit) return hit; }
  if (st.no) { const hit = only(i => briefNo(i.key) === st.no || (!i.key && i.production === st.no), false); if (hit) return hit; }
  return {b: brandOf(st.brand), item: null};
}
function save(){
  const p = new URLSearchParams();
  p.set('brand', st.brand);
  const it = M && !st.view ? current().item : null;
  if (it && it.key) { p.set('brief', it.key); if (laneOf(it) !== 'video') p.set('lane', laneOf(it)); } else if (st.idea) p.set('idea', String(st.idea).replace(/^idea-/, '')); else if (st.n) p.set('production', st.n);
  if (st.stage) p.set('stage', st.stage); if (st.view) p.set('view', st.view); if (st.ver) p.set('ver', st.ver);
  history.replaceState(null, '', '?' + p);
}
function drawRail(){
  $('brands').innerHTML = M.brands.map(b => '<button class="' + (b.id === st.brand ? 'on' : '') + '" data-b="' + b.id + '">' + esc(b.label) + '</button>').join('');
  $('brands').querySelectorAll('button').forEach(x => x.onclick = () => { st = {brand: x.dataset.b}; go(); });
  const b = brandOf(st.brand);
  // The list is sorted by where each ad stands (owner, 12 Nov: "clean it up, organized"): what needs him, what is being
  // made, what is still being written, then what is on Meta (folded). Ideas and productions without an idea sit together;
  // inside a group the newest comes first. One stage per ad, so a group header says it once and the chip says the detail.
  const GROUPS = [['you', 'Needs you'], ['editor', 'With the editor'], ['making', 'Being made'], ['writing', 'Being written'], ['live', 'On Meta'], ['removed', 'Removed']];
  const groupOf = i => { const s = i.stage || {id: 'idea'};
    if (i.removed) return 'removed';                           // taken off with Remove; Put back brings it back (owner, 20 Nov)
    if (i.handoff) return 'editor';                            // handed off: the editor has it (owner, 17 Nov)
    if (s.flag === 'sent-back' || /needs-you$/.test(s.id)) return 'you';
    if (s.id === 'live') return 'live';

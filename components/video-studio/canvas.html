<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scene Canvas</title>
<style>
/* Layout: scene nodes wired in order on a dotted canvas; the assembly strip pinned under it; one node's workflow opens in a side panel. */
:root{--bg:#eceee9;--dot:#d6dcd6;--surface:#FFF;--ink:#16211c;--muted:#6b7871;--line:#d6dcd6;--soft:#f4f6f2;
 --wire:#1d7a55;--wire-bg:#e3efe8;--yes:#1d7a55;--yes-bg:#e3efe8;--wait:#9A5B00;--wait-bg:#FCEFD8;--no:#B42318;--no-bg:#FDE6E3;
 --display:system-ui,-apple-system,sans-serif;--body:system-ui,-apple-system,sans-serif;--mono:ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161a18;--dot:#38413d;--surface:#222826;--ink:#eef2ee;--muted:#98a49d;--line:#38413d;--soft:#1c211f;--wire:#52c79a;--wire-bg:#1f3329;--yes:#52c79a;--yes-bg:#1f3329;--wait:#F2B45A;--wait-bg:#33270F;--no:#FF8A80;--no-bg:#3A1714;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161a18;--dot:#38413d;--surface:#222826;--ink:#eef2ee;--muted:#98a49d;--line:#38413d;--soft:#1c211f;--wire:#52c79a;--wire-bg:#1f3329;--yes:#52c79a;--yes-bg:#1f3329;--wait:#F2B45A;--wait-bg:#33270F;--no:#FF8A80;--no-bg:#3A1714;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--body)}
button,input,textarea,select{font:inherit;color:inherit}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top h1{font:800 19px/1.1 var(--display);margin:0}
.made{display:flex;align-items:center;gap:8px;font:600 13px var(--body)}
.mbar{width:120px;height:10px;border-radius:5px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}
.mbar i{display:block;height:100%;background:var(--yes);width:0;transition:width .6s}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--soft);border-radius:8px;height:34px;padding:0 12px;cursor:pointer;font:600 13px var(--body)}
.btn.go{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.sp{margin-left:auto}
.embed .top h1{display:none}.remote #pkg{display:none}.embed .top{position:sticky}
.canvas{position:relative;margin:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:20px 20px;padding:24px;min-height:300px}
.grid{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:34px 34px}
svg.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
svg.wires path{fill:none;stroke:var(--wire);stroke-width:2.4}
.node{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 8px rgba(20,24,33,.08);display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0;min-width:0}
.node.sel{outline:2px solid var(--wire);outline-offset:2px}
.node::before,.node::after{content:"";position:absolute;top:16px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--wire)}
.node::before{left:-7px}.node::after{right:-7px}
.nh{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--wire-bg);border-radius:12px 12px 0 0;font:800 13px/1.15 var(--display);color:var(--wire)}
.nh b{font:500 11px var(--mono);color:var(--muted);margin-left:auto}
.thumb{height:210px;background:var(--soft);display:grid;place-items:center;color:var(--muted);overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.cardpics{display:flex;gap:6px;flex-wrap:wrap;padding:6px 8px 8px}
.cardpics img{height:44px;width:auto;max-width:72px;object-fit:contain;background:var(--soft);border-radius:6px;padding:3px}
.cardpics.big img{height:120px;max-width:200px}
#chkov{position:fixed;inset:0;z-index:60;background:var(--bg,#f4f5f1);overflow:auto;padding:0 0 30px}
#chkov .ch{position:sticky;top:0;display:flex;gap:10px;align-items:center;padding:14px 16px;background:inherit;border-bottom:1px solid var(--line,#d6dcd6);z-index:1}
#chkov .ch b{font-size:17px}#chkov .ch .sp{flex:1}
#chkov .ch button{border:0;border-radius:9px;padding:9px 14px;font-weight:700;background:#153c2b;color:#fff}
#chkov .tally{display:flex;gap:8px}#chkov .tally span{font-weight:800;border-radius:20px;padding:4px 10px;font-size:13px}
.k-ok{background:#d9f2e1;color:#14532d}.k-no{background:#fde0dc;color:#8a1c12}.k-wait{background:#fdf1cc;color:#6b4f00}
#chkov h3{margin:18px 16px 8px;font-size:14px;text-transform:uppercase;letter-spacing:.04em;opacity:.7}
#chkov .cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:0 16px}
#chkov .cb{border:2px solid var(--line,#d6dcd6);border-radius:12px;background:var(--panel,#fff);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
#chkov .cb.no{border-color:#e0806f}#chkov .cb.ok{border-color:#8fd0a5}#chkov .cb.wait{border-color:#ecd27a}
#chkov .cb .mk{font-size:20px;font-weight:900}#chkov .cb b{font-size:13px}#chkov .cb span{font-size:12px;opacity:.75}
#chkov .cb.open{grid-column:1/-1;cursor:default}
#chkov .cb pre{white-space:pre-wrap;font:12px/1.45 inherit;margin:6px 0 0}
#chkov .cb .pp{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}#chkov .cb .pp img{height:220px;border-radius:8px}
#chkov .cb video{max-height:320px;max-width:100%;border-radius:8px;margin-top:6px}
/* Sound (2026-11-15): every sound of a scene as its own card, the swipe's next to ours (sound_board.py) */
#sndov{position:fixed;inset:0;z-index:60;background:var(--bg,#f4f5f1);overflow:auto;padding:0 0 30px}
#sndov .ch{position:sticky;top:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 16px;background:inherit;border-bottom:1px solid var(--line,#d6dcd6);z-index:1}
#sndov .ch b{font-size:17px}#sndov .ch .sp{flex:1}
#sndov .ch button.x{border:0;border-radius:9px;padding:9px 14px;font-weight:700;background:#153c2b;color:#fff}
#sndov .sc{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:6px 10px;font:600 13px var(--body);cursor:pointer;color:var(--ink)}
#sndov .sc.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#sndov .tal{display:flex;gap:8px;font:700 13px var(--body)}#sndov .tal .k-ok{color:var(--yes)}#sndov .tal .k-no{color:var(--no)}
#sndov h3{margin:18px 16px 8px;font:800 14px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
#sndov .sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;padding:0 16px}
#sndov .sd{border:2px solid var(--line);border-radius:12px;background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
#sndov .sd.no{border-color:#e0806f}#sndov .sd.ok{border-color:#8fd0a5}
#sndov .sh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}#sndov .sh b{font:800 15px var(--display)}
#sndov .sh .t{font:500 12px var(--mono);color:var(--muted);margin-left:auto}
#sndov .ab{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#sndov .ab div{display:flex;flex-direction:column;gap:3px;min-width:0}
#sndov .ab span,#sndov .mf span{font:700 11px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
#sndov audio{width:100%;height:34px}
#sndov .mf{display:flex;flex-direction:column;gap:3px;background:var(--soft);border-radius:8px;padding:8px}
#sndov .mf p{margin:0;font:13px/1.35 var(--body);overflow-wrap:anywhere}
#sndov .ck{display:flex;gap:6px;flex-wrap:wrap}
#sndov .ck i{font-style:normal;font:600 12px var(--body);padding:4px 8px;border-radius:999px;background:var(--soft);cursor:help}
#sndov .ck i.ok{background:var(--yes-bg);color:var(--yes)}#sndov .ck i.no{background:var(--no-bg);color:var(--no)}
#sndov .both{align-self:flex-start;border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:5px 10px;font:600 12px var(--body);cursor:pointer;color:var(--ink)}
#sndov .empty{padding:24px 16px;color:var(--muted)}
@media (max-width:520px){#sndov .ab{grid-template-columns:1fr}}
#povov{position:fixed;inset:0;z-index:60;background:var(--bg,#f4f5f1);overflow:auto;padding:0 0 30px}
#povov .pvhead{position:sticky;top:0;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:14px 16px;background:inherit;border-bottom:1px solid var(--line,#d6dcd6);z-index:1}
#povov .pvhead div{display:flex;flex-direction:column;gap:3px}#povov .pvhead b{font-size:17px}#povov .pvhead span{font-size:13px;opacity:.7}#povov .pvhead em{font-style:normal;font-weight:700}
#povov .pvhead button{border:0;border-radius:9px;padding:9px 14px;font-weight:700;background:#153c2b;color:#fff}
#povov .pvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:16px}
#povov figure{margin:0;border:2px solid var(--line,#d6dcd6);border-radius:14px;overflow:hidden;position:relative;display:flex;flex-direction:column;background:var(--panel,#fff)}
#povov figure.on{border-color:#153c2b;box-shadow:0 0 0 3px #f7c93b}
#povov figure i{position:absolute;top:8px;left:8px;z-index:1;font-style:normal;background:#153c2b;color:#fff;font-weight:800;width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
#povov video{width:100%;aspect-ratio:9/16;object-fit:cover;background:#000;display:block}
#povov figcaption{padding:8px 10px;display:flex;flex-direction:column;gap:3px;font-size:13px}#povov figcaption span{opacity:.7}
#povov figure button{margin:0 10px 10px;padding:9px;border-radius:9px;border:0;background:#153c2b;color:#fff;font-weight:700}
#povov figure.on button{background:#f7c93b;color:#111}
.thumb .dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.7);color:#fff;font:500 11px var(--mono);padding:2px 5px;border-radius:4px}
.hatch{background:repeating-linear-gradient(135deg,var(--soft) 0 8px,var(--surface) 8px 14px)}
.st{display:flex;align-items:center;gap:5px;font:600 12px var(--body);padding:7px 10px;border-top:1px solid var(--line)}
.st.made{color:var(--yes)}.st.waiting{color:var(--wait)}.st.changed,.st.ready{color:var(--wire)}.st.running{color:var(--wire)}
body.planned .stripwrap{position:static;box-shadow:none}
.mplan{margin:12px 16px 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.mplan summary{font:800 14px var(--display);cursor:pointer}
.mrow{display:grid;grid-template-columns:90px minmax(0,1fr) minmax(0,1.3fr) minmax(0,1.3fr);gap:14px;padding:12px 0;border-top:1px solid var(--line);font-size:12.5px;line-height:1.45}
.mrow:first-child{border-top:0}
.mrow img.pic{width:90px;height:160px;object-fit:cover;border-radius:8px;background:var(--soft)}
.mrow h4{margin:0 0 4px;font:800 13px var(--display)}.mrow .k{font:600 10.5px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.mrow .sh{display:flex;gap:8px;margin-bottom:6px}.mrow .sh img{width:36px;height:64px;object-fit:cover;border-radius:4px;flex:none}
.mrow ol{margin:0;padding-left:18px}.mrow .mut{color:var(--muted)}
@media (max-width:820px){.mrow{grid-template-columns:70px minmax(0,1fr)}.mrow img.pic{width:70px;height:124px}.mrow>div:nth-child(n+3){grid-column:1/-1}}
.crow{padding:12px 0;border-top:1px solid var(--line);font-size:12.5px}.crow:first-child{border-top:0}
.crow h4{margin:0 0 6px;font:800 13px var(--display)}.crow .warn{color:#c0392b;font-weight:700;margin:2px 0 6px}
.crow .ins{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.crow .in{flex:none;width:92px;font:500 10.5px/1.3 var(--mono);color:var(--muted)}
.crow .in img{display:block;width:92px;height:120px;object-fit:cover;border-radius:6px;background:var(--soft);margin-bottom:3px}
.crow .in .tag{display:flex;align-items:center;justify-content:center;width:92px;height:120px;border-radius:6px;background:var(--soft);margin-bottom:3px;text-align:center;padding:6px;box-sizing:border-box}
.crow .in.product img,.crow .in.texture img{outline:2px solid var(--accent, #2f6fed)}
.chainbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--surface);font:500 12px var(--mono);color:var(--muted)}
.chainbar b{font:800 12px var(--display);color:inherit}
.chainbar .cs{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;background:var(--soft)}
.chainbar .cs.done{background:#dcfce7;color:#166534}.chainbar .cs.stopped{background:#fee2e2;color:#991b1b}.chainbar .cs.waiting{background:#fef9c3;color:#854d0e}
.chainbar .q{margin-left:auto;font-weight:700;color:inherit}
.plan{padding:6px 10px 9px;border-top:1px dashed var(--line);font-size:11px;line-height:1.35;display:flex;flex-direction:column;gap:5px}
.plan .pt{font:800 12px var(--display)}.plan .pp{color:var(--muted);font-size:11px}
.plan .ps .w{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-family:inherit;color:var(--muted)}
.plan .ps{display:flex;gap:6px;align-items:flex-start}.plan .ps img{width:34px;height:60px;object-fit:cover;border-radius:4px;flex:none;background:var(--soft)}
.plan .ps span{font:500 10px/1.35 var(--mono);color:var(--muted);min-width:0}.plan .ps em{font-style:normal}.plan .ps i{font-style:normal;color:inherit}
.plan ol{margin:0;padding-left:16px;font-size:11px;color:var(--muted)}.plan .more{font:500 10px var(--mono);color:var(--muted)}
.cast{display:flex;flex-wrap:wrap;gap:6px;padding:6px 10px 0}.cast span{display:inline-flex;align-items:center;gap:4px;font:600 10.5px var(--mono);color:var(--muted)}
.cast img{width:22px;height:22px;border-radius:50%;object-fit:cover}
.thumb .from.ours{background:rgba(22,101,52,.85)}
.canvas{padding-bottom:240px}
.thumb .from{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.7);color:#fff;font:500 10.5px var(--mono);padding:2px 6px;border-radius:4px}
.steps{display:flex;flex-wrap:wrap;gap:4px;padding:0 10px 9px}
.steps span{display:inline-flex;align-items:center;gap:3px;font:500 10.5px var(--mono);background:var(--soft);border-radius:4px;padding:2px 5px;color:var(--muted)}
/* strip */
.stripwrap{position:sticky;bottom:0;z-index:4;box-shadow:0 -8px 24px rgba(20,24,33,.10);margin:0 16px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sh h2{font:800 16px var(--display);margin:0}
.strip{display:flex;gap:3px;height:92px;align-items:stretch}
.slot{flex:var(--w) 1 0;min-width:22px;border-radius:7px;position:relative;overflow:hidden;border:1px solid var(--line);cursor:pointer;padding:0;background:var(--soft)}
.slot.made{border:2px solid var(--yes);background:#000}
.slot img{width:100%;height:100%;object-fit:cover;display:block;opacity:.92}
.slot .lb{position:absolute;left:4px;top:4px;font:600 11px var(--mono);background:var(--surface);color:var(--ink);border-radius:4px;padding:1px 4px}
.slot .ic{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);color:var(--wait)}
.slot.land{animation:land .7s cubic-bezier(.2,.8,.2,1)}
@keyframes land{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
.axis{display:flex;justify-content:space-between;font:500 11px var(--mono);color:var(--muted);margin-top:5px}
/* Song track (owner, 17 Nov 2026): a sung ad's song sits on top of the Assembly, its sections as blocks; scenes snap to it */
.songrow{margin-bottom:8px}.songrow[hidden]{display:none}
.songhd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;font:600 13px var(--body)}
.songhd b{font:800 14px var(--display)}.songhd .chip{font:600 12px var(--body);padding:2px 9px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--muted)}
.songhd .chip.ok{background:var(--yes-bg);color:var(--yes);border-color:transparent}.songhd .chip.wait{background:var(--wait-bg);color:var(--wait);border-color:transparent}.songhd .chip.no{background:var(--no-bg);color:var(--no);border-color:transparent}
.songhd .btn{height:28px;padding:0 10px}
.songtrack{display:flex;gap:3px;height:34px}
.sec{flex:var(--w) 1 0;min-width:18px;border-radius:7px;color:#fff;font:700 11px var(--body);padding:3px 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:flex;flex-direction:column;justify-content:center;line-height:1.15}
.sec i{font:500 10px var(--mono);font-style:normal;opacity:.85}.sec.planned{opacity:.55;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.18) 0 6px,transparent 6px 12px)}
.sec.gap{background:var(--soft);color:var(--muted);border:1px dashed var(--line)}
.s-verse{background:#3b6fd8}.s-chorus{background:#1d7a55}.s-pre{background:#2a9d9d}.s-bridge{background:#8a4fd0}.s-break{background:#c08a2b}.s-intro,.s-outro{background:#6b7871}.s-other{background:#4d5752}
.songboxes{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.songboxes pre{flex:1 1 260px;margin:0;max-height:110px;overflow:auto;white-space:pre-wrap;font:12px/1.4 var(--mono);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.slot .on{position:absolute;left:4px;bottom:4px;font:700 10px var(--body);color:#fff;border-radius:4px;padding:1px 4px}
/* panel */
.panel{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-12px 0 32px rgba(0,0,0,.14);transform:translateX(105%);transition:transform .22s;z-index:20;display:flex;flex-direction:column}
.panel.open{transform:none}
.ph{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ph h3{margin:0;font:800 17px/1.2 var(--display);flex:1}
.pb{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.pb video{width:100%;max-width:240px;aspect-ratio:9/16;background:#000;border-radius:10px;align-self:center}
.words{background:var(--soft);border-radius:8px;padding:10px;font-size:14px}
.step{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.step .t{display:flex;align-items:center;gap:6px;padding:7px 10px;background:var(--wire-bg);color:var(--wire);font:600 12.5px var(--mono)}
.step .t.wait{background:var(--wait-bg);color:var(--wait)}
.step .f{display:grid;grid-template-columns:70px minmax(0,1fr);gap:6px 8px;padding:9px 10px;align-items:center;font-size:13px}
.step .f label{color:var(--muted);font-size:12px}
.step input,.step textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 7px;font:500 13px var(--mono)}
.step textarea{font-family:var(--body);min-height:44px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{font-size:13px;color:var(--muted)}.msg.err{color:var(--no)}
.run{font:500 12px var(--mono);color:var(--muted);background:var(--soft);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere}
/* how each AI shot was made */
.how{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.how>h4{margin:0;padding:9px 12px;background:var(--wire-bg);color:var(--wire);font:700 13px var(--body);display:flex;gap:8px;align-items:center}
.how>h4 small{margin-left:auto;font:500 11px var(--mono);color:var(--muted)}
.chain{display:flex;flex-direction:column;gap:0;padding:10px 12px}
.hs{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
.hs:first-child{border-top:0}
.hs .m img,.hs .m video{width:96px;aspect-ratio:9/16;object-fit:cover;border-radius:7px;background:#000;display:block}

<script>
const N = new URLSearchParams(location.search).get('brief') || '0322';
if (new URLSearchParams(location.search).get('embed')) document.documentElement.classList.add('embed');
if (!['127.0.0.1', 'localhost'].includes(location.hostname)) document.documentElement.classList.add('remote');   // on the phone: HyperFrames editing stays on the Mac
let S = null, sel = null, prevMade = new Set(), SONG = null, CH = null;
const $ = id => document.getElementById(id);
// the owner, 10 Nov: one button begins production's next stage, as Make the brief began this one (video_studio.next_state)
async function drawNext(){ try { const j = await (await fetch('/api/next/' + N)).json(); $('nextstep').querySelector('span').textContent = j.running ? 'Running: ' + j.running + '…' : 'Next: ' + j.label; $('nextstep').dataset.due = j.due || j.running || ''; } catch (_) {} }
$('nextstep').onclick = () => parent.postMessage($('nextstep').dataset.due ? {next: N} : {go: 'versions'}, '*');
$('throughstep').onclick = () => parent.postMessage({next: N, through: true}, '*');
drawNext(); setInterval(drawNext, 5000);
// a production with a clip board (briefs/<n>/pov-board/) shows it on Production: the owner picks the clips that become
// its variations right here, not on a separate page
let POV = null;
fetch('/files/' + N + '/pov-board/candidates.json', {cache: 'no-store'}).then(r => r.ok ? r.json() : null).then(j => { if (j && j.length) { POV = j; $('povpick').hidden = false; } }).catch(() => {});
$('povpick').onclick = () => {
  const key = 'povpicks-' + N; let on = new Set(); try { on = new Set(JSON.parse(localStorage.getItem(key) || '[]')); } catch (_) {}
  let ov = $('povov'); if (!ov) { ov = document.createElement('div'); ov.id = 'povov'; document.body.append(ov); }
  const draw = () => {
    ov.innerHTML = '<div class="pvhead"><div><b>Pick clips for variations</b><span>Each pick becomes its own version: same voice, banners and pop-ups, that clip\'s footage.</span>'
      + '<em>' + (on.size ? 'Your picks: ' + [...on].sort((a, b) => a - b).join(', ') + ' → tell Claude these numbers' : 'Tap Pick on the ones you want.') + '</em></div><button id="pvx">Close</button></div><div class="pvgrid">'
      + POV.map(c => '<figure class="' + (on.has(c.pick) ? 'on' : '') + '"><i>' + c.pick + '</i><video src="/files/' + N + '/pov-board/' + c.video + '" poster="/files/' + N + '/pov-board/' + c.poster + '" controls playsinline muted preload="none"></video>'
        + '<figcaption><b>' + esc(c.label.replace('(in v5)', '').trim()) + '</b><span>' + esc(c.note || '') + '</span></figcaption><button data-n="' + c.pick + '">' + (on.has(c.pick) ? 'Picked ✓' : 'Pick') + '</button></figure>').join('') + '</div>';
    $('pvx').onclick = () => ov.remove();
    ov.querySelectorAll('button[data-n]').forEach(b => b.onclick = () => { const n = +b.dataset.n; on.has(n) ? on.delete(n) : on.add(n); try { localStorage.setItem(key, JSON.stringify([...on])); } catch (_) {} draw(); });
  };
  draw();
};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Checks (owner, 12 Nov): every check the production ran, as blocks; tap one for what it saw (checks_board.py)
async function checkCount(){
  const j = await (await fetch('/api/checks/' + N, {cache: 'no-store'})).json().catch(() => null);
  if (j) $('checks').querySelector('span').textContent = 'Checks · ' + (j.fails ? j.fails + ' ✗' : 'all ✓');
  return j;
}
$('checks').onclick = async () => {
  const j = await checkCount(); if (!j) return;
  let ov = $('chkov'); if (!ov) { ov = document.createElement('div'); ov.id = 'chkov'; document.body.append(ov); }
  const pass = j.checks.filter(c => c.ok === true).length;
  const groups = [...new Set(j.checks.map(c => c.group))];
  const cls = c => c.ok === true ? 'ok' : c.ok === false ? 'no' : 'wait';
  const mk = c => c.ok === true ? '✓' : c.ok === false ? '✗' : '–';
  ov.innerHTML = '<div class="ch"><b>Checks</b><div class="tally"><span class="k-ok">' + pass + ' ✓</span><span class="k-no">' + j.fails + ' ✗</span><span class="k-wait">' + j.open + ' –</span></div><span class="sp"></span><button id="chx">Close</button></div>'
    + groups.map(g => { const cs = j.checks.filter(c => c.group === g); const bad = cs.filter(c => c.ok === false).length;
      return '<h3>' + esc(g) + ' · ' + (bad ? bad + ' ✗' : '✓') + '</h3><div class="cg">' + cs.map(c => '<div class="cb ' + cls(c) + '" data-i="' + j.checks.indexOf(c) + '"><div class="mk">' + mk(c) + '</div><b>' + esc(c.name) + '</b><span>' + esc(c.short) + '</span></div>').join('') + '</div>'; }).join('');
  $('chx').onclick = () => ov.remove();
  ov.querySelectorAll('.cb').forEach(b => b.onclick = () => {
    if (b.classList.contains('open')) return;
    const c = j.checks[+b.dataset.i]; b.classList.add('open');
    b.innerHTML += (c.pics.length ? '<div class="pp">' + c.pics.map(p => '<img src="' + esc(p) + '" loading="lazy">').join('') + '</div>' : '')
      + (c.video ? (c.video.endsWith('.mp3') ? '<audio src="' + esc(c.video) + '" controls></audio>' : '<video src="' + esc(c.video) + '" controls playsinline muted loop></video>') : '')
      + (c.detail ? '<pre>' + esc(c.detail) + '</pre>' : '');
  });
};
checkCount();
// Sound (2026-11-15): every sound of a scene as its own card: the swipe's clip and ours side by side, what ours is
// made from, and three checks (lands on the frame, sits over or under the music by the swipe's amount, matches by ear).
// Built by sound_board.py into briefs/<n>/sound/; read here through the /files route.
async function soundIndex(){ try { const r = await fetch('/files/' + N + '/sound/index.json', {cache: 'no-store'}); return r.ok ? await r.json() : null; } catch (_) { return null; } }
soundIndex().then(ix => { if (!ix || !ix.scenes) return; const f = Object.values(ix.scenes).reduce((a, s) => a + (s.fails || 0), 0);
  $('sound').querySelector('span').textContent = 'Sound · ' + (f ? f + ' ✗' : 'all ✓'); });
$('sound').onclick = async () => {
  const ix = await soundIndex(); const scenes = ix && ix.scenes ? Object.keys(ix.scenes) : [];
  let ov = $('sndov'); if (!ov) { ov = document.createElement('div'); ov.id = 'sndov'; document.body.append(ov); }
  let cur = scenes.includes(sel) ? sel : scenes[0];
  const fu = rel => '/files/' + N + '/' + String(rel).split('/').map(encodeURIComponent).join('/');

    + (j.review && !run ? '<a class="btn" href="' + esc(j.review) + '" target="_blank"><svg class="ic"><use href="#i-browser"/></svg>Setup page</a>' : '') + '</div>'
    + '<div class="mg"><div>' + vid + '</div><div class="beats">' + beats + '</div></div>' + rows + shots + gaps
    + (j.error ? '<div class="msg err">' + esc(j.error) + '</div>' : '')
    + (run ? '' : '<div class="row2" style="margin-top:8px"><button class="btn' + (sh ? '' : ' go') + '" id="d-inj"><svg class="ic"><use href="#i-cam"/></svg>' + (sh ? 'Direct again' : 'Direct this scene') + '</button>'
      + '<button class="btn' + (sh ? ' go' : '') + '" id="d-set"' + (sh ? '' : ' disabled') + '><svg class="ic"><use href="#i-browser"/></svg>' + (j.review ? 'Rebuild the setup page' : 'Build the setup page') + '</button></div>')
    + '<div class="msg" id="d-msg"></div></div>';
  clearTimeout(dirTimer); if (run) dirTimer = setTimeout(() => { dirBox(id); motionBox(id); }, 5000);
  const go = async what => { const r = await fetch('/api/direction/' + N + '/' + id + '/' + what, {method: 'POST', body: '{}'});
    const k = await r.json().catch(() => ({})); if (!r.ok) { $('d-msg').textContent = k.error || 'Could not start'; $('d-msg').className = 'msg err'; return; } dirBox(id); };
  if ($('d-inj')) $('d-inj').onclick = () => go('inject');
  if ($('d-set')) $('d-set').onclick = () => go('setup');
}
// Motion: the scene's motion read from a clip (the swipe, a phone act-out, a 3D blocking), watched as skeletons beside the
// scene's lines, and passed or held by the motion chain's own checks before any paid take (components/motion; nobody is
// asked: a held motion shows its reason, and Override records a person passing it).
let MOT = {}, motTimer = null;
async function motionBox(id){
  const box = $('motionbox'); if (!box || sel !== id) return;
  const j = await (await fetch('/api/motion/' + N + '/' + id)).json().catch(() => null);
  if (!j || sel !== id) return;
  MOT = j; const m = j.motion || {}, st = j.status;
  const chip = st === 'ready' ? '<span class="chip ok"><svg class="ic" style="width:13px;height:13px"><use href="#i-check"/></svg>' + (m.kind === 'directed' ? 'Our direction · ready' : 'Programmed · ready') + '</span>'
    : st === 'approved' ? '<span class="chip ok"><svg class="ic" style="width:13px;height:13px"><use href="#i-check"/></svg>' + (m.override ? 'Passed by override' : m.kind === 'directed' ? 'Our direction · ready' : 'Passed its checks') + '</span>'
    : st === 'held' ? '<span class="chip no" title="' + esc(((m.decided || {}).held || []).join(' · ')) + '">Held: ' + esc((((m.decided || {}).held || [])[0] || 'its checks failed').slice(0, 70)) + '</span>'
    : st === 'tracked' ? '<span class="chip wait">Not checked yet</span>'
    : st === 'reading' ? '<span class="chip wait"><svg class="ic" style="width:13px;height:13px"><use href="#i-refresh"/></svg>Reading…</span>'
    : j.error ? '<span class="chip no">Failed</span>' : '<span class="chip">No motion yet</span>';
  const vid = j.urls.overlay || j.urls.skeleton;
  const left = vid && st !== 'reading' ? '<video src="' + esc(vid) + '" autoplay muted loop playsinline controls></video>'
    : '<div class="empty2">' + (st === 'reading' ? ((j.reading || {}).kind === 'programmed' ? 'Programming the motion from the take…<br>about four minutes' : 'Reading the motion of ' + esc((j.reading || {}).file || 'the clip') + '…<br>about a minute') : (j.has_take ? 'Program the motion<br>from the take' : 'Write the take first,<br>then program its motion')) + '</div>';
  const beats = (j.beats || []).map(b => '<div class="beat">' + (b.speaker ? '<i>' + esc(b.speaker) + '</i>' : '') + '<span>' + esc(b.say) + '</span></div>').join('') || '<div class="msg">No lines in this scene.</div>';
  const kind = {directed: ['i-cam', 'our direction'], programmed: ['i-box', 'programmed from the take'], phone: ['i-phone', 'phone act-out'], swipe: ['i-film', 'swipe'], '3d': ['i-box', '3D blocking']}[m.kind] || ['i-film', 'clip'];
  const nums = j.motion ? '<div class="nums"><span><svg class="ic" style="width:14px;height:14px"><use href="#' + kind[0] + '"/></svg>' + esc(kind[1]) + ' · ' + (m.to - m.from).toFixed(1) + ' s</span>'
    + (m.people_max != null ? '<span><svg class="ic" style="width:14px;height:14px"><use href="#i-run"/></svg>' + m.people_max + ' people max · seen in ' + Math.round(100 * m.frames_with_people / Math.max(1, m.frames)) + '%</span>' : '')
    + (m.hands_seen != null ? '<span><svg class="ic" style="width:14px;height:14px"><use href="#i-hand"/></svg>' + m.hands_seen + '</span><span><svg class="ic" style="width:14px;height:14px"><use href="#i-face"/></svg>' + m.faces_seen + '</span>' : '')
    + '<span>$' + (m.cost_usd || 0).toFixed(2) + '</span></div>'
    + (j.camera ? '<div class="nums"><span><svg class="ic" style="width:14px;height:14px"><use href="#i-cam"/></svg>' + esc(j.camera) + '</span></div>' : '') : '';
  const sw = j.swipe ? '<button class="btn" id="mo-sw"><svg class="ic"><use href="#i-film"/></svg>Use the swipe</button><input type="number" id="mo-from" step="0.5" min="0" value="' + (m.kind === 'swipe' ? m.from : 0) + '" title="from (s)"><input type="number" id="mo-to" step="0.5" min="0" value="' + (m.kind === 'swipe' ? m.to : Math.min(14, j.swipe.seconds)) + '" title="to (s)"><span class="msg">s of ' + j.swipe.seconds + '</span>' : '';
  box.innerHTML = '<div class="mo"><div class="mh"><svg class="ic"><use href="#i-run"/></svg><b>Motion</b>' + chip + '<span class="sp"></span>'
    + (st === 'held' || st === 'tracked' ? '<button class="btn" id="mo-ok" title="Pass this motion yourself; the chain records it as an override"><svg class="ic"><use href="#i-check"/></svg>Override</button>' : '') + '</div>'
    + '<div class="mg"><div>' + left + '</div><div class="beats">' + beats + '</div></div>' + nums
    + (j.error ? '<div class="msg err">' + esc(j.error) + '</div>' : '')
    + (st === 'reading' ? '' : (j.motion ? '' : '<div class="row2" style="margin-top:4px"><button class="btn go" id="mo-prog"' + (j.has_take ? '' : ' disabled') + '><svg class="ic"><use href="#i-box"/></svg>Program from the take</button></div>')
      + '<details style="margin-top:8px"><summary class="msg" style="cursor:pointer">Redo the motion: program again, a phone act-out or the swipe</summary>'
      + (j.motion ? '<div class="row2" style="margin-top:4px"><button class="btn" id="mo-prog"' + (j.has_take ? '' : ' disabled') + '><svg class="ic"><use href="#i-box"/></svg>Program again from the take</button></div>' : '')
      + '<div class="row2" style="margin-top:4px"><label class="drop" id="mo-drop" style="flex:1"><svg class="ic" style="vertical-align:-4px"><use href="#i-phone"/></svg> Drop a phone video (or a 3D render)<input type="file" id="mo-file" accept="video/*" hidden></label></div>'
      + '<div class="row2"><select class="btn" id="mo-kind"><option value="phone">phone act-out</option><option value="3d">3D blocking</option></select>' + sw + '</div></details>')
    + '<div class="msg" id="mo-msg"></div></div>';
  clearTimeout(motTimer); if (st === 'reading') motTimer = setTimeout(() => motionBox(id), 4000);
  if ($('mo-ok')) $('mo-ok').onclick = async () => { $('mo-ok').disabled = true; await fetch('/api/motion/' + N + '/' + id + '/approve', {method: 'POST', body: '{}'}); motionBox(id); };
  if ($('mo-prog')) $('mo-prog').onclick = () => motionGo(id, '/program', '{}');
  if ($('mo-sw')) $('mo-sw').onclick = () => motionGo(id, '/swipe', JSON.stringify({from: +$('mo-from').value, to: +$('mo-to').value}));
  const drop = $('mo-drop'); if (!drop) return;
  const send = f => { if (!f) return; $('mo-msg').textContent = 'Sending ' + f.name + ' (' + (f.size / 1e6).toFixed(1) + ' MB)…';
    motionGo(id, '/upload?name=' + encodeURIComponent(f.name) + '&kind=' + $('mo-kind').value, f); };
  $('mo-file').onchange = e => send(e.target.files[0]);
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('on'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('on'); }));
  drop.addEventListener('drop', e => send(e.dataTransfer.files[0]));
}
async function motionGo(id, path, body){
  const r = await fetch('/api/motion/' + N + '/' + id + path, {method: 'POST', body});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { $('mo-msg').textContent = j.error || 'Could not start'; $('mo-msg').className = 'msg err'; return; }
  motionBox(id);
}
async function howMade(id){
  const box = $('howbox'); if (!box) return;
  if (!CM) CM = ((await (await fetch('/api/clipmodels')).json().catch(() => null)) || {}).models || [];
  const j = await (await fetch('/api/clip/' + N + '/' + id)).json().catch(() => null);
  if (!j || !j.shots || !j.shots.length) return;
  box.innerHTML = j.shots.map(x => '<div class="how"><h4>How this AI shot was made · ' + esc(x.name) + '<small>' + esc(x.kind) + '</small></h4>'
    + cmBar(x)
    + '<div class="proc ' + (x.on_house ? 'ok' : 'off') + '">' + (x.on_house ? '✓ ' : '✕ ') + esc(x.process || '') + (x.on_house ? '' : '<br><span>The process now: ' + esc(x.house) + '</span>') + '</div><div class="chain">'
    + (x.ref ? '<div class="hs"><div class="m">' + media(x.ref) + '</div><div><b>The reference it starts from</b><div class="mod">' + esc(x.ref) + '</div></div></div>' : '')
    + x.steps.map(t => '<div class="hs"><div class="m">' + media(t.out) + '</div><div><b>' + esc(t.what) + '</b><div class="mod">' + esc(t.model || '') + (t.settings ? ' · ' + esc(Object.entries(t.settings).filter(([,v]) => v != null).map(([k, v]) => k + ' ' + v).join(' · ')) : '') + (t.request_id ? ' · request ' + esc(t.request_id) : '') + (t.at ? ' · ' + esc(t.at) : '') + '</div>'
      + (t.input ? '<div class="mod">from ' + esc(t.input) + '</div>' : '') + '<div class="pr">' + esc(t.prompt || '') + '</div><div class="pn">' + esc(t.prompt_note || '') + '</div></div></div>').join('')
    + '</div>'
    + (x.used.length ? '<div class="used">Used in this scene: ' + x.used.map(u => esc(u.step) + ' ' + u.in + '–' + u.out + ' s').join(' · ') + '</div>' : '')
    + (x.rejected_notes.length || x.rejected_files.length ? '<div class="rej"><b>Takes thrown out</b>' + (x.rejected_notes.length ? '<ul>' + x.rejected_notes.map(n => '<li>' + esc(n) + '</li>').join('') + '</ul>' : '') + '<div class="row">' + x.rejected_files.map(f => media(f)).join('') + '</div></div>' : '')
    + (x.error ? '<div class="rej"><b>Refused</b><ul><li>' + esc(x.error) + '</li></ul></div>' : '')
    + '<div class="used">Recipe: sources/generated/' + esc(x.recipe_file || '?') + '</div></div>').join('');
  wireCm(id);
}
function collect(id){
  const wf = JSON.parse(JSON.stringify(S.scenes.find(s => s.scene === id).workflow));
  $('pb').querySelectorAll('[data-i]').forEach(el => {
    const s = wf.steps[+el.dataset.i], k = el.dataset.k, v = el.value;
    if (k === 'in' || k === 'out') s.inputs[k] = parseFloat(v);
    else if (k === 'cropx') s.params.crop.x = parseInt(v, 10);
    else if (k === 'seed') s.seed = v === '' ? null : (isNaN(+v) ? v : +v);
    else s[k] = v === '' && k !== 'caption' ? null : v;
  });
  return wf;
}
async function saveWf(id){
  const m = $('pmsg'); m.className = 'msg'; m.textContent = 'Saving…';
  const r = await fetch('/api/scene/' + N + '/' + id + '/save', {method:'POST', body: JSON.stringify(collect(id))});
  m.textContent = r.ok ? 'Saved' : 'Save failed'; if (!r.ok) m.className = 'msg err';
  await load(); openPanel(id);
}
async function act(id, a, body){
  const m = $('pmsg'); m.className = 'msg';
  if (a === 'run') { await fetch('/api/scene/' + N + '/' + id + '/save', {method:'POST', body: JSON.stringify(collect(id))}); m.textContent = 'Making ' + id + '…'; $('b-run').disabled = true; }
  const r = await fetch('/api/scene/' + N + '/' + id + '/' + a, {method:'POST', body: JSON.stringify(body || {})});
  const j = await r.json();
  if (!r.ok || j.error) { m.className = 'msg err'; m.textContent = j.error || 'Failed'; return; }
  if (a === 'run' && !j.ok) { m.className = 'msg err'; m.textContent = 'Waits on: ' + j.waits.join(', '); }
  await load(); openPanel(id);
  if (a === 'run' && j.ok) $('pmsg').textContent = 'Made in ' + j.run.seconds_to_make + ' s';
  if (a === 'take') { document.querySelector('details.chg').open = true; $('pmsg').textContent = j.take + ' is a copy to try. The cut still uses ' + S.scenes.find(x => x.scene === id).pick + ' until you pick ' + j.take + ' under "In the cut".'; }
}
function play(list){
  if (!list.length) return;
  let k = 0; const v = $('pv'); let caps = [];
  const next = async () => {
    if (k >= list.length) { closePlayer(); return; }
    const sc = list[k++];
    caps = (await (await fetch(fileUrl(sc.scene, sc.run.files.captions))).json()).lines || [];
    v.src = fileUrl(sc.scene, sc.run.files.video) + '?h=' + sc.run.workflow_hash; v.play();
  };
  v.onended = next;
  v.ontimeupdate = () => { const c = caps.find(c => v.currentTime >= c.start && v.currentTime < c.end); $('cap').textContent = c ? c.text : ''; };
  $('player').classList.add('open'); next();
}
function closePlayer(){ const v = $('pv'); v.pause(); v.removeAttribute('src'); $('cap').textContent=''; $('player').classList.remove('open'); }
$('plx').onclick = closePlayer;
$('playall').onclick = () => play(S.scenes.filter(s => s.status === 'made'));
$('pkg').onclick = async () => {
  if (document.documentElement.classList.contains('embed') && window.parent !== window) { window.parent.postMessage({go: 'edit'}, '*'); return; }
  $('smsg').textContent = 'Opening the edit in HyperFrames…'; const r = await fetch('/api/hyperframes/' + N, {method:'POST', body: '{}'}); const j = await r.json();
  if (r.ok) location.href = j.url; else $('smsg').textContent = j.error || 'Could not open'; };
$('px').onclick = () => { $('panel').classList.remove('open'); sel = null; document.querySelectorAll('.node').forEach(n => n.classList.remove('sel')); };
addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('lb').classList.contains('open')) return closeLb(); closePlayer(); $('px').click(); } });
addEventListener('resize', () => S && wires());
load();

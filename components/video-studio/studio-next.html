<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23EFE9E1'/%3E%3Cpolygon points='25,11 45,51 5,51' fill='%232F5BFF' stroke='%23171512' stroke-width='3.2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* The Studio in PRIZM (daemn.co's own system, docs/DESIGN.md + docs/studio.css), laid out like a Stripe dashboard:
   light paper, white cards, numbers first. Colour carries a job: violet swipes · indigo press-this · cyan video ·
   green ready/live · amber waiting on you · coral stop · magenta briefs. The prism sweep appears once, on the top bar. */
:root{
  --bone:#EFE9E1; --paper:#F7F4EF; --card:#FFFFFF; --ink:#171512; --ink-2:#4B453E; --ink-3:#716960;
  --line:rgba(23,21,18,.12); --line-2:rgba(23,21,18,.22);
  --violet:#6D3BF5; --indigo:#2F5BFF; --cyan:#00A8CC; --green:#12A06F; --amber:#F09000; --coral:#F04A2E; --magenta:#DB2A8C;
  --prism:linear-gradient(96deg,#6D3BF5,#2F5BFF,#00A8CC,#12A06F,#F09000,#F04A2E,#DB2A8C);
  --display:'Unbounded',system-ui,sans-serif; --body:'Plus Jakarta Sans','Helvetica Neue',system-ui,sans-serif;
  --mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r1:3px; --r2:8px; --r3:16px; --r4:999px; --float:0 26px 60px rgba(23,21,18,.22);
  --hue:var(--indigo); color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:14px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--indigo);text-decoration:none}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.mono,.lbl,.pill,.btn,.num{font-family:var(--mono)}
.lbl{font-size:11px;letter-spacing:.04em;color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}

/* icons: daemn.co's one set (docs/studio.js), one stroke, tinted by the block's --hue */
.ic{width:18px;height:18px;flex:none;display:inline-block}
.ic svg,.ib svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}
.ib{display:inline-grid;place-items:center;width:34px;height:34px;padding:8px;border-radius:var(--r2);color:var(--hue);background:color-mix(in srgb,var(--hue) 11%,transparent);flex:none}

/* top bar */
.bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.bar::before{content:"";display:block;height:3px;background:var(--prism)}
.barin{display:flex;align-items:center;gap:8px;height:56px;padding:0 24px}
.mark{display:flex;align-items:center;gap:9px;margin-right:18px;font:800 15px var(--display);letter-spacing:-.01em;color:var(--ink)}
.mark svg{width:26px;height:26px}
.nav{display:flex;gap:2px}
.nav a{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:var(--r2);color:var(--ink-2);font-weight:600;font-size:13.5px}
.nav a .ic{width:16px;height:16px}
.nav a:hover{background:var(--paper)}
.nav a.on{color:var(--indigo);background:color-mix(in srgb,var(--indigo) 9%,transparent)}
.grow{flex:1}
select.brand{border:1px solid var(--line-2);background:var(--card);border-radius:var(--r2);padding:6px 10px;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--card);border-radius:var(--r2);padding:7px 13px;font-size:12.5px;font-weight:500;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.go{background:var(--indigo);border-color:var(--indigo);color:#fff}
.btn.wait{background:var(--amber);border-color:var(--amber);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:default}
.btn .ic{width:15px;height:15px}

/* page */
main{padding:28px 24px 60px;max-width:1440px;margin:0 auto}
.ph{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.ph h1{margin:0;font:600 22px var(--display);letter-spacing:-.02em}
.ph .sub{color:var(--ink-3);font:12px var(--mono)}
.ph .acts{margin-left:auto;display:flex;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r3);padding:18px 20px}
.card h3{margin:0;font:600 14px var(--body);display:flex;align-items:center;gap:10px}
.card h3 .count{margin-left:auto;font:500 15px var(--mono);color:var(--hue)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 9px;border-radius:var(--r4);border:1px solid color-mix(in srgb,var(--hue) 35%,transparent);color:var(--hue);background:color-mix(in srgb,var(--hue) 8%,transparent);white-space:nowrap}
.pill .ic{width:13px;height:13px}
.p-swipe{--hue:var(--violet)}.p-video{--hue:var(--cyan)}.p-ready{--hue:var(--green)}.p-wait{--hue:var(--amber)}.p-stop{--hue:var(--coral)}.p-brief{--hue:var(--magenta)}.p-act{--hue:var(--indigo)}.p-mute{--hue:var(--ink-3)}
.empty{color:var(--ink-3);font-size:13px;padding:6px 0}
.note{background:var(--paper);border:1px dashed var(--line-2);border-radius:var(--r2);padding:12px 14px;color:var(--ink-2);font-size:13px}
.card.note{background:var(--card)}
.note.stop{border-color:color-mix(in srgb,var(--coral) 45%,transparent);color:var(--coral)}
.skel{color:var(--ink-3);padding:30px 0;text-align:center;font:12px var(--mono)}

/* Today */
.money{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.mcard{display:grid;grid-template-columns:1fr 190px;gap:12px 18px;align-items:end}
.mcard .top{grid-column:1/-1;display:flex;align-items:center;gap:10px}
.mcard .top b{font:600 14px var(--body)}
.mcard .top .lbl{margin-left:auto}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.nums div{display:grid;gap:2px}
.nums b{font:500 clamp(15px,1.5vw,22px) var(--mono);white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.nums .up b{color:var(--green)}.nums .dn b{color:var(--coral)}
.spark{width:100%;height:48px}
.dcol{display:grid;gap:10px;align-content:start}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r2);background:var(--paper);color:var(--ink)}
.row b{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row span{color:var(--ink-3);font:11.5px var(--mono);grid-column:1}
.row .pill{grid-row:1/3;grid-column:2;align-self:center}
.run{display:flex;flex-wrap:wrap;gap:22px;margin-top:16px;padding:14px 20px}
.run span{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.run i{width:8px;height:8px;border-radius:50%;background:var(--hue)}

/* Ads */
.split{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.list{padding:8px 0;max-height:calc(100vh - 170px);overflow:auto;position:sticky;top:80px}
.list .g{padding:12px 16px 4px;display:flex;justify-content:space-between;align-items:center}
.ad{padding:9px 16px;cursor:pointer;border-left:3px solid transparent;display:grid;gap:1px}
.ad:hover{background:var(--paper)}
.ad.on{background:color-mix(in srgb,var(--indigo) 6%,transparent);border-left-color:var(--indigo)}
.ad b{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ad span{font:11.5px var(--mono);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail{display:grid;gap:16px;min-width:0}
.dh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dh h2{margin:0;font:600 18px var(--display);letter-spacing:-.02em}
.dh .acts{margin-left:auto;display:flex;gap:8px}
.steps{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.steps button{border:0;background:none;padding:10px 12px;border-bottom:2px solid transparent;color:var(--ink-3);font:600 13px var(--body);display:flex;align-items:center;gap:7px;white-space:nowrap}
.steps button:hover{color:var(--ink)}
.steps button.on{color:var(--indigo);border-bottom-color:var(--indigo)}
.steps .d{width:8px;height:8px;border-radius:50%;background:var(--line-2)}
.steps .done .d{background:var(--green)}.steps .now .d{background:var(--indigo)}.steps .price .d{background:var(--amber)}
.work{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start}
.insp{position:sticky;top:80px;max-height:calc(100vh - 100px);overflow:auto;padding:0}
.insp section{padding:16px 18px;border-bottom:1px solid var(--line)}
.insp section:last-child{border-bottom:0}
.insp h4{margin:0 0 8px;font:500 11px var(--mono);letter-spacing:.04em;color:var(--ink-3);display:flex;justify-content:space-between;gap:8px}
.prompt{margin:0;font:12px/1.65 var(--mono);white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1px solid var(--line);border-radius:var(--r2);padding:12px;max-height:50vh;overflow:auto;color:var(--ink)}
.kv{display:grid;grid-template-columns:84px 1fr;gap:5px 10px;font-size:12.5px;margin:0}
.kv dt{color:var(--ink-3);font:11.5px var(--mono)}.kv dd{margin:0;word-break:break-word}
.tabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--card);border-radius:var(--r4);padding:3px 10px;font:11.5px var(--mono);color:var(--ink-2)}
.tabs button.on{border-color:var(--indigo);color:var(--indigo)}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.shot{border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;background:var(--card);padding:0;text-align:left;cursor:pointer}
.shot:hover{border-color:var(--ink-3)}
.shot.on{border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo)}
.shot .pic{aspect-ratio:9/16;background:var(--bone);position:relative}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .dur{position:absolute;right:6px;bottom:6px;background:rgba(23,21,18,.72);color:#fff;border-radius:var(--r1);padding:1px 6px;font:11px var(--mono)}
.shot .pill{position:absolute;left:6px;top:6px;background:var(--card)}
.shot .cap{padding:8px 10px;display:grid;gap:2px}
.shot .cap b{font-size:12px}
.shot .cap span{font-size:12px;color:var(--ink-3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tl{margin-top:16px;padding:12px 14px}
.tl .trk{display:flex;gap:2px;height:52px}
.tl .clip{background:var(--bone);border-radius:var(--r1);overflow:hidden;min-width:6px;cursor:pointer}
.tl .clip img{width:100%;height:100%;object-fit:cover}
.tl .rul{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--ink-3);margin-top:6px}
.vers{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.ver{border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;background:var(--card)}
.ver video{width:100%;aspect-ratio:9/16;background:var(--ink);display:block}
.ver b{display:block;padding:9px 11px;font-size:13px}
.frame{width:100%;height:calc(100vh - 260px);border:1px solid var(--line);border-radius:var(--r2);background:var(--card)}
.out{display:grid;gap:12px}
.file{border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;background:var(--card)}
.file header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px}
.file header .lbl{margin-left:auto}
.file .md{padding:14px 16px;max-height:560px;overflow:auto;font-size:13.5px;line-height:1.6}
.file .md h2,.file .md h3{font:600 14px var(--body);margin:14px 0 6px}
.file .md p{margin:0 0 8px}.file .md ul{margin:0 0 8px;padding-left:18px}
.file .md table{border-collapse:collapse;font-size:12.5px;margin:6px 0}.file .md td,.file .md th{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
.file .md code{font:12px var(--mono);background:var(--paper);padding:0 4px;border-radius:var(--r1)}
.file.missing header{color:var(--ink-3);font-weight:500}
.gal{display:flex;flex-wrap:wrap;gap:8px;padding:12px}
.gal img,.gal video{height:180px;border-radius:var(--r1);background:var(--bone)}
.price{border:1px solid color-mix(in srgb,var(--amber) 50%,transparent);border-radius:var(--r3);overflow:hidden;background:var(--card);max-width:640px}
.price .pt{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;background:color-mix(in srgb,var(--amber) 9%,var(--card))}
.price .pt b{font:500 30px var(--mono);font-variant-numeric:tabular-nums}
.price table{width:100%;border-collapse:collapse;font-size:13px}
.price td{padding:9px 18px;border-top:1px solid var(--line)}
.price td:last-child{text-align:right;font-family:var(--mono)}
.price form{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 18px;border-top:1px solid var(--line)}
.price label{display:grid;gap:4px;font:11px var(--mono);color:var(--ink-3)}
.price label.w,.price .gorow{grid-column:1/-1}
.price input,.price textarea,.price select{border:1px solid var(--line-2);border-radius:var(--r2);padding:8px 10px;background:var(--card);font:14px var(--body)}
.price .gorow{display:flex;justify-content:space-between;align-items:center}
.sub-steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}

/* Swipes */
.filters{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.filters button{border:1px solid var(--line-2);background:var(--card);border-radius:var(--r4);padding:5px 12px;font:12px var(--mono);color:var(--ink-2)}
.filters button.on{border-color:var(--violet);color:var(--violet);background:color-mix(in srgb,var(--violet) 8%,var(--card))}
.covers{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.cover{border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;background:var(--card);color:var(--ink)}
.cover:hover{border-color:var(--violet)}
.cover .pic{aspect-ratio:9/16;background:var(--bone)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .cap{padding:9px 10px;display:grid;gap:6px}
.cover .cap b{font-size:12.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cover .meta{display:flex;gap:5px;flex-wrap:wrap}
.sw3{display:grid;grid-template-columns:260px 1fr 360px;gap:16px;align-items:start}
.swv{padding:0;overflow:hidden;position:sticky;top:80px}
.swv video,.swv img{width:100%;aspect-ratio:9/16;background:var(--ink);display:block;object-fit:cover}
.swv .kv{padding:12px 14px}
.stl{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.stl button{border:1px solid var(--line);background:var(--card);border-radius:var(--r2);padding:6px 10px;font:600 12px var(--body);display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.stl button i{width:7px;height:7px;border-radius:50%;background:var(--hue)}
.stl button.on{border-color:var(--indigo);color:var(--indigo)}

/* Research */
.bars{display:grid;gap:9px;margin-top:12px}
.bars div{display:grid;grid-template-columns:1fr 60px;gap:4px 10px;align-items:center;font-size:12.5px}
.bars .b{height:8px;border-radius:var(--r4);background:color-mix(in srgb,var(--violet) 14%,transparent);overflow:hidden;grid-column:1/-1}
.bars .b i{display:block;height:100%;background:var(--violet);border-radius:var(--r4)}
.bars span.n{text-align:right;font:12px var(--mono);color:var(--ink-3)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font:500 11px var(--mono);color:var(--ink-3);padding:8px 10px;border-bottom:1px solid var(--line)}
table.t td{padding:10px;border-bottom:1px solid var(--line)}
table.t td.n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}

/* Brands */
.prog{height:8px;border-radius:var(--r4);background:var(--bone);overflow:hidden;margin:12px 0 2px}
.prog i{display:block;height:100%;background:var(--green)}
.items{display:grid;gap:8px}
.item{display:grid;grid-template-columns:34px 1fr auto;gap:2px 12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r2);background:var(--card)}
.item .ib{grid-row:1/3}
.item b{font-size:13.5px}
.item span:not(.pill){font:11.5px var(--mono);color:var(--ink-3);word-break:break-word}
.item .pill{grid-row:1/3;grid-column:3}

.nb{font:500 10.5px var(--mono);background:var(--amber);color:var(--ink);border-radius:var(--r4);padding:0 6px;margin-left:2px}.nb:empty{display:none}
.lanes{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
.lanes a{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:var(--r4);border:1px solid var(--line-2);color:var(--ink-2);font-weight:600;font-size:13px;background:var(--card)}
.lanes a .ic{width:15px;height:15px}
.lanes a.on{border-color:var(--hue);color:var(--hue);background:color-mix(in srgb,var(--hue) 8%,var(--card))}
.lanes a.new{margin-left:auto;background:var(--indigo);border-color:var(--indigo);color:#fff}
.pf{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.pf .card{display:grid;gap:12px;cursor:pointer;color:var(--ink)}
.pf .card:hover{border-color:var(--ink-3)}
.pf .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pf .stats div{display:grid}.pf .stats b{font:500 18px var(--mono)}
.form{display:grid;gap:18px;max-width:960px}
.choice{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.choice label{display:grid;gap:4px;border:1px solid var(--line-2);border-radius:var(--r2);padding:12px 14px;cursor:pointer;background:var(--card);position:relative}
.choice label:has(input:checked){border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo)}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice b{font-size:14px}.choice span{font-size:12.5px;color:var(--ink-3)}
.fld{display:grid;gap:6px}.fld > span{font:500 11px var(--mono);color:var(--ink-3);letter-spacing:.04em}
.fld input,.fld select,.fld textarea{border:1px solid var(--line-2);border-radius:var(--r2);padding:9px 11px;background:var(--card);font:14px var(--body)}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;max-height:440px;overflow:auto;padding:2px}
.pickgrid label{border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;cursor:pointer;background:var(--card);display:grid;position:relative}
.pickgrid label:has(input:checked){border-color:var(--violet);box-shadow:0 0 0 2px var(--violet)}
.pickgrid input{position:absolute;opacity:0}
.pickgrid img{width:100%;aspect-ratio:9/16;object-fit:cover;background:var(--bone)}
.pickgrid span{font-size:11.5px;padding:5px 7px;line-height:1.25}
.acard{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:0;padding:0;overflow:hidden;margin-bottom:16px}
.acard .media{background:var(--bone);display:flex;gap:6px;overflow-x:auto;padding:12px;align-items:flex-start}
.acard .media img,.acard .media video{height:340px;border-radius:var(--r2);background:var(--ink);flex:none}
.acard .side{padding:18px 20px;display:grid;gap:12px;align-content:start;border-left:1px solid var(--line)}
.acard .side h3{font:600 16px var(--body);margin:0}
.acard .words{font-size:13px;white-space:pre-wrap;max-height:160px;overflow:auto;background:var(--paper);border-radius:var(--r2);padding:10px 12px;border:1px solid var(--line)}
.chk{display:flex;flex-wrap:wrap;gap:5px}
.seg2{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r2);overflow:hidden}
.seg2 label{padding:7px 14px;font:500 12.5px var(--mono);cursor:pointer;color:var(--ink-2);position:relative}

<script>
'use strict';
/* ---------- daemn.co's icon set (docs/studio.js), the same drawings ---------- */
const I = {

  image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>',
  film:'<rect x="2" y="2" width="20" height="20" rx="2"/><path d="M7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 17h5M17 7h5"/>',
  send:'<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
  sparkles:'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 17v4M17 19h4"/>',
  check:'<path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',

  pen:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>',
  mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/>',
  link:'<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
  book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5v15zM6.5 22H20v-5"/>',

  alert:'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  play:'<path d="m7 4 13 8-13 8z"/>',
  bookmark:'<path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',

  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  loop:'<path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>',
  plug:'<path d="M12 22v-5M9 8V2M15 8V2M18 8v5a6 6 0 0 1-12 0V8z"/>',
  scissors:'<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/>',
};
const icon = n => `<svg viewBox="0 0 24 24" aria-hidden="true">${I[n] || I.sparkles}</svg>`;
const paintIcons = (root = document) => root.querySelectorAll('[data-i]').forEach(el => { if (!el.firstChild) el.innerHTML = icon(el.dataset.i); });
const ib = (n, hue) => `<i class="ib" style="--hue:var(--${hue})">${icon(n)}</i>`;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* one screen at a time: a read that comes back after you moved on (another brand, another screen) is dropped,
   so a slow answer for one brand never draws over another. Actions (POST) and {keep:true} reads always land. */
let RID = 0;
const J = (u, o) => { const my = RID, keep = o && (o.keep || o.method); const opt = Object.assign({cache:'no-store'}, o); delete opt.keep;
  return fetch(u, opt).then(async r => { const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || ('error ' + r.status)); return j; })
    .then(v => (!keep && my !== RID) ? new Promise(() => {}) : v, e => { if (!keep && my !== RID) return new Promise(() => {}); throw e; }); };
const usd = (v, d = 0) => v == null ? '—' : (v < 0 ? '−$' : '$') + Math.abs(v).toLocaleString('en-US', {maximumFractionDigits:d, minimumFractionDigits:d});
const int = v => v == null ? '—' : Number(v).toLocaleString('en-US');
const toast = t => { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.append(d); setTimeout(() => d.remove(), 2800); };
const store = { get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const media = p => `/api/desk/media?path=${encodeURIComponent(p)}`;
const fmtT = s => Math.floor(s / 60) + ':' + String(Math.round(s % 60)).padStart(2, '0');
const nice = s => { s = String(s || ''); const b = S.brand || ''; if (b && (s.startsWith(b + '-') || s.startsWith(b + '_'))) s = s.slice(b.length + 1); return s.replace(/[-_]+/g, ' '); };
const dayLabel = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('en-GB', {day:'numeric', month:'short'}) : '';
/* a small Markdown reader for stage outputs: headings, lists, tables, bold, code */
function md(t){
  const lines = String(t || '').split('\n'); let h = '', list = false, table = [];
  const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
  const flushT = () => { if (!table.length) return; const rows = table.filter(r => !/^\|?\s*:?-{2,}/.test(r.replace(/\s/g, ''))); h += '<table>' + rows.map((r, i) => '<tr>' + r.replace(/^\||\|$/g, '').split('|').map(c => i ? `<td>${inl(c.trim())}</td>` : `<th>${inl(c.trim())}</th>`).join('') + '</tr>').join('') + '</table>'; table = []; };
  for (const l of lines) {
    if (/^\s*\|/.test(l)) { table.push(l.trim()); continue; } else flushT();
    if (/^\s*[-*] /.test(l)) { if (!list) { h += '<ul>'; list = true; } h += '<li>' + inl(l.replace(/^\s*[-*] /, '')) + '</li>'; continue; }
    if (list) { h += '</ul>'; list = false; }
    const m = /^(#{1,4})\s+(.*)/.exec(l);
    if (m) { const lv = Math.min(m[1].length + 1, 3); h += `<h${lv}>${inl(m[2])}</h${lv}>`; }
    else if (l.trim()) h += '<p>' + inl(l) + '</p>';
  }
  flushT(); if (list) h += '</ul>'; return h;
}
const text = p => J('/api/desk/text?path=' + encodeURIComponent(p)).then(t => t.text || '');

/* ---------- state + routing (#today · #ads/<id>|<step> · #swipes · #swipe/<label> · #research · #brands) ---------- */
const S = { brand: store.get('st.brand') || '', menu: store.get('st.menu'), pieces: [], swipes: {}, view: 'today', arg: null, prods: null };
async function boot(){
  let bl = []; try { bl = (await J('/api/desk/brands', {keep:true})).brands; } catch {}
  S.labels = Object.fromEntries(bl.map(b => [b.id, b.label || b.id])); let bs = bl.map(b => b.id);
  if (!bs.includes(S.brand)) S.brand = bs[0] || '';
  $('#brand').innerHTML = `<option value="*">All brands</option>` + bs.map(b => `<option value="${esc(b)}" ${b === S.brand ? 'selected' : ''}>${esc(blabel(b))}</option>`).join('');
  paintIcons();
  J('/api/desk/pieces', {keep:true}).then(r => { S.pieces = r.pieces || []; if (S.view === 'ads' || S.view === 'today') route(); }).catch(() => {});
  J('/api/menu', {keep:true}).then(m => { S.menu = {brands: m.brands}; store.set('st.menu', S.menu); if (S.view === 'ads' || S.view === 'today') route(); }).catch(() => {});
  route();
}
$('#brand').onchange = e => { if (e.target.value === '*') { location.hash = 'portfolio'; return; } S.brand = e.target.value; store.set('st.brand', S.brand); openAd = null; if (S.view === 'swipe') location.hash = 'production/swipes'; else if (S.view === 'ads') location.hash = 'production/video'; else route(); };
window.addEventListener('hashchange', route);
function route(){
  RID++;
  const h = decodeURIComponent(location.hash.slice(1) || 'today');
  const i = h.indexOf('/'); const v = i < 0 ? h : h.slice(0, i);
  const alias = {brands:'settings'};
  S.view = alias[v] || (['portfolio', 'today', 'production', 'ads', 'swipes', 'swipe', 'approve', 'research', 'skills', 'settings', 'knowledge', 'asks', 'live', 'brief', 'pages', 'creators', 'market', 'usage'].includes(v) ? v : 'today');
  S.arg = i < 0 ? null : h.slice(i + 1);
  if (S.view === 'ads' && !S.arg) S.view = 'live';
  const TAB = {ads:'production', swipes:'production', swipe:'production', live:'ads-top', approve:'ads-top', brief:'ads-top', pages:'ads-top', skills:'settings', usage:'settings', market:'research'};
  const tab = TAB[S.view] || S.view;
  document.querySelectorAll('[data-v]').forEach(a => a.classList.toggle('on', a.dataset.v === tab));
  $('#brand').value = S.view === 'portfolio' ? '*' : S.brand;
  ({portfolio, today, production, ads:() => production('video'), swipes:() => production('swipes'), swipe:swipeView, approve, research, skills:skillsView, settings:brandSetup, knowledge:knowledgeView, asks:asksView, live:adsLive, brief:briefView, pages:pagesView, creators:creatorsView, market:marketView, usage:usageView})[S.view]();
  approveBadge();
}
const brandMenu = () => ((S.menu && S.menu.brands) || []).find(b => b.id === S.brand);

/* ================= TODAY ================= */
async function today(){
  const m = $('#main');
  const head = `<div class="ph"><h1>Today</h1><span class="sub">${new Date().toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long'})}</span>`;
  if (!m.querySelector('.money')) m.innerHTML = head + `</div><div class="skel">Reading the numbers…</div>`;
  let d; try { d = await J('/api/desk/today?brand=' + encodeURIComponent(S.brand)); } catch (e) { m.innerHTML = head + `</div><div class="note stop">${esc(e.message)}</div>`; return; }
  if (S.view !== 'today') return;
  const waiting = await approveCount();
  const now = d.now, nowDay = now && now.through;
  const days = nowDay ? Math.round((Date.now() - new Date(nowDay + 'T12:00:00')) / 864e5) : null;
  const win3 = (k, w) => now && now[k] ? now[k][w] : null;
  const roas = w => win3('spend', w) ? (win3('revenue', w) / win3('spend', w)).toFixed(2) : '—';
  const spendBars = now ? (() => { const v = [['3 days', win3('spend', '3') / 3], ['7 days', win3('spend', '7') / 7], ['30 days', win3('spend', '30') / 30]].filter(x => x[1] != null && !isNaN(x[1])); const mx = Math.max(1, ...v.map(x => x[1])); return `<svg class="spark" viewBox="0 0 190 48" preserveAspectRatio="none" role="img" aria-label="Spend per day, 3, 7 and 30 days">${v.map((x, k) => `<rect x="${k * 64 + 2}" y="${(48 - x[1] / mx * 44).toFixed(1)}" width="56" height="${(x[1] / mx * 44).toFixed(1)}" rx="2" fill="var(--indigo)"><title>${x[0]}: ${usd(x[1])} a day</title></rect>`).join('')}</svg>`; })() : '';
  const moneyCards = now ? `<div class="card mcard" style="grid-column:1/-1"><div class="top">${ib('target', 'green')}<b>${esc(blabel(S.brand))}</b><span class="lbl">to ${esc(dayLabel(nowDay))} · from the warehouse</span></div>
      <div class="nums"><div><span class="lbl">Revenue 7d</span><b>${usd(win3('revenue', '7'))}</b></div><div><span class="lbl">Ad spend 7d</span><b>${usd(win3('spend', '7'))}</b></div><div class="up"><span class="lbl">ROAS 7d</span><b>${roas('7')}</b></div><div><span class="lbl">Orders 7d</span><b>${int(win3('orders', '7'))}</b></div>
        <div><span class="lbl">Revenue 30d</span><b>${usd(win3('revenue', '30'))}</b></div><div><span class="lbl">Ad spend 30d</span><b>${usd(win3('spend', '30'))}</b></div><div><span class="lbl">ROAS 30d</span><b>${roas('30')}</b></div><div><span class="lbl">Orders 30d</span><b>${int(win3('orders', '30'))}</b></div></div>${spendBars}</div>` : '';

const PHASE = id => /^(start|swipe|teardown|source)/.test(id) ? 'swipe' : /^(brief|writ|song|elements|script|cast)/.test(id) ? 'script' : /^(pack|plan|price|go)/.test(id) ? 'price' : /^edit/.test(id) ? 'edit' : /^(meta|file|approv|launch)/.test(id) ? 'approve' : 'shots';
const LINE = [['swipe', 'Swipe'], ['script', 'Script'], ['price', 'Price'], ['shots', 'Make'], ['edit', 'Edit'], ['approve', 'Approve']];
async function openLine(a, step){
  const det = $('#detail');
  const dh = `<div class="dh"><h2>${esc(a.title)}</h2><span class="pill p-video">${esc(a.line || '')}</span><span class="pill ${a.quote ? 'p-wait' : 'p-act'}">${a.quote ? 'at the price' : a.state === 'complete' ? 'done' : 'running'}</span></div>`;
  det.innerHTML = dh + `<div class="skel">Reading where it stands…</div>`;
  let p; try { p = a.piece = await J(`/api/desk/piece/${encodeURIComponent(a.brand)}/${encodeURIComponent(a.label)}`); } catch (e) { det.innerHTML = dh + `<div class="note stop">${esc(e.message)}</div>`; return; }
  const st = p.stations || []; const nowPh = p.now ? PHASE(p.now) : null;
  const phases = LINE.map(([id, name]) => { const ss = st.filter(s => PHASE(s.id) === id); return {id, name, ss, cls: (ss.length && ss.every(s => s.status === 'done') ? 'done' : id === nowPh ? 'now' : '') + (id === 'price' ? ' price' : '')}; });
  step = step || nowPh || 'swipe';
  det.innerHTML = dh + stepsBar(phases, step) + `<div class="work"><div id="stage"></div><aside class="card insp" id="insp"></aside></div>`;
  det.querySelectorAll('[data-step]').forEach(b => b.onclick = () => { setStep(a, b.dataset.step); openLine(a, b.dataset.step); });
  const ph = phases.find(x => x.id === step) || phases[0];
  if ((step === 'swipe' || step === 'script') && (p.values || {}).teardown) return teardownInAd(a, step);
  renderStations(a, ph.ss);
}
function renderStations(a, ss){
  const p = a.piece, stage = $('#stage');
  if (!ss.length) { stage.innerHTML = '<div class="note">Nothing in this step for this line.</div>'; inspText('Step', ''); return; }
  let cur = ss.find(s => s.status === 'now') || ss.find(s => s.quote) || ss[0];
  const draw = () => {
    let h = `<div class="sub-steps">${ss.map(s => `<button class="btn ${s.id === cur.id ? 'go' : ''}" data-ss="${esc(s.id)}">${esc(s.name)}${s.status === 'done' ? ' ✓' : ''}</button>`).join('')}</div>`;
    if (cur.status === 'now' && p.reason) h += `<div class="note" style="margin-bottom:12px">${esc(p.reason)}</div>`;
    if (cur.quote) h += priceCard(a, cur);
    h += '<div class="out" style="margin-top:12px">';
    for (const o of cur.outputs || []) {
      if (o.missing) h += `<div class="file missing"><header>${esc(o.name)}<span class="lbl">not made yet</span></header></div>`;
      else if (/\.(jpe?g|png|webp|mp4|mov)$/i.test(o.path)) h += `<div class="file"><header>${esc(o.name)}</header><div class="gal">${/\.(mp4|mov)$/i.test(o.path) ? `<video controls preload="metadata" src="${media(o.path)}"></video>` : `<img loading="lazy" src="${media(o.path)}" alt="">`}</div></div>`;
      else h += `<div class="file" data-text="${esc(o.path)}"><header>${esc(o.name)}<span class="lbl">${esc(o.path.split('/').slice(-2).join('/'))}</span></header><div class="md">Loading…</div></div>`;
    }
    const g = p.gallery || {};
    for (const k of ['sheets', 'clips', 'versions', 'covers']) if (g[k] && /sheet|clip|take|upscale|edit|meta/.test(cur.id)) h += `<div class="file"><header>${esc(k)}<span class="lbl">${g[k + '_count']}</span></header><div class="gal">${g[k].map(x => x.video ? `<video controls preload="metadata" src="${media(x.path)}"></video>` : `<img loading="lazy" src="${media(x.path)}" alt="">`).join('')}</div></div>`;
    h += '</div>';
    stage.innerHTML = h;
    stage.querySelectorAll('[data-ss]').forEach(b => b.onclick = () => { cur = ss.find(s => s.id === b.dataset.ss); draw(); });
    stage.querySelectorAll('[data-text]').forEach(el => text(el.dataset.text).then(t => el.querySelector('.md').innerHTML = /\.json$/.test(el.dataset.text) ? `<pre class="prompt">${esc(t)}</pre>` : md(t)).catch(e => el.querySelector('.md').textContent = e.message));

    $('#insp [data-copy]').onclick = () => navigator.clipboard.writeText($('#does').textContent).then(() => toast('Copied')).catch(() => toast('Select the text to copy'));
  };
  draw();
}

/* ================= KNOWLEDGE: ask it like daemn.co/knowledge; every answer shows its sources ================= */
let kchat = store.get('st.kchat') || [];
const kfill = t => esc(t).replace(/\{([^}]{1,30})\}/g, 'your $1');
const kcited = t => new Set([...String(t).matchAll(/\[(\d+(?:\s*,\s*\d+)*)\]/g)].flatMap(m => m[1].split(/\s*,\s*/).map(Number)));
const kformat = (t, n) => md(t).replace(/\[(\d+(?:\s*,\s*\d+)*)\]/g, (x, g) => g.split(/\s*,\s*/).map(k => +k >= 1 && +k <= n ? `<button class="cite" data-n="${k}">${k}</button>` : '').join(''));
function ksources(src, text){
  const used = kcited(text), order = src.map((s, i) => i + 1).filter(n => used.has(n));
  if (!order.length) return '';
  return `<details class="ksrc"><summary class="lbl">${order.length} source${order.length > 1 ? 's' : ''}</summary><ol>${order.map(n => { const s = src[n - 1]; return `<li data-n="${n}"><span class="pill ${s.kind === 'Rule' ? 'p-act' : s.kind === 'Guide' ? 'p-ready' : 'p-swipe'}">${esc(s.kind === 'Guide' ? 'How it works' : s.kind || '')}</span> <span class="lbl">${esc(s.topic || '')}</span><div>${kfill(s.kind === 'Rule' ? s.text : (s.title || '') + ' — ' + (s.text || ''))}</div>${s.why && s.why !== s.text ? `<div class="lbl" style="margin-top:3px">Why: ${kfill(s.why)}</div>` : ''}</li>`; }).join('')}</ol></details>`;
}
const kturn = t => `<div class="kme">${esc(t.q)}</div><div class="kit"><div class="md">${kformat(t.a, t.sources.length)}</div>${ksources(t.sources, t.a)}</div>`;
function knowledgeView(){
  const m = $('#main');
  m.innerHTML = `<div class="ph"><h1>Knowledge</h1><span class="sub">3,536 rules, lessons and how-it-works guides · every answer shows where it came from</span>${kchat.length ? '<div class="acts"><button class="btn" id="kreset">New chat</button></div>' : ''}</div>
    <div class="kwrap"><div id="klog">${kchat.map(kturn).join('') || `<div class="card note">Ask how anything is done: hooks, offers, statics, creators, the ad system itself.</div>`}</div>
    <form class="card kbox" id="kform"><textarea id="kq" rows="2" placeholder="Ask anything…" required></textarea><button class="btn go" id="ksend" type="submit">Ask</button></form></div>`;
  const kq = $('#kq');
  kq.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#kform').requestSubmit(); } };
  if ($('#kreset')) $('#kreset').onclick = () => { kchat = []; store.set('st.kchat', kchat); knowledgeView(); };
  $('#klog').onclick = e => { const c = e.target.closest('.cite'); if (!c) return; const it = c.closest('.kit'), d = it.querySelector('details'); if (!d) return; d.open = true; it.querySelectorAll('li').forEach(li => li.classList.toggle('lit', li.dataset.n === c.dataset.n)); };
  $('#kform').onsubmit = async e => {
    e.preventDefault(); const q = kq.value.trim(); if (!q) return;
    $('#ksend').disabled = true; kq.value = '';
    if (!kchat.length) $('#klog').innerHTML = '';
    $('#klog').insertAdjacentHTML('beforeend', `<div class="kme">${esc(q)}</div><div class="kit"><div class="md"><span class="lbl">Searching 3,536 rules, lessons and guides…</span></div></div>`);
    const box = $('#klog').lastElementChild.querySelector('.md'); box.scrollIntoView({block: 'end'});
    let text = '', src = [];
    try {
      const r = await fetch('/api/desk/knowledge-ask', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({q, history: kchat.slice(-4).map(t => ({q: t.q, a: t.a}))})});
      if (!r.ok || !r.body) { const d = await r.json().catch(() => ({})); throw new Error(d.error || 'failed'); }
      const rd = r.body.getReader(), dec = new TextDecoder(); let buf = '';
      for (;;) {
        const {value, done} = await rd.read(); if (done) break;
        buf += dec.decode(value, {stream: true}); let i;
        while ((i = buf.indexOf('\n\n')) >= 0) {
          const block = buf.slice(0, i); buf = buf.slice(i + 2);
          const ev = (block.match(/^event: (.+)$/m) || [])[1]; let data = {}; try { data = JSON.parse((block.match(/^data: (.*)$/m) || [, '{}'])[1]); } catch {}
          if (ev === 'sources') { src = data; box.innerHTML = `<span class="lbl">Reading ${src.length} rules and lessons</span>`; }
          if (ev === 'text') { text += data.t; box.innerHTML = kformat(text, src.length); }
          if (ev === 'error') throw new Error(data.error);
        }
      }
      if (!text) throw new Error('no answer');
      box.insertAdjacentHTML('afterend', ksources(src, text));
      kchat.push({q, a: text, sources: src}); kchat = kchat.slice(-20); store.set('st.kchat', kchat);
    } catch (err) { box.insertAdjacentHTML('beforeend', `<p class="note stop">Couldn't finish that answer (${esc(err.message)}). Try again in a minute.</p>`); }
    finally { $('#ksend').disabled = false; kq.focus(); }
  };
  kq.focus();
}

        <div class="arow">${t.off ? `<span class="pill p-stop">${t.off} to turn off</span>` : ''}${t.act ? `<span class="pill p-act">${t.act} other calls</span>` : ''}${!t.off && !t.act ? '<span class="lbl">no calls from the desk</span>' : ''}</div></button>`; }).join('')}</div>
      <div class="filters">${[['spend7', 'Most spend 7d'], ['buys30', 'Most buys 30d'], ['cpa7', 'Lowest CPA 7d']].map(([k, n]) => `<button class="${k === adsSort ? 'on' : ''}" data-srt="${k}">${n}</button>`).join('')}<button class="${onlyActive ? 'on' : ''}" data-act style="margin-left:auto">Active only</button><button class="${onlyCalls ? 'on' : ''}" data-only>Only the desk's calls</button></div>
      <div class="card" style="padding:0;overflow-x:auto"><table class="t"><tr><th>${curCat === 'brief' ? 'Brief' : curCat === 'creator' ? 'Creator' : 'Campaign'}</th><th style="text-align:right">Spend 7d</th><th style="text-align:right">Buys 7d</th><th style="text-align:right">CPA 7d</th><th style="text-align:right">Spend 30d</th><th style="text-align:right">ROAS 30d</th><th></th></tr>
      ${rows.map(r => { const isOpen = open.has(r.k); return `<tr class="grp" data-g="${esc(r.k)}"><td><span class="chev">${isOpen ? '▾' : '▸'}</span> <b>${title(r)}</b>${r.off ? ' <span class="pill p-stop">off</span>' : ''}</td><td class="n">${usd(r.s7)}</td><td class="n">${int(r.b7)}</td><td class="n">${cpa(r.s7, r.b7)}</td><td class="n">${usd(r.s30)}</td><td class="n">${r.s30 ? (r.v30 / r.s30).toFixed(2) : '—'}</td><td style="white-space:nowrap;text-align:right">${curCat === 'brief' ? `<a class="btn" href="#brief/${encodeURIComponent(r.k)}">Open</a> ` : ''}<button class="btn" data-ask="variations" data-input="${esc((curCat === 'brief' ? 'brief ' : curCat === 'creator' ? 'creator ' : 'campaign ') + r.k + ' · ' + r.rs[0].name)}">Make more</button></td></tr>` +
        (isOpen ? r.rs.map(a => { const [cw, cc] = CALL[a.call] || [a.call || '', 'mute']; return `<tr class="sub"><td title="${esc(a.name)}">${esc((a.name || '').replace(/^.*?brief-\d{4}_?/, '') || a.name)}${a.active ? '' : ' <span class="lbl">· no spend in 3 days</span>'}</td><td class="n">${usd(a.spend7)}</td><td class="n">${int(a.buys7)}</td><td class="n" style="color:var(--${a.break_even && a.cpa7 > a.break_even ? 'coral' : 'ink'})">${a.cpa7 != null ? usd(a.cpa7) : '—'}</td><td class="n">${usd(a.spend30)}</td><td class="n">${a.spend30 ? (a.value30 / a.spend30).toFixed(2) : '—'}</td><td style="text-align:right">${a.call ? `<span class="pill p-${cc}" title="${esc(a.why || '')}">${esc(cw)}</span>` : ''}</td></tr>`; }).join('') : ''); }).join('') || '<tr><td colspan="7" class="empty">Nothing here</td></tr>'}</table></div>
      ${d.rule ? `<div class="lbl" style="margin-top:10px">Desk rule: ${esc(d.rule)}</div>` : ''}</div>`);
    paintIcons(m);
    m.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { curCat = b.dataset.cat; store.set('st.adcat', curCat); open = new Set(); draw(); });
    m.querySelectorAll('[data-srt]').forEach(b => b.onclick = () => { adsSort = b.dataset.srt; store.set('st.adsort', adsSort); draw(); });
    m.querySelector('[data-only]').onclick = () => { onlyCalls = !onlyCalls; draw(); };
    m.querySelector('[data-act]').onclick = () => { onlyActive = !onlyActive; store.set('st.adact', onlyActive); draw(); };
    if (focus) { const tr = [...m.querySelectorAll('tr.grp')].find(x => x.dataset.g === focus); if (tr) { tr.classList.add('lit'); tr.scrollIntoView({block: 'center'}); } focus = null; }
    m.querySelectorAll('tr.grp').forEach(tr => tr.onclick = e => { if (e.target.closest('a,button')) return; const k = tr.dataset.g; open.has(k) ? open.delete(k) : open.add(k); draw(); });
  };
  draw();
}


/* ================= ONE BRIEF: what was made, where it went, how it is doing ================= */
async function briefView(){
  const m = $('#main'), n = S.arg;
  m.innerHTML = `<div class="ph"><a class="btn" href="#ads">← Ads</a><h1>Brief ${esc(n)}</h1><span id="bchips"></span><div class="acts" id="bacts"></div></div><div class="skel">Loading…</div>`;
  let d; try { d = await J(`/api/desk/brief?brand=${encodeURIComponent(S.brand)}&n=${encodeURIComponent(n)}`); } catch (e) { m.querySelector('.skel').outerHTML = `<div class="card note">${esc(e.message)}</div>`; return; }
  const b = d.brief || {}, ads = d.ads || [];
  const sum = k => ads.reduce((t, a) => t + (a[k] || 0), 0), s7 = sum('spend7'), b7 = sum('buys7'), s30 = sum('spend30'), v30 = sum('value30');
  $('#bchips').innerHTML = [...(b.lanes || []).map(l => `<span class="pill ${l === 'video' ? 'p-video' : 'p-swipe'}">${esc(l)}</span>`), b.angle ? `<span class="pill p-brief">${esc(String(b.angle).replace(/-/g, ' '))}</span>` : '', b.avatar ? `<span class="pill p-mute">${esc(b.avatar)}</span>` : '', ads.some(a => a.active) ? '<span class="pill p-ready">active</span>' : '<span class="pill p-mute">not spending</span>'].join(' ');
  const prods = S.prods || (S.prods = (await J('/api/productions').catch(() => ({productions: []}))).productions);
  const p = prods.find(x => (x.key || '').endsWith('brief-' + n));
  $('#bacts').innerHTML = `${p ? `<a class="btn" href="#ads/${encodeURIComponent('p:' + p.key)}">Production</a>` : ''}<button class="btn go" data-ask="variations" data-input="${esc('brief ' + n + ' · ' + ((ads[0] || {}).name || ''))}">Make more</button>`;
  const byId = Object.fromEntries(ads.map(a => [String(a.id), a]));
  m.querySelector('.skel').outerHTML = `<div class="card" style="margin-bottom:16px"><div class="nums" style="grid-template-columns:repeat(5,1fr)"><div><span class="lbl">Spend 7d</span><b>${usd(s7)}</b></div><div><span class="lbl">Buys 7d</span><b>${int(b7)}</b></div><div><span class="lbl">CPA 7d</span><b>${b7 ? usd(s7 / b7) : '—'}</b></div><div><span class="lbl">Spend 30d</span><b>${usd(s30)}</b></div><div><span class="lbl">ROAS 30d</span><b>${s30 ? (v30 / s30).toFixed(2) : '—'}</b></div></div>${d.through ? `<span class="lbl">to ${esc(dayLabel(d.through))} · from the warehouse</span>` : ''}</div>
    ${(d.cards || []).map(c => `<div class="card" style="margin-bottom:16px;padding:0;overflow:hidden">
      <div style="padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b style="font:600 14px var(--body)">${esc((c.ad_name || '').replace(/^.*?(batch-)/, '$1'))}</b><span class="pill p-mute">${esc(c.format || '')}</span><span class="pill p-mute">${c.media.length} files</span>${c.live ? `<span class="lbl">live ${esc(String(c.live).slice(0, 10))}</span>` : ''}</div>
      <div class="media bmedia">${c.media.map(x => x.kind === 'video' ? `<video controls preload="none" poster="${esc(amedia(x.thumb))}" src="${esc(amedia(x.src))}"></video>` : `<img loading="lazy" src="${esc(amedia(x.thumb))}" alt="">`).join('') || '<div class="empty" style="padding:12px">No files on record</div>'}</div>
      <table class="t"><tr><th>Goes to</th><th style="text-align:right">Spend 7d</th><th style="text-align:right">Buys 7d</th><th style="text-align:right">CPA 7d</th><th style="text-align:right">Spend 30d</th><th style="text-align:right">ROAS 30d</th></tr>${c.goes.map(g => { const a = byId[String(g.ad_id)] || {}; return `<tr><td style="font:12px var(--mono)">${esc((g.name || '').replace(/^.*?batch-[^_]+_?/, '') || g.ad_set)}${a.active ? '' : ' <span class="lbl">· no spend in 3 days</span>'}</td><td class="n">${usd(a.spend7)}</td><td class="n">${int(a.buys7)}</td><td class="n">${a.cpa7 != null ? usd(a.cpa7) : '—'}</td><td class="n">${usd(a.spend30)}</td><td class="n">${a.spend30 ? (a.value30 / a.spend30).toFixed(2) : '—'}</td></tr>`; }).join('')}</table></div>`).join('') || '<div class="card note">No upload record for this brief yet: its numbers are above.</div>'}`;
}


/* ================= PAGES: every landing page, with the numbers of the ads pointing at it ================= */
async function pagesView(){
  const m = $('#main');
  m.innerHTML = `<div class="ph"><h1>Ads</h1></div>${adsTabs('pages')}<div class="skel">Loading…</div>`;
  let d; try { d = await J('/api/desk/pages?brand=' + encodeURIComponent(S.brand)); } catch (e) { m.querySelector('.skel').outerHTML = `<div class="note stop">${esc(e.message)}</div>`; return; }
  const ro = (v, s) => s ? (v / s).toFixed(2) : '—';
  m.querySelector('.skel').outerHTML = `<div class="card" style="padding:0;margin-bottom:16px;overflow-x:auto"><table class="t"><tr><th>Page ads point at</th><th style="text-align:right">Spend 7d</th><th style="text-align:right">Buys 7d</th><th style="text-align:right">CPA 7d</th><th style="text-align:right">Spend 30d</th><th style="text-align:right">ROAS 30d</th><th>Briefs</th></tr>
      ${d.pages.map(p => `<tr><td><b>${esc(p.page)}</b>${p.active ? ' <span class="pill p-ready">active</span>' : ' <span class="pill p-mute">not spending</span>'}</td><td class="n">${usd(p.spend7)}</td><td class="n">${int(p.buys7)}</td><td class="n">${p.buys7 ? usd(p.spend7 / p.buys7) : '—'}</td><td class="n">${usd(p.spend30)}</td><td class="n">${ro(p.value30, p.spend30)}</td><td style="font:11.5px var(--mono);color:var(--ink-3)">${p.briefs.slice(0, 8).map(b => `<a href="#brief/${encodeURIComponent(b)}">${esc(b)}</a>`).join(' ')}${p.briefs.length > 8 ? ' +' + (p.briefs.length - 8) : ''}</td></tr>`).join('') || '<tr><td colspan="7" class="empty">No live ad names a page yet</td></tr>'}</table></div>
    <div class="card" style="padding:0"><div style="padding:14px 16px;border-bottom:1px solid var(--line)"><h3>${ib('layers', 'green')}Funnels<span class="count" style="--hue:var(--ink-3)">${d.funnels.length}</span></h3></div>${d.funnels.map(f => `<div class="sk"><b>${esc(f.name || f.id)}</b><span class="j">${f.url ? `<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.url)}</a>` : ''} · ${int(f.pages)} pages · ${esc(f.product || '')}</span><span class="tags"><span class="pill ${f.status === 'off' ? 'p-mute' : 'p-ready'}">${esc(f.status || '')}</span></span></div>`).join('') || '<div class="empty" style="padding:14px">No funnel list for this brand yet</div>'}</div>`;
  paintIcons(m);
}


/* ================= MARKET: products winning and growing, for new offers ================= */
async function marketView(){
  const m = $('#main');
  m.innerHTML = `<div class="ph"><h1>Research</h1></div>${resTabs('market')}<form class="card arow" id="mkt" style="margin-bottom:16px"><i class="ib" style="--hue:var(--green)">${icon('target')}</i><input name="q" required placeholder="What to look for: e.g. men's body care, pheromone, supplements for sleep" style="flex:1;min-width:220px;border:1px solid var(--line-2);border-radius:var(--r2);padding:9px 11px;font:14px var(--body)"><button class="btn go" type="submit">Scan the market</button></form><div class="skel">Loading…</div>`;
  $('#mkt').onsubmit = e => { e.preventDefault(); ask('market', e.target.q.value, '').then(r => { if (r) location.hash = 'asks/' + encodeURIComponent(r.brand) + '/' + encodeURIComponent(r.id); }); };
  let d; try { d = await J('/api/desk/market?brand=' + encodeURIComponent(S.brand)); } catch (e) { m.querySelector('.skel').outerHTML = `<div class="note stop">${esc(e.message)}</div>`; return; }
  const ps = d.products || [];
  if (!ps.length) { m.querySelector('.skel').outerHTML = '<div class="card note">No market read on file for this brand yet. Scan the market above.</div>'; return; }
  const r0 = d.reads[0] || {};
  let mode = store.get('st.mk') || 'big';
  const sixMo = Date.now() - 183 * 864e5;
  const pick = () => mode === 'grow' ? [...ps].filter(p => p.growth != null).sort((a, b) => b.growth - a.growth) : mode === 'new' ? ps.filter(p => p.launched && new Date(p.launched) > sixMo).sort((a, b) => (b.month || 0) - (a.month || 0)) : ps;
  const draw = () => { const list = pick(); $('#mkgrid').innerHTML = list.slice(0, 80).map(card).join('') || '<div class="card note">Nothing here yet.</div>'; m.querySelectorAll('[data-mk]').forEach(b => b.classList.toggle('on', b.dataset.mk === mode)); $('#mkc').textContent = list.length + ' of ' + ps.length + ' products'; };
  m.querySelector('.skel').outerHTML = `<div class="filters"><button data-mk="big">Biggest</button><button data-mk="grow">Fastest growing</button><button data-mk="new">New: launched in 6 months</button><span class="lbl" id="mkc" style="margin-left:auto;align-self:center"></span></div>
    <div class="lbl" style="margin-bottom:12px">${d.reads.length} scans on file · newest ${esc(dayLabel(String(r0.ran_at || '').slice(0, 10)))}${r0.question ? ' · ' + esc(r0.question) : ''}</div>
    <div class="mk" id="mkgrid"></div>`;
  m.querySelectorAll('[data-mk]').forEach(b => b.onclick = () => { mode = b.dataset.mk; store.set('st.mk', mode); draw(); });
  draw();
}
function card(p){ return (p => `<a class="card mkc" href="${esc(p.link || '#')}" target="_blank" rel="noopener"><div class="pic">${p.picture ? `<img loading="lazy" src="${esc(p.picture)}" alt="">` : ''}</div>
      <div class="cap"><b>${esc(p.name)}</b><span class="lbl">${esc(p.shop || '')} · ${p.price != null ? usd(p.price, 2) : ''}</span>
      <div class="stats"><div><span class="lbl">30 days</span><b>${usd(p.month)}</b></div><div><span class="lbl">Growth</span><b style="color:var(--${(p.growth || 0) >= 0 ? 'green' : 'coral'})">${p.growth != null ? (p.growth > 0 ? '+' : '') + p.growth + '%' : '—'}</b></div></div>
      <div class="arow"><span class="pill ${p.source === 'kalodata' ? 'p-brief' : 'p-act'}">${p.source === 'kalodata' ? 'TikTok Shop' : 'own store'}</span>${p.category ? `<span class="pill p-mute">${esc(p.category)}</span>` : ''}${p.launched ? `<span class="lbl">since ${esc(p.launched)}</span>` : ''}</div></div></a>`)(p); }


/* ================= USAGE: what every job cost, the meter a bill is made from ================= */
async function usageView(){
  const m = $('#main');
  m.innerHTML = `<div class="ph"><h1>Settings</h1></div>${setTabs('usage')}<div class="skel">Loading…</div>`;
  let d; try { d = await J('/api/desk/usage?brand=' + encodeURIComponent(S.brand)); } catch (e) { m.querySelector('.skel').outerHTML = `<div class="note stop">${esc(e.message)}</div>`; return; }
  const tbl = (title, rows, label) => `<div class="card" style="padding:0"><div style="padding:14px 16px;border-bottom:1px solid var(--line)"><h3>${title}</h3></div><table class="t"><tr><th>${label}</th><th style="text-align:right">Jobs</th><th style="text-align:right">Minutes</th><th style="text-align:right">Cost</th></tr>${rows.map(r => `<tr><td>${esc(label === 'Brief' && r.key !== '—' ? r.key : r.key)}</td><td class="n">${int(r.jobs)}</td><td class="n">${r.minutes}</td><td class="n">${usd(r.cost, 2)}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">Nothing metered yet</td></tr>'}</table></div>`;
  m.querySelector('.skel').outerHTML = `<div class="card" style="margin-bottom:16px"><div class="nums"><div><span class="lbl">Claude cost, all jobs</span><b>${usd(d.total, 2)}</b></div><div><span class="lbl">Jobs metered</span><b>${int(d.jobs)}</b></div></div><span class="lbl">${esc(d.basis)}</span></div>
    <div class="grid2" style="margin-bottom:16px">${tbl('By month', d.by_month, 'Month')}${tbl('By kind of job', d.by_kind, 'Job')}</div>${tbl('By brief', d.by_brief, 'Brief')}`;
}

boot();
asksBadge();

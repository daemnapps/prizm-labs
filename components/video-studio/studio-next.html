<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23EFE9E1'/%3E%3Cpolygon points='25,11 45,51 5,51' fill='%232F5BFF' stroke='%23171512' stroke-width='3.2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* The Studio in PRIZM (daemn.co's own system, docs/DESIGN.md + docs/studio.css), laid out like a Stripe dashboard:
   light paper, white cards, numbers first. Colour carries a job: violet swipes · indigo press-this · cyan video ·
   green ready/live · amber waiting on you · coral stop · magenta briefs. The prism sweep appears once, on the top bar. */
:root{
  --bone:#EFE9E1; --paper:#F7F4EF; --card:#FFFFFF; --ink:#171512; --ink-2:#4B453E; --ink-3:#716960;
  --line:rgba(23,21,18,.12); --line-2:rgba(23,21,18,.22);
  --violet:#6D3BF5; --indigo:#2F5BFF; --cyan:#00A8CC; --green:#12A06F; --amber:#F09000; --coral:#F04A2E; --magenta:#DB2A8C;
  --prism:linear-gradient(96deg,#6D3BF5,#2F5BFF,#00A8CC,#12A06F,#F09000,#F04A2E,#DB2A8C);
  --display:'Unbounded',system-ui,sans-serif; --body:'Plus Jakarta Sans','Helvetica Neue',system-ui,sans-serif;
  --mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r1:3px; --r2:8px; --r3:16px; --r4:999px; --float:0 26px 60px rgba(23,21,18,.22);
  --hue:var(--indigo); color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:14px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--indigo);text-decoration:none}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.mono,.lbl,.pill,.btn,.num{font-family:var(--mono)}
.lbl{font-size:11px;letter-spacing:.04em;color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}

/* icons: daemn.co's one set (docs/studio.js), one stroke, tinted by the block's --hue */
.ic{width:18px;height:18px;flex:none;display:inline-block}
.ic svg,.ib svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}
.ib{display:inline-grid;place-items:center;width:34px;height:34px;padding:8px;border-radius:var(--r2);color:var(--hue);background:color-mix(in srgb,var(--hue) 11%,transparent);flex:none}

/* top bar */
.bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.bar::before{content:"";display:block;height:3px;background:var(--prism)}
.barin{display:flex;align-items:center;gap:8px;height:56px;padding:0 24px}
.mark{display:flex;align-items:center;gap:9px;margin-right:18px;font:800 15px var(--display);letter-spacing:-.01em;color:var(--ink)}
.mark svg{width:26px;height:26px}
.nav{display:flex;gap:2px}
.nav a{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:var(--r2);color:var(--ink-2);font-weight:600;font-size:13.5px}
.nav a .ic{width:16px;height:16px}
.nav a:hover{background:var(--paper)}
.nav a.on{color:var(--indigo);background:color-mix(in srgb,var(--indigo) 9%,transparent)}
.grow{flex:1}
select.brand{border:1px solid var(--line-2);background:var(--card);border-radius:var(--r2);padding:6px 10px;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--card);border-radius:var(--r2);padding:7px 13px;font-size:12.5px;font-weight:500;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.go{background:var(--indigo);border-color:var(--indigo);color:#fff}
.btn.wait{background:var(--amber);border-color:var(--amber);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:default}
.btn .ic{width:15px;height:15px}

/* page */
main{padding:28px 24px 60px;max-width:1440px;margin:0 auto}
.ph{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.ph h1{margin:0;font:600 22px var(--display);letter-spacing:-.02em}
.ph .sub{color:var(--ink-3);font:12px var(--mono)}
.ph .acts{margin-left:auto;display:flex;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r3);padding:18px 20px}
.card h3{margin:0;font:600 14px var(--body);display:flex;align-items:center;gap:10px}
.card h3 .count{margin-left:auto;font:500 15px var(--mono);color:var(--hue)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 9px;border-radius:var(--r4);border:1px solid color-mix(in srgb,var(--hue) 35%,transparent);color:var(--hue);background:color-mix(in srgb,var(--hue) 8%,transparent);white-space:nowrap}
.pill .ic{width:13px;height:13px}
.p-swipe{--hue:var(--violet)}.p-video{--hue:var(--cyan)}.p-ready{--hue:var(--green)}.p-wait{--hue:var(--amber)}.p-stop{--hue:var(--coral)}.p-brief{--hue:var(--magenta)}.p-act{--hue:var(--indigo)}.p-mute{--hue:var(--ink-3)}
.empty{color:var(--ink-3);font-size:13px;padding:6px 0}
.note{background:var(--paper);border:1px dashed var(--line-2);border-radius:var(--r2);padding:12px 14px;color:var(--ink-2);font-size:13px}
.card.note{background:var(--card)}
.note.stop{border-color:color-mix(in srgb,var(--coral) 45%,transparent);color:var(--coral)}
.skel{color:var(--ink-3);padding:30px 0;text-align:center;font:12px var(--mono)}

/* Today */
.seg{display:inline-flex;margin-left:auto;border:1px solid var(--line-2,rgba(0,0,0,.2));border-radius:999px;padding:2px;background:var(--card,#fff)}
.seg a{font:500 12px var(--body);padding:5px 12px;border-radius:999px;color:var(--ink-2);text-decoration:none}.seg a.on{background:var(--ink);color:var(--paper)}
.cv{position:relative;height:calc(100vh - 150px);min-height:560px;border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:grab;
  background:var(--card,#fff) radial-gradient(circle,rgba(23,21,18,.09) 1px,transparent 1.2px) 0 0/22px 22px}
.cv.drag{cursor:grabbing}
.cv .stage{position:absolute;left:0;top:0;width:1200px;height:860px;transform-origin:0 0}
.cv svg.wires{position:absolute;inset:0;width:1200px;height:860px;overflow:visible;pointer-events:none}
.nd{position:absolute;width:250px;transform:translate(-50%,-50%);background:var(--card,#fff);border:1px solid var(--line);border-top:4px solid var(--hue);border-radius:14px;
  padding:12px 14px;display:grid;gap:6px;box-shadow:0 1px 2px rgba(23,21,18,.06),0 8px 24px -12px rgba(23,21,18,.18);cursor:pointer;text-decoration:none;color:inherit}
.nd:hover{border-color:var(--hue)}
.nd .h{display:flex;align-items:center;gap:8px}.nd .h b{font:600 14px var(--body)}.nd .h .k{margin-left:auto;font:600 11px var(--mono);color:var(--hue)}
.nd .big{font:700 22px var(--display);letter-spacing:-.02em}
.nd .ln{font-size:12.5px;color:var(--ink-2)}
.nd .gap{font:500 11px var(--mono);color:var(--amber)}.nd .gap::before{content:"✗ "}
.nd .ok{font:500 11px var(--mono);color:var(--green)}.nd .ok::before{content:"✓ "}
.hub{position:absolute;width:300px;transform:translate(-50%,-50%);text-align:center;display:grid;gap:4px;justify-items:center}
.hub .mer{font:800 56px var(--display);letter-spacing:-.04em;line-height:1}
.hub .ring{width:250px;height:250px;border-radius:50%;display:grid;place-items:center;align-content:center;gap:4px;background:var(--paper);border:1px solid var(--line)}
.cvctl{position:absolute;right:12px;bottom:12px;display:flex;gap:6px}
.cvctl button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card,#fff);font:600 16px var(--body);cursor:pointer}
.loop{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}
.loop .chart svg{width:100%;height:170px;display:block}
.loop .key{display:flex;gap:14px;flex-wrap:wrap;font:500 11.5px var(--mono);color:var(--ink-3)}
.loop .key i{display:inline-block;width:10px;height:3px;border-radius:2px;background:var(--hue);margin-right:5px;vertical-align:middle}
.lines summary{list-style:none;justify-self:start;display:inline-flex;margin-top:4px}.lines summary::-webkit-details-marker{display:none}
.lines form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.lines .lf{display:grid;gap:2px}.lines input{font:500 14px var(--mono);padding:6px 8px;border:1px solid var(--line-2,rgba(0,0,0,.2));border-radius:8px;background:var(--paper,#fff);width:100%;box-sizing:border-box}.lines button{grid-column:1/-1;justify-self:start}
.prop{display:grid;gap:8px;align-content:start}
.prop .big{font:700 26px var(--display);letter-spacing:-.02em}
.prop.up{border-color:color-mix(in srgb,var(--green) 45%,transparent)}.prop.down{border-color:color-mix(in srgb,var(--amber) 55%,transparent)}
.stg{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:6px 0}
.stg span{background:var(--hue)}
.stgk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stgk div{display:grid;gap:1px}.stgk b{font:600 18px var(--body)}
@media (max-width:860px){.loop{grid-template-columns:1fr}}
.money{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.mcard{display:grid;grid-template-columns:1fr 190px;gap:12px 18px;align-items:end}
.mcard .top{grid-column:1/-1;display:flex;align-items:center;gap:10px}
.mcard .top b{font:600 14px var(--body)}
.mcard .top .lbl{margin-left:auto}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.nums div{display:grid;gap:2px}
.nums b{font:500 clamp(15px,1.5vw,22px) var(--mono);white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.nums .up b{color:var(--green)}.nums .dn b{color:var(--coral)}
.spark{width:100%;height:48px}
.dcol{display:grid;gap:10px;align-content:start}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r2);background:var(--paper);color:var(--ink)}
.row b{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row span{color:var(--ink-3);font:11.5px var(--mono);grid-column:1}
.row .pill{grid-row:1/3;grid-column:2;align-self:center}
.run{display:flex;flex-wrap:wrap;gap:22px;margin-top:16px;padding:14px 20px}
.run span{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.run i{width:8px;height:8px;border-radius:50%;background:var(--hue)}

/* Ads */
.fbk{display:grid;gap:8px;margin-bottom:14px;border-left:4px solid var(--amber)}.fbh{display:flex;align-items:center;gap:8px}.fbh b{font:600 14px var(--body)}.fbh .lbl{margin-left:auto}
.fbk textarea{width:100%;box-sizing:border-box;border:1px solid var(--line-2,rgba(0,0,0,.2));border-radius:10px;padding:10px 12px;font:14.5px/1.55 var(--body);resize:vertical;background:var(--card);color:var(--ink)}
.fbl{display:grid;gap:6px}.fbn{display:grid;gap:2px;font-size:13px;border-top:1px solid var(--line);padding-top:6px}
.fbr{display:grid;gap:6px;margin-top:4px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--green) 6%,transparent)}.fbr.held{background:color-mix(in srgb,var(--amber) 10%,transparent)}
.fbc{display:grid;grid-template-columns:1fr 1fr;gap:6px}.fbc pre{margin:0;white-space:pre-wrap;font:12px/1.45 var(--mono);padding:6px 8px;border-radius:8px;max-height:160px;overflow:auto}
.fbc .b4{background:color-mix(in srgb,var(--coral) 9%,transparent)}.fbc .af{background:color-mix(in srgb,var(--green) 12%,transparent)}.fbq{color:var(--ink-2);font-style:italic}
@media(max-width:640px){.fbc{grid-template-columns:1fr}}
.sx{display:grid;gap:2px;margin-bottom:14px;border-left:4px solid var(--amber)}.sx b{font:600 14px var(--body)}.sx span{color:var(--ink-2);font-size:13.5px}
.sgrid{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.sv{position:sticky;top:80px;display:grid;gap:10px;padding:10px}.sv video,.sv img{width:100%;border-radius:10px;background:#000;max-height:60vh;object-fit:contain}
.sv .facts{display:grid;gap:6px;font-size:13px}.sv .facts a{color:var(--indigo)}
.beats{display:grid;gap:10px}
.beat{display:grid;gap:8px}.beat .bh{display:flex;align-items:center;gap:10px}.beat .bh b{font:600 14px var(--body)}.beat .bh .pill{margin-left:auto}.beat .chg[hidden]{display:none}
.beat .tw{display:grid;gap:2px;font-size:13px;color:var(--ink-3);background:var(--paper);border-radius:8px;padding:8px 10px}
.beat textarea{width:100%;box-sizing:border-box;border:1px solid var(--line-2,rgba(0,0,0,.2));border-radius:10px;padding:10px 12px;font:15px/1.6 var(--body);color:var(--ink);background:var(--card);resize:vertical;overflow:hidden}
.beat textarea:focus{outline:2px solid var(--amber);outline-offset:1px}
.sbar{position:sticky;bottom:12px;display:flex;align-items:center;gap:10px;justify-content:flex-end}.sbar .lbl{margin-right:auto}
@media (max-width:1100px){.sgrid{grid-template-columns:1fr}.sv{position:static}}
.split{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.list{padding:8px 0;max-height:calc(100vh - 170px);overflow:auto;position:sticky;top:80px}
.list .g{padding:12px 16px 4px;display:flex;justify-content:space-between;align-items:center}
.ad{padding:9px 16px;cursor:pointer;border-left:3px solid transparent;display:grid;gap:1px}
.ad:hover{background:var(--paper)}
.ad.on{background:color-mix(in srgb,var(--indigo) 6%,transparent);border-left-color:var(--indigo)}
.ad b{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ad span{font:11.5px var(--mono);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail{display:grid;gap:16px;min-width:0}
.dh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dh h2{margin:0;font:600 18px var(--display);letter-spacing:-.02em}
.dh .acts{margin-left:auto;display:flex;gap:8px}
.steps{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.steps button{border:0;background:none;padding:10px 12px;border-bottom:2px solid transparent;color:var(--ink-3);font:600 13px var(--body);display:flex;align-items:center;gap:7px;white-space:nowrap}
.steps button:hover{color:var(--ink)}
.steps button.on{color:var(--indigo);border-bottom-color:var(--indigo)}
.steps .d{width:8px;height:8px;border-radius:50%;background:var(--line-2)}
.steps .done .d{background:var(--green)}.steps .now .d{background:var(--indigo)}.steps .price .d{background:var(--amber)}
.work{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start}
.insp{position:sticky;top:80px;max-height:calc(100vh - 100px);overflow:auto;padding:0}
.insp section{padding:16px 18px;border-bottom:1px solid var(--line)}
.insp section:last-child{border-bottom:0}
.insp h4{margin:0 0 8px;font:500 11px var(--mono);letter-spacing:.04em;color:var(--ink-3);display:flex;justify-content:space-between;gap:8px}
.prompt{margin:0;font:12px/1.65 var(--mono);white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1px solid var(--line);border-radius:var(--r2);padding:12px;max-height:50vh;overflow:auto;color:var(--ink)}
.kv{display:grid;grid-template-columns:84px 1fr;gap:5px 10px;font-size:12.5px;margin:0}
.kv dt{color:var(--ink-3);font:11.5px var(--mono)}.kv dd{margin:0;word-break:break-word}
.tabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--card);border-radius:var(--r4);padding:3px 10px;font:11.5px var(--mono);color:var(--ink-2)}
.tabs button.on{border-color:var(--indigo);color:var(--indigo)}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.shot{border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;background:var(--card);padding:0;text-align:left;cursor:pointer}
.shot:hover{border-color:var(--ink-3)}
.shot.on{border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo)}
.shot .pic{aspect-ratio:9/16;background:var(--bone);position:relative}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .dur{position:absolute;right:6px;bottom:6px;background:rgba(23,21,18,.72);color:#fff;border-radius:var(--r1);padding:1px 6px;font:11px var(--mono)}
.shot .pill{position:absolute;left:6px;top:6px;background:var(--card)}
.shot .cap{padding:8px 10px;display:grid;gap:2px}
.shot .cap b{font-size:12px}
.shot .cap span{font-size:12px;color:var(--ink-3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tl{margin-top:16px;padding:12px 14px}
.tl .trk{display:flex;gap:2px;height:52px}
.tl .clip{background:var(--bone);border-radius:var(--r1);overflow:hidden;min-width:6px;cursor:pointer}
.tl .clip img{width:100%;height:100%;object-fit:cover}
.tl .rul{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--ink-3);margin-top:6px}
.vers{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.ver{border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;background:var(--card)}
.ver video{width:100%;aspect-ratio:9/16;background:var(--ink);display:block}
.ver b{display:block;padding:9px 11px;font-size:13px}
.frame{width:100%;height:calc(100vh - 260px);border:1px solid var(--line);border-radius:var(--r2);background:var(--card)}
.out{display:grid;gap:12px}
.file{border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;background:var(--card)}
.file header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px}
.file header .lbl{margin-left:auto}
.file .md{padding:14px 16px;max-height:560px;overflow:auto;font-size:13.5px;line-height:1.6}
.file .md h2,.file .md h3{font:600 14px var(--body);margin:14px 0 6px}
.file .md p{margin:0 0 8px}.file .md ul{margin:0 0 8px;padding-left:18px}
.file .md table{border-collapse:collapse;font-size:12.5px;margin:6px 0}.file .md td,.file .md th{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
.file .md code{font:12px var(--mono);background:var(--paper);padding:0 4px;border-radius:var(--r1)}
.file.missing header{color:var(--ink-3);font-weight:500}
.gal{display:flex;flex-wrap:wrap;gap:8px;padding:12px}
.gal img,.gal video{height:180px;border-radius:var(--r1);background:var(--bone)}
.price{border:1px solid color-mix(in srgb,var(--amber) 50%,transparent);border-radius:var(--r3);overflow:hidden;background:var(--card);max-width:640px}
.price .pt{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;background:color-mix(in srgb,var(--amber) 9%,var(--card))}
.price .pt b{font:500 30px var(--mono);font-variant-numeric:tabular-nums}
.price table{width:100%;border-collapse:collapse;font-size:13px}
.price td{padding:9px 18px;border-top:1px solid var(--line)}
.price td:last-child{text-align:right;font-family:var(--mono)}
.price form{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 18px;border-top:1px solid var(--line)}
.price label{display:grid;gap:4px;font:11px var(--mono);color:var(--ink-3)}
.price label.w,.price .gorow{grid-column:1/-1}
.price input,.price textarea,.price select{border:1px solid var(--line-2);border-radius:var(--r2);padding:8px 10px;background:var(--card);font:14px var(--body)}
.price .gorow{display:flex;justify-content:space-between;align-items:center}
.sub-steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}

/* Swipes */
.filters{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.filters button{border:1px solid var(--line-2);background:var(--card);border-radius:var(--r4);padding:5px 12px;font:12px var(--mono);color:var(--ink-2)}

/* a small Markdown reader for stage outputs: headings, lists, tables, bold, code */
function md(t){
  const lines = String(t || '').split('\n'); let h = '', list = false, table = [];
  const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
  const flushT = () => { if (!table.length) return; const rows = table.filter(r => !/^\|?\s*:?-{2,}/.test(r.replace(/\s/g, ''))); h += '<table>' + rows.map((r, i) => '<tr>' + r.replace(/^\||\|$/g, '').split('|').map(c => i ? `<td>${inl(c.trim())}</td>` : `<th>${inl(c.trim())}</th>`).join('') + '</tr>').join('') + '</table>'; table = []; };
  for (const l of lines) {
    if (/^\s*\|/.test(l)) { table.push(l.trim()); continue; } else flushT();
    if (/^\s*[-*] /.test(l)) { if (!list) { h += '<ul>'; list = true; } h += '<li>' + inl(l.replace(/^\s*[-*] /, '')) + '</li>'; continue; }
    if (list) { h += '</ul>'; list = false; }
    const m = /^(#{1,4})\s+(.*)/.exec(l);
    if (m) { const lv = Math.min(m[1].length + 1, 3); h += `<h${lv}>${inl(m[2])}</h${lv}>`; }
    else if (l.trim()) h += '<p>' + inl(l) + '</p>';
  }
  flushT(); if (list) h += '</ul>'; return h;
}

/* the teardown behind an ad: Swipe = the stages before the injection, Script = the injection onward */
const STRIP = /^stage(0|1|1[a-z]|2)$/;
async function teardownInAd(a, step){
  const label = a.kind === 'line' ? ((a.piece || {}).values || {}).teardown : a.run;
  if (!label) { $('#stage').innerHTML = `<div class="note">No teardown is on file for this ad.</div>`; inspText('Teardown', 'Older ads were made before teardowns were kept with them.'); return; }
  let sw; try { sw = S.swipes[label] || (S.swipes[label] = await J('/api/desk/swipe?label=' + encodeURIComponent(label))); }
  catch (e) { $('#stage').innerHTML = `<div class="note">${esc(e.message)}</div>`; inspText('Teardown', ''); return; }
  const stages = sw.stages.filter(s => step === 'swipe' ? STRIP.test(s.id) : !STRIP.test(s.id));
  chainView($('#stage'), $('#insp'), sw, stages, step === 'swipe');
}
function chainView(stageEl, inspEl, sw, stages, withVideo){
  let cur = stages.find(s => s.out) || stages[0];
  const draw = () => {
    stageEl.innerHTML = `${withVideo && (sw.video || sw.poster) ? `<div class="card" style="padding:12px;margin-bottom:16px;display:flex;gap:16px;align-items:flex-start">${sw.video ? `<video controls preload="metadata" style="width:170px;aspect-ratio:9/16;border-radius:8px;background:var(--ink)" src="${media(sw.video)}" ${sw.poster ? `poster="${media(sw.poster)}"` : ''}></video>` : `<img style="width:170px;aspect-ratio:9/16;object-fit:cover;border-radius:8px" src="${media(sw.poster)}" alt="">`}<dl class="kv"><dt>Swipe</dt><dd>${esc(nice(sw.label))}</dd><dt>Format</dt><dd>${esc(sw.format || '—')}</dd><dt>Lane</dt><dd>${esc(sw.lane || '—')}</dd><dt>Post</dt><dd>${sw.post_url ? `<a href="${esc(sw.post_url)}" target="_blank" rel="noopener">open</a>` : '—'}</dd></dl></div>` : ''}
      <div class="stl">${stages.map(s => `<button class="${cur && s.id === cur.id ? 'on' : ''}" data-st="${esc(s.id)}" style="--hue:var(--${s.status === 'done' ? 'green' : s.status === 'skipped' ? 'ink-3' : 'amber'})"><i></i>${esc(s.name)}</button>`).join('')}</div>
      ${cur ? `<div class="file"><header>${esc(cur.name)}<span class="lbl">${esc([cur.model, cur.seconds ? Math.round(cur.seconds) + ' s' : '', cur.version ? 'v' + cur.version : ''].filter(Boolean).join(' · '))}</span></header><div class="md" id="outmd">${cur.out ? 'Loading…' : esc(cur.why || 'Nothing written at this stage.')}</div></div>` : '<div class="note">No stages here yet.</div>'}`;
    stageEl.querySelectorAll('[data-st]').forEach(b => b.onclick = () => { cur = stages.find(s => s.id === b.dataset.st); draw(); });
    if (cur && cur.out) text(cur.out).then(t => { const el = $('#outmd'); if (el) el.innerHTML = /\.json$/.test(cur.out) ? `<pre class="prompt">${esc(t)}</pre>` : md(t); }).catch(e => { const el = $('#outmd'); if (el) el.textContent = e.message; });
    promptPanel(inspEl, cur);
  };
  draw();
}
function promptPanel(el, s){
  if (!s) { el.innerHTML = ''; return; }
  const tabs = [['The prompt', s.prompt], ['What was sent', s.sent]].filter(x => x[1]);
  el.innerHTML = `<section><h4>Prompt<span>${esc(s.prompt_name || '')}</span></h4>${tabs.length ? `<div class="tabs">${tabs.map((x, i) => `<button class="${i ? '' : 'on'}" data-pt="${i}">${x[0]}</button>`).join('')}<button data-copy>Copy</button></div><pre class="prompt" id="ptxt">Loading…</pre>` : '<div class="empty">No prompt for this stage</div>'}</section>
    <section><h4>Run</h4><dl class="kv"><dt>Model</dt><dd>${esc(s.model || '—')}</dd><dt>Engine</dt><dd>${esc(s.engine || '—')}</dd><dt>Version</dt><dd>${esc(s.version || '—')}</dd><dt>Time</dt><dd>${esc(s.seconds ? Math.round(s.seconds) + ' s' : '—')}</dd><dt>Finished</dt><dd>${esc(s.finished || '—')}</dd></dl></section>`;
  if (!tabs.length) return;
  const load = i => text(tabs[i][1]).then(t => { const p = el.querySelector('#ptxt'); if (p) p.textContent = t; }).catch(e => { const p = el.querySelector('#ptxt'); if (p) p.textContent = e.message; });
  load(0);
  el.querySelectorAll('[data-pt]').forEach(b => b.onclick = () => { el.querySelectorAll('[data-pt]').forEach(x => x.classList.toggle('on', x === b)); load(+b.dataset.pt); });
  el.querySelector('[data-copy]').onclick = () => navigator.clipboard.writeText(el.querySelector('#ptxt').textContent).then(() => toast('Prompt copied')).catch(() => toast('Select the text to copy'));
}

/* a workflow piece: the same six steps, its stations grouped under them */
const PHASE = id => /^(start|swipe|teardown|source)/.test(id) ? 'swipe' : /^(brief|writ|song|elements|script|cast)/.test(id) ? 'script' : /^(pack|plan|price|go)/.test(id) ? 'price' : /^edit/.test(id) ? 'edit' : /^(meta|file|approv|launch)/.test(id) ? 'approve' : 'shots';
const LINE = [['swipe', 'Swipe'], ['script', 'Script'], ['price', 'Price'], ['shots', 'Make'], ['edit', 'Edit'], ['approve', 'Approve']];
async function openLine(a, step){
  const det = $('#detail');
  const dh = `<div class="dh"><h2>${esc(a.title)}</h2><span class="pill p-video">${esc(a.line || '')}</span><span class="pill ${a.quote ? 'p-wait' : 'p-act'}">${a.quote ? 'at the price' : a.state === 'complete' ? 'done' : 'running'}</span></div>`;
  det.innerHTML = dh + `<div class="skel">Reading where it stands…</div>`;
  let p; try { p = a.piece = await J(`/api/desk/piece/${encodeURIComponent(a.brand)}/${encodeURIComponent(a.label)}`); } catch (e) { det.innerHTML = dh + `<div class="note stop">${esc(e.message)}</div>`; return; }
  const st = p.stations || []; const nowPh = p.now ? PHASE(p.now) : null;
  const phases = LINE.map(([id, name]) => { const ss = st.filter(s => PHASE(s.id) === id); return {id, name, ss, cls: (ss.length && ss.every(s => s.status === 'done') ? 'done' : id === nowPh ? 'now' : '') + (id === 'price' ? ' price' : '')}; });
  step = step || nowPh || 'swipe';
  det.innerHTML = dh + fbCard('video', 'w:' + a.label, a.title) + stepsBar(phases, step) + `<div class="work"><div id="stage"></div><aside class="card insp" id="insp"></aside></div>`;
  det.querySelectorAll('[data-step]').forEach(b => b.onclick = () => { setStep(a, b.dataset.step); openLine(a, b.dataset.step); });
  const ph = phases.find(x => x.id === step) || phases[0];
  if ((step === 'swipe' || step === 'script') && (p.values || {}).teardown) return teardownInAd(a, step);
  renderStations(a, ph.ss);
}
function renderStations(a, ss){
  const p = a.piece, stage = $('#stage');
  if (!ss.length) { stage.innerHTML = '<div class="note">Nothing in this step for this line.</div>'; inspText('Step', ''); return; }
  let cur = ss.find(s => s.status === 'now') || ss.find(s => s.quote) || ss[0];
  const draw = () => {
    let h = `<div class="sub-steps">${ss.map(s => `<button class="btn ${s.id === cur.id ? 'go' : ''}" data-ss="${esc(s.id)}">${esc(s.name)}${s.status === 'done' ? ' ✓' : ''}</button>`).join('')}</div>`;
    if (cur.status === 'now' && p.reason) h += `<div class="note" style="margin-bottom:12px">${esc(p.reason)}</div>`;
    if (cur.quote) h += priceCard(a, cur);

      if (o.missing) h += `<div class="file missing"><header>${esc(o.name)}<span class="lbl">not made yet</span></header></div>`;
      else if (/\.(jpe?g|png|webp|mp4|mov)$/i.test(o.path)) h += `<div class="file"><header>${esc(o.name)}</header><div class="gal">${/\.(mp4|mov)$/i.test(o.path) ? `<video controls preload="metadata" src="${media(o.path)}"></video>` : `<img loading="lazy" src="${media(o.path)}" alt="">`}</div></div>`;
      else h += `<div class="file" data-text="${esc(o.path)}"><header>${esc(o.name)}<span class="lbl">${esc(o.path.split('/').slice(-2).join('/'))}</span></header><div class="md">Loading…</div></div>`;
    }
    const g = p.gallery || {};
    for (const k of ['sheets', 'clips', 'versions', 'covers']) if (g[k] && /sheet|clip|take|upscale|edit|meta/.test(cur.id)) h += `<div class="file"><header>${esc(k)}<span class="lbl">${g[k + '_count']}</span></header><div class="gal">${g[k].map(x => x.video ? `<video controls preload="metadata" src="${media(x.path)}"></video>` : `<img loading="lazy" src="${media(x.path)}" alt="">`).join('')}</div></div>`;
    h += '</div>';
    stage.innerHTML = h;
    stage.querySelectorAll('[data-ss]').forEach(b => b.onclick = () => { cur = ss.find(s => s.id === b.dataset.ss); draw(); });
    stage.querySelectorAll('[data-text]').forEach(el => text(el.dataset.text).then(t => el.querySelector('.md').innerHTML = /\.json$/.test(el.dataset.text) ? `<pre class="prompt">${esc(t)}</pre>` : md(t)).catch(e => el.querySelector('.md').textContent = e.message));
    $('#insp').innerHTML = `<section><h4>What this step is told<button style="border:0;background:none;color:var(--indigo);font:11px var(--mono);cursor:pointer" data-copy>Copy</button></h4><pre class="prompt" id="does">${esc(cur.does || '(no instruction written)')}</pre></section><section><h4>Run</h4><dl class="kv"><dt>Who</dt><dd>${esc(cur.who)}</dd>${cur.paid ? '<dt>Cost</dt><dd>paid step</dd>' : ''}${cur.command ? `<dt>Command</dt><dd style="font:11px var(--mono)">${esc(cur.command)}</dd>` : ''}</dl></section>${cur.status === 'now' && p.ask ? `<section><h4>Next move</h4><pre class="prompt">${esc(typeof p.ask === 'string' ? p.ask : p.ask.say || JSON.stringify(p.ask))}</pre></section>` : ''}`;
    $('#insp [data-copy]').onclick = () => navigator.clipboard.writeText($('#does').textContent).then(() => toast('Copied')).catch(() => toast('Select the text to copy'));

}
function priceCard(a, s){

    ${(q.models || []).length > 1 ? `<label class="w">Clip model<select id="go-model">${q.models.map(m => `<option ${m.default ? 'selected' : ''}>${esc(m.id)}</option>`).join('')}</select></label>` : ''}
    <label class="w">In your words<textarea id="go-said" rows="2" required></textarea></label>
    <div class="gorow"><span class="lbl">Nothing is spent past the cap</span><button class="btn wait" type="submit">Go at ${tot}</button></div></form></div>`;

      toast(r.already && r.label ? 'Already torn down · ' + nice(r.label) : r.already ? 'Already on its way' : 'Saved · the teardown is running'); f.reset(); store.set('st.swshow', 'pasted'); swFeed(m); }

async function askOne(brand, id){
  const m = $('#main');
  m.innerHTML = `<div class="ph"><a class="btn" href="#asks">← Jobs</a><h1 id="aname">…</h1><span id="astate"></span></div><div class="skel">Loading…</div>`;
  let a; try { a = await J(`/api/desk/ask/${encodeURIComponent(brand)}/${encodeURIComponent(id)}`); } catch (e) { m.querySelector('.skel').outerHTML = `<div class="note stop">${esc(e.message)}</div>`; return; }
  const [w, c] = ASKSTATE[a.state] || [a.state, 'mute'];
  $('#aname').textContent = a.name; $('#astate').innerHTML = `<span class="pill p-${c}">${w}</span>`;
  let h = '';
  const stage = a.state === 'done' ? 1 : 0;
  if (a.what) h += `<div class="card" style="margin-bottom:12px;display:grid;gap:4px"><span class="lbl">What this job does · ${esc(a.lane || '')} · runs on ${esc(String(a.model || '').replace('claude-', '').replace(/-\d.*$/, ''))}</span><span>${esc(a.what)}</span></div>`;
  if ((a.next || []).length) h += `<div class="flow">${a.next.map((x, i) => `<span class="${i < stage ? 'done' : i === stage ? 'now' : ''}">${esc(x)}</span>`).join('<i>→</i>')}</div>`;
  const mins = t => t ? Math.max(0, Math.round((Date.now() - new Date(t)) / 60000)) : null;
  if (a.state === 'handed') h += `<div class="card" style="margin-bottom:16px;display:grid;gap:10px"><h3>${ib('send', 'indigo')}Handed to ${esc(HANDTO[a.to] || a.to)}</h3><div style="color:var(--ink-2);font-size:13.5px">${a.to === 'owner' ? 'It sits in their own repository as a note for their Claude to pick up. It runs on their usage, not yours.' : 'It sits in the team\'s list for whoever runs jobs. It runs on their usage, not yours.'} The result lands here when it is done.</div>
      <div class="arow"><button class="btn" data-hand="here">Run it here instead (uses your Claude)</button>${a.to !== 'team' ? '<button class="btn" data-hand="team">Hand to the team</button>' : ''}</div></div>`;
  if (a.state === 'queued') h += `<div class="card note">Waiting its turn: one job runs at a time. This page updates on its own.</div>`;
  if (a.state === 'running' || (a.steps && a.steps.count && a.state !== 'done')) h += `<div class="card" style="margin-bottom:16px"><h3>${ib('loop', 'indigo')}Claude is working on it<span class="lbl" style="margin-left:auto">${mins(a.started) ?? 0} min · ${a.steps ? a.steps.count : 0} steps</span></h3>
      <ol class="steps2">${((a.steps || {}).last || []).map(x => `<li>${esc(x)}</li>`).join('') || '<li class="lbl">Starting…</li>'}</ol></div>`;
  if (a.state === 'failed') h += `<div class="note stop">It stopped: ${esc(a.why || 'no reason given')}</div>`;
  if (a.kind === 'tune' && a.draft) h += `<div class="card" style="margin-bottom:16px"><h3>${ib('pen', 'amber')}New ${esc(a.input)} taste, ready for your OK<span style="margin-left:auto;display:flex;gap:8px"><button class="btn" data-taste="discard">Discard</button><button class="btn wait" data-taste="use"><i class="ic" data-i="check"></i>Use this</button></span></h3>
      <div class="grid2" style="margin-top:12px"><div><div class="lbl" style="margin-bottom:6px">Now</div><pre class="prompt" style="max-height:60vh">${esc(a.live || '(empty)')}</pre></div><div><div class="lbl" style="margin-bottom:6px">Draft</div><pre class="prompt" style="max-height:60vh">${esc(a.draft)}</pre></div></div></div>`;
  if (a.result) h += `<div class="file"><header>What came back<span class="lbl">${esc(a.finished || '')}</span></header><div class="md">${md(a.result)}</div></div>`;
  if (a.state === 'done' && a.kind === 'variations') h += `<form class="card arow" id="makef" style="margin-top:16px"><i class="ib" style="--hue:var(--green)">${icon('film')}</i><input name="which" required placeholder="Which ones to make (e.g. 1, 3 and 4, or all)" style="flex:1;min-width:220px;border:1px solid var(--line-2);border-radius:var(--r2);padding:9px 11px;font:14px var(--body)"><button class="btn go" type="submit">Make these</button></form>`;
  if (a.state === 'done' && a.steps && a.steps.count) h += `<details class="card" style="margin-top:16px"><summary class="lbl" style="cursor:pointer">What Claude did · ${a.steps.count} steps</summary><ol class="steps2">${a.steps.last.map(x => `<li>${esc(x)}</li>`).join('')}</ol></details>`;
  m.querySelector('.skel').outerHTML = `<div>${h}</div>`;
  paintIcons(m);
  m.querySelectorAll('[data-hand]').forEach(b => b.onclick = async () => { b.disabled = true; try { await J('/api/desk/ask-hand', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({brand, id, to: b.dataset.hand})}); toast(b.dataset.hand === 'here' ? 'Running here' : 'Handed to the team'); askOne(brand, id); } catch (e) { toast(e.message); b.disabled = false; } });
  const mf = $('#makef'); if (mf) mf.onsubmit = e => { e.preventDefault(); ask('make', mf.which.value + ' · from job ' + a.id + ' (' + a.input + ')', brand).then(r => { if (r) location.hash = 'asks/' + encodeURIComponent(r.brand) + '/' + encodeURIComponent(r.id); }); };
  m.querySelectorAll('[data-taste]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await J('/api/desk/taste', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({brand, kind: a.input, use: b.dataset.taste === 'use'})}); toast(b.dataset.taste === 'use' ? 'In use · every ' + a.input + ' skill reads it now' : 'Draft discarded'); askOne(brand, id); }
    catch (e) { toast(e.message); b.disabled = false; }
  });
  if (a.state === 'queued' || a.state === 'running') setTimeout(() => { if (S.view === 'asks' && S.arg === brand + '/' + id) askOne(brand, id); }, 10000);
}

/* ================= KNOWLEDGE: ask it like daemn.co/knowledge; every answer shows its sources ================= */
let kchat = store.get('st.kchat') || [];
const kfill = t => esc(t).replace(/\{([^}]{1,30})\}/g, 'your $1');
const kcited = t => new Set([...String(t).matchAll(/\[(\d+(?:\s*,\s*\d+)*)\]/g)].flatMap(m => m[1].split(/\s*,\s*/).map(Number)));
const kformat = (t, n) => md(t).replace(/\[(\d+(?:\s*,\s*\d+)*)\]/g, (x, g) => g.split(/\s*,\s*/).map(k => +k >= 1 && +k <= n ? `<button class="cite" data-n="${k}">${k}</button>` : '').join(''));
function ksources(src, text){
  const used = kcited(text), order = src.map((s, i) => i + 1).filter(n => used.has(n));
  if (!order.length) return '';
  return `<details class="ksrc"><summary class="lbl">${order.length} source${order.length > 1 ? 's' : ''}</summary><ol>${order.map(n => { const s = src[n - 1]; return `<li data-n="${n}"><span class="pill ${s.kind === 'Rule' ? 'p-act' : s.kind === 'Guide' ? 'p-ready' : 'p-swipe'}">${esc(s.kind === 'Guide' ? 'How it works' : s.kind || '')}</span> <span class="lbl">${esc(s.topic || '')}</span><div>${kfill(s.kind === 'Rule' ? s.text : (s.title || '') + ' — ' + (s.text || ''))}</div>${s.why && s.why !== s.text ? `<div class="lbl" style="margin-top:3px">Why: ${kfill(s.why)}</div>` : ''}</li>`; }).join('')}</ol></details>`;
}
const kturn = t => `<div class="kme">${esc(t.q)}</div><div class="kit"><div class="md">${kformat(t.a, t.sources.length)}</div>${ksources(t.sources, t.a)}</div>`;
function knowledgeView(){
  const m = $('#main');
  m.innerHTML = `<div class="ph"><h1>Knowledge</h1><span class="sub">3,536 rules, lessons and how-it-works guides · every answer shows where it came from</span>${kchat.length ? '<div class="acts"><button class="btn" id="kreset">New chat</button></div>' : ''}</div>
    <div class="kwrap"><div id="klog">${kchat.map(kturn).join('') || `<div class="card note">Ask how anything is done: hooks, offers, statics, creators, the ad system itself.</div>`}</div>
    <form class="card kbox" id="kform"><textarea id="kq" rows="2" placeholder="Ask anything…" required></textarea><button class="btn go" id="ksend" type="submit">Ask</button></form></div>`;
  const kq = $('#kq');
  kq.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#kform').requestSubmit(); } };
  if ($('#kreset')) $('#kreset').onclick = () => { kchat = []; store.set('st.kchat', kchat); knowledgeView(); };
  $('#klog').onclick = e => { const c = e.target.closest('.cite'); if (!c) return; const it = c.closest('.kit'), d = it.querySelector('details'); if (!d) return; d.open = true; it.querySelectorAll('li').forEach(li => li.classList.toggle('lit', li.dataset.n === c.dataset.n)); };
  $('#kform').onsubmit = async e => {
    e.preventDefault(); const q = kq.value.trim(); if (!q) return;
    $('#ksend').disabled = true; kq.value = '';
    if (!kchat.length) $('#klog').innerHTML = '';
    $('#klog').insertAdjacentHTML('beforeend', `<div class="kme">${esc(q)}</div><div class="kit"><div class="md"><span class="lbl">Searching 3,536 rules, lessons and guides…</span></div></div>`);
    const box = $('#klog').lastElementChild.querySelector('.md'); box.scrollIntoView({block: 'end'});
    let text = '', src = [];
    try {
      const r = await fetch('/api/desk/knowledge-ask', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({q, history: kchat.slice(-4).map(t => ({q: t.q, a: t.a}))})});
      if (!r.ok || !r.body) { const d = await r.json().catch(() => ({})); throw new Error(d.error || 'failed'); }
      const rd = r.body.getReader(), dec = new TextDecoder(); let buf = '';
      for (;;) {
        const {value, done} = await rd.read(); if (done) break;
        buf += dec.decode(value, {stream: true}); let i;
        while ((i = buf.indexOf('\n\n')) >= 0) {
          const block = buf.slice(0, i); buf = buf.slice(i + 2);
          const ev = (block.match(/^event: (.+)$/m) || [])[1]; let data = {}; try { data = JSON.parse((block.match(/^data: (.*)$/m) || [, '{}'])[1]); } catch {}
          if (ev === 'sources') { src = data; box.innerHTML = `<span class="lbl">Reading ${src.length} rules and lessons</span>`; }
          if (ev === 'text') { text += data.t; box.innerHTML = kformat(text, src.length); }
          if (ev === 'error') throw new Error(data.error);
        }
      }
      if (!text) throw new Error('no answer');
      box.insertAdjacentHTML('afterend', ksources(src, text));
      kchat.push({q, a: text, sources: src}); kchat = kchat.slice(-20); store.set('st.kchat', kchat);
    } catch (err) { box.insertAdjacentHTML('beforeend', `<p class="note stop">Couldn't finish that answer (${esc(err.message)}). Try again in a minute.</p>`); }
    finally { $('#ksend').disabled = false; kq.focus(); }
  };
  kq.focus();
}

  const prodOf = n => prods.find(x => (x.key || '').endsWith('brief-' + n));
  const camp = c => String(c || 'no campaign').replace(/^campaign_[^_]+_/, '').replace(/_/g, ' ');
  const creatorOf = n => String(n || '').split(/_|\s+-\s+/)[0].replace(/([a-z])([A-Z])/g, '$1 $2').trim();
  const cat = a => a.brief ? 'brief' : (a.creator || /trybe=/i.test(a.name || '')) ? 'creator' : 'other';
  const keyOf = a => ({brief: a.brief, creator: a.creator || creatorOf(a.name), other: a.legacy || camp(a.campaign)})[cat(a)];
  const CATS = [['brief', 'Briefs', 'film', 'cyan'], ['creator', 'Creators', 'user', 'magenta'], ['other', 'Not briefed', 'list', 'ink-3']];
  const sum = (rs, k) => rs.reduce((t, r) => t + (r[k] || 0), 0);
  const stats = rs => ({sw: rs.filter(r => r.spend_winner).length, kw: rs.filter(r => r.kpi_winner).length, n: rs.length, s7: sum(rs, 'spend7'), b7: sum(rs, 'buys7'), s30: sum(rs, 'spend30'), b30: sum(rs, 'buys30'), v30: sum(rs, 'value30'),

      <div class="card" style="margin-bottom:14px"><div class="nums" style="grid-template-columns:repeat(3,1fr)"><div><span class="lbl">Ads on the kill list</span><b style="color:var(--coral)">${rows.length}</b></div><div><span class="lbl">Their spend, 7 days</span><b>${usd(rows.reduce((t, a) => t + a.spend7, 0))}</b></div><div><span class="lbl">Lost to them, 7 days</span><b style="color:var(--coral)">${usd(waste)}</b></div></div></div>

      ${rows.map(a => `<tr><td style="font:12px var(--mono)" title="${esc(a.name)}">${a.brief ? `<b class="bn">${esc(a.brief)}</b>` : ''}${esc((a.name || '').replace(/^.*?brief-\d{4}_?/, '') || a.name)}</td><td class="n">${usd(a.spend7)}</td><td class="n">${int(a.buys7)}</td><td class="n" style="color:var(--coral)">${a.roas7 ?? '0.00'}</td><td class="n">${usd(a.spend30)}</td><td style="text-align:right">${offDone.has(String(a.id)) ? '<span class="pill p-mute">off</span>' : `<button class="btn" data-off="${esc(a.id)}">Turn off</button>`}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">Nothing under the line. Every active ad is pulling its weight at this rule.</td></tr>'}</table></div>
      <div class="lbl" style="margin-top:10px">Turn off goes through Outlier: it checks the ad's name on Meta, pauses it, and logs your press. One Meta call per ad.</div></div>`);

      catch (e) { toast(e.message); b.disabled = false; b.textContent = 'Turn off'; }

  };
  if (S.arg) { const [c, ...k] = S.arg.split('/'); if (['brief', 'creator', 'other'].includes(c)) { curCat = c; if (k.join('/')) { focus = k.join('/'); open.add(focus); } } }
  const cpa = (s, b) => b ? usd(s / b) : '—';
  const draw = () => {

    const rows = Object.entries(groups).map(([k, rs]) => ({k, rs, ...stats(rs)}));
    const sorts = {spend7: r => -r.s7, buys30: r => -r.b30, cpa7: r => (r.b7 ? r.s7 / r.b7 : 1e9)};
    rows.sort((x, y) => sorts[adsSort](x) - sorts[adsSort](y));

        (isOpen ? r.rs.map(a => { const [cw, cc] = CALL[a.call] || [a.call || '', 'mute']; return `<tr class="sub"><td title="${esc(a.name)}">${esc((a.name || '').replace(/^.*?brief-\d{4}_?/, '') || a.name)}${a.active ? '' : ' <span class="lbl">· no spend in 3 days</span>'}</td><td class="n">${usd(a.spend7)}</td><td class="n">${int(a.buys7)}</td><td class="n" style="color:var(--${a.break_even && a.cpa7 > a.break_even ? 'coral' : 'ink'})">${a.cpa7 != null ? usd(a.cpa7) : '—'}</td><td class="n">${usd(a.spend30)}</td><td class="n">${a.spend30 ? (a.value30 / a.spend30).toFixed(2) : '—'}</td><td style="text-align:right">${a.call ? `<span class="pill p-${cc}" title="${esc(a.why || '')}">${esc(cw)}</span>` : ''}</td></tr>`; }).join('') : ''); }).join('') || '<tr><td colspan="7" class="empty">Nothing here</td></tr>'}</table></div>

    m.querySelectorAll('[data-srt]').forEach(b => b.onclick = () => { adsSort = b.dataset.srt; store.set('st.adsort', adsSort); draw(); });
    m.querySelector('[data-only]').onclick = () => { onlyCalls = !onlyCalls; draw(); };

    m.querySelector('[data-kill]').onclick = () => { kill = true; history.replaceState(null, '', '#ads/kill'); drawKill(); };

  let d; try { d = await J('/api/desk/market?brand=' + encodeURIComponent(S.brand)); } catch (e) { m.querySelector('.skel').outerHTML = `<div class="note stop">${esc(e.message)}</div>`; return; }
  const ps = d.products || [];
  if (!ps.length) { m.querySelector('.skel').outerHTML = '<div class="card note">No market read on file for this brand yet. Scan the market above.</div>'; return; }
  const r0 = d.reads[0] || {};
  let mode = store.get('st.mk') || 'big';
  const sixMo = Date.now() - 183 * 864e5;
  const pick = () => mode === 'grow' ? [...ps].filter(p => p.growth != null).sort((a, b) => b.growth - a.growth) : mode === 'new' ? ps.filter(p => p.launched && new Date(p.launched) > sixMo).sort((a, b) => (b.month || 0) - (a.month || 0)) : ps;
  const draw = () => { const list = pick(); $('#mkgrid').innerHTML = list.slice(0, 80).map(card).join('') || '<div class="card note">Nothing here yet.</div>'; m.querySelectorAll('[data-mk]').forEach(b => b.classList.toggle('on', b.dataset.mk === mode)); $('#mkc').textContent = list.length + ' of ' + ps.length + ' products'; };
  m.querySelector('.skel').outerHTML = `<div class="filters"><button data-mk="big">Biggest</button><button data-mk="grow">Fastest growing</button><button data-mk="new">New: launched in 6 months</button><span class="lbl" id="mkc" style="margin-left:auto;align-self:center"></span></div>
    <div class="lbl" style="margin-bottom:12px">${d.reads.length} scans on file · newest ${esc(dayLabel(String(r0.ran_at || '').slice(0, 10)))}${r0.question ? ' · ' + esc(r0.question) : ''}</div>
    <div class="mk" id="mkgrid"></div>`;
  m.querySelectorAll('[data-mk]').forEach(b => b.onclick = () => { mode = b.dataset.mk; store.set('st.mk', mode); draw(); });
  draw();
}
function card(p){ return (p => `<a class="card mkc" href="${esc(p.link || '#')}" target="_blank" rel="noopener"><div class="pic">${p.picture ? `<img loading="lazy" src="${esc(p.picture)}" alt="">` : ''}</div>
      <div class="cap"><b>${esc(p.name)}</b><span class="lbl">${esc(p.shop || '')} · ${p.price != null ? usd(p.price, 2) : ''}</span>
      <div class="stats"><div><span class="lbl">30 days</span><b>${usd(p.month)}</b></div><div><span class="lbl">Growth</span><b style="color:var(--${(p.growth || 0) >= 0 ? 'green' : 'coral'})">${p.growth != null ? (p.growth > 0 ? '+' : '') + p.growth + '%' : '—'}</b></div></div>
      <div class="arow"><span class="pill ${p.source === 'kalodata' ? 'p-brief' : 'p-act'}">${p.source === 'kalodata' ? 'TikTok Shop' : 'own store'}</span>${p.category ? `<span class="pill p-mute">${esc(p.category)}</span>` : ''}${p.launched ? `<span class="lbl">since ${esc(p.launched)}</span>` : ''}</div></div></a>`)(p); }


/* ================= USAGE: what every job cost, the meter a bill is made from ================= */
async function usageView(){
  const m = $('#main');
  m.innerHTML = `<div class="ph"><h1>Settings</h1></div>${setTabs('usage')}<div class="skel">Loading…</div>`;
  let d, bl; try { [d, bl] = await Promise.all([J('/api/desk/usage?brand=' + encodeURIComponent(S.brand)), J('/api/desk/bill?brand=' + encodeURIComponent(S.brand)).catch(() => null)]); } catch (e) { m.querySelector('.skel').outerHTML = `<div class="note stop">${esc(e.message)}</div>`; return; }
  const tbl = (title, rows, label) => `<div class="card" style="padding:0"><div style="padding:14px 16px;border-bottom:1px solid var(--line)"><h3>${title}</h3></div><table class="t"><tr><th>${label}</th><th style="text-align:right">Jobs</th><th style="text-align:right">Minutes</th><th style="text-align:right">Cost</th></tr>${rows.map(r => `<tr><td>${esc(label === 'Brief' && r.key !== '—' ? r.key : r.key)}</td><td class="n">${int(r.jobs)}</td><td class="n">${r.minutes}</td><td class="n">${usd(r.cost, 2)}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">Nothing metered yet</td></tr>'}</table></div>`;
  const billCard = bl && bl.ok ? `<div class="card" style="margin-bottom:16px;border-color:color-mix(in srgb,var(--amber) 45%,transparent)"><h3>${ib('zap', 'amber')}This brand's bill at your prices<span class="count" style="--hue:var(--ink)">${usd(bl.total, 2)}</span></h3><table class="t" style="margin-top:10px">${bl.lines.map(l => `<tr><td>${esc(l.what)}</td><td class="n">${usd(l.amount, 2)}</td></tr>`).join('')}</table><span class="lbl">estimate from the last 30 days · prices set ${esc(bl.set || '')} · margin on usage ${usd(bl.margin_on_usage, 2)}</span></div>` : '';
  m.querySelector('.skel').outerHTML = billCard + `<div class="card" style="margin-bottom:16px"><div class="nums"><div><span class="lbl">Claude cost, all jobs</span><b>${usd(d.total, 2)}</b></div><div><span class="lbl">Jobs metered</span><b>${int(d.jobs)}</b></div></div><span class="lbl">${esc(d.basis)}</span></div>
    <div class="grid2" style="margin-bottom:16px">${tbl('By month', d.by_month, 'Month')}${tbl('By kind of job', d.by_kind, 'Job')}</div>${tbl('By brief', d.by_brief, 'Brief')}`;
}


/* ================= JOBS: the scheduled jobs, one switch each (job-meter). Off until the owner turns one on ================= */
async function scheduleView(){
  const m = $('#main');
  m.innerHTML = `<div class="ph"><h1>Settings</h1></div>${setTabs('schedule')}<div class="skel">Loading…</div>`;
  let d; try { d = await J('/api/desk/schedule'); } catch (e) { m.querySelector('.skel').outerHTML = `<div class="note stop">${esc(e.message)}</div>`; return; }
  if (S.view !== 'schedule') return;
  const on = d.jobs.filter(j => j.on).length;
  const last = j => !j.last_status ? 'never run' : j.last_status + (j.last_at ? ' · ' + String(j.last_at).slice(5, 16).replace('T', ' ') : '');
  m.querySelector('.skel').outerHTML = `<div class="card" style="margin-bottom:16px"><div class="nums"><div><span class="lbl">Jobs on</span><b>${int(on)} of ${int(d.jobs.length)}</b></div><div><span class="lbl">Where they run</span><b style="font-size:15px">${esc(d.where || 'not set')}</b></div><div><span class="lbl">Spent, last 30 days</span><b>${usd(d.spent_usd || 0, 2)}</b></div></div><span class="lbl">A job you turn on runs at the next scheduled run (${esc(d.at || 'nightly')}). Paid jobs stop at their cap.</span></div>
    <div class="card" style="padding:0"><table class="t"><tr><th>Job</th><th>Model</th><th style="text-align:right">Cap a night</th><th>Last run</th><th style="text-align:right">On</th></tr>${d.jobs.map(j => `<tr><td><b>${esc(j.job)}</b><div class="lbl">${esc(j.what || '')}${j.brands && j.brands.length ? ' · ' + esc(j.brands.join(', ')) : ''}</div></td><td>${esc(j.model || 'none')}</td><td class="n">${j.cap_usd == null ? 'free' : usd(j.cap_usd, 0)}</td><td><span class="lbl">${esc(last(j))}</span></td><td class="n"><label style="display:inline-flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="sched-${esc(j.job)}" data-sched="${esc(j.job)}" ${j.on ? 'checked' : ''}><span>${j.on ? 'On' : 'Off'}</span></label></td></tr>`).join('') || `<tr><td colspan="5" class="empty">${esc(d.note || 'No jobs yet')}</td></tr>`}</table></div>`;
  m.querySelectorAll('[data-sched]').forEach(c => c.onchange = () => J('/api/desk/schedule', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({job: c.dataset.sched, on: c.checked, by: 'owner'})}).then(() => { toast(c.dataset.sched + (c.checked ? ' is on' : ' is off')); scheduleView(); }).catch(e => { c.checked = !c.checked; toast(e.message); }));
}


/* ================= BRANDS JOINING: the five onboarding steps, inside the app ================= */
const joinMsg = j => `Hi${j.contact ? ' ' + j.contact : ''}, here's how we get ${j.name} set up. About an hour of your time, and you keep all your data.

1. In Claude, say: "Copy github.com/daemnapps/prizm-labs into a new private repo called ${String(j.name).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')}-prizm"
2. Then say: "Share this repo with daemnapps"
3. In that folder, say: "activate Prizm Lab". It reads your website, reviews and Drive first and only asks you to confirm. Keys go on the setup page, never in a chat.
4. Send us what it says is missing.
5. We tear down your top ads by spend and start producing. Going live is always your click.`;
async function joinCard(el){
  let d; try { d = await J('/api/desk/joining'); } catch (e) { el.innerHTML = `<div class="note stop">${esc(e.message)}</div>`; return; }
  const ICON = {done: '✓', partly: '◐', todo: ''};
  el.innerHTML = `<div class="card" style="padding:0"><div style="padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px"><h3>${ib('plus', 'indigo')}Brands joining<span class="count" style="--hue:var(--ink-3)">${d.brands.length}</span></h3><a class="btn" href="#join" style="margin-left:auto">What they see</a></div>
    ${d.brands.map((j, i) => `<div class="jn" data-j="${i}"><div class="jh"><b>${esc(j.name)}</b>${j.contact ? `<span class="lbl">${esc(j.contact)}</span>` : ''}${j.repo ? `<span class="lbl">${esc(j.repo)}</span>` : ''}</div>
      <div class="jsteps">${j.steps.map((st, k) => `<div class="js ${st.state} ${j.now === st.id ? 'now' : ''}"><i>${ICON[st.state] || k + 1}</i><span>${esc(st.name)}</span>${st.note ? `<em>${esc(st.note)}</em>` : ''}</div>`).join('')}</div>
      <div class="arow" style="margin-top:10px">
        ${['repo', 'invite'].includes(j.now) ? `<button class="btn go" data-jmsg="${i}">Copy the message for ${esc(j.contact || j.name)}</button>` : ''}
        ${!j.repo ? `<input data-jrepo="${i}" placeholder="Their repo, owner/name, once made" style="border:1px solid var(--line-2);border-radius:var(--r2);padding:7px 10px;font:13px var(--body);min-width:220px">` : ''}
        ${j.now === 'folder' || j.now === 'asked' ? `<button class="btn" data-ask="onboard" data-brand="" data-input="${esc(j.name + (j.repo ? ' · repo ' + j.repo : ''))}">Make the ask list</button>` : ''}
        ${j.now === 'asked' ? `<button class="btn go" data-jstep="${i}|asked">Mark the list sent</button>` : ''}
        ${j.now === 'first' ? `<a class="btn go" href="#production/swipes">Start the first run</a>` : ''}
        <button class="btn" data-jdel="${i}" style="margin-left:auto">Remove</button></div></div>`).join('') || '<div class="empty" style="padding:14px 16px">No brands joining yet.</div>'}
    <form class="arow" id="jadd" style="padding:12px 16px;border-top:1px solid var(--line)"><input name="name" required placeholder="Brand name" style="flex:1;min-width:160px;border:1px solid var(--line-2);border-radius:var(--r2);padding:9px 11px;font:14px var(--body)"><input name="contact" placeholder="Their contact" style="flex:1;min-width:140px;border:1px solid var(--line-2);border-radius:var(--r2);padding:9px 11px;font:14px var(--body)"><input name="repo" placeholder="Their repo, if made (owner/name)" style="flex:1;min-width:200px;border:1px solid var(--line-2);border-radius:var(--r2);padding:9px 11px;font:14px var(--body)"><button class="btn go" type="submit">Add a brand</button></form></div>`;
  paintIcons(el);
  const post = body => J('/api/desk/joining', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)}).then(() => joinCard(el)).catch(e => toast(e.message));
  el.querySelector('#jadd').onsubmit = e => { e.preventDefault(); const f = e.target; post({name: f.name.value, contact: f.contact.value, repo: f.repo.value}); };
  el.querySelectorAll('[data-jmsg]').forEach(b => b.onclick = () => { const t = joinMsg(d.brands[+b.dataset.jmsg]); navigator.clipboard.writeText(t).then(() => toast('Message copied: paste it to them')).catch(() => toast('Open "What they see" to select it')); });
  el.querySelectorAll('[data-jrepo]').forEach(inp => inp.onchange = () => post({name: d.brands[+inp.dataset.jrepo].name, repo: inp.value}));
  el.querySelectorAll('[data-jstep]').forEach(b => b.onclick = () => { const [i, st] = b.dataset.jstep.split('|'); post({name: d.brands[+i].name, step: st}); });
  el.querySelectorAll('[data-jdel]').forEach(b => b.onclick = () => post({name: d.brands[+b.dataset.jdel].name, remove: true}));
}
async function joinView(){
  const m = $('#main');
  let d = {brands: []}; try { d = await J('/api/desk/joining'); } catch {}
  const j = d.brands.find(x => x.name === S.arg) || d.brands[0] || {name: 'your brand'};
  m.innerHTML = `<div class="ph"><a class="btn" href="#portfolio">← Portfolio</a><h1>What a new brand sees</h1></div>
    <div class="card" style="margin-bottom:16px;display:grid;gap:12px"><h3>${ib('shield', 'green')}They keep their data<span class="lbl" style="margin-left:auto">their own private repo · we get access to that one repo</span></h3>
      <div class="jsteps">${JOIN_TXT.map((t, k) => `<div class="js"><i>${k + 1}</i><span>${esc(t[0])}</span><em>${esc(t[1])}</em></div>`).join('')}</div></div>
    <div class="card"><h3>${ib('send', 'indigo')}The message, ready to send${d.brands.length > 1 ? `<select id="jpick" style="margin-left:auto;border:1px solid var(--line-2);border-radius:var(--r2);padding:5px 8px">${d.brands.map(b => `<option ${b.name === j.name ? 'selected' : ''}>${esc(b.name)}</option>`).join('')}</select>` : ''}</h3>
      <pre class="prompt" id="jtext" style="margin-top:12px;font-family:var(--body);font-size:14px">${esc(joinMsg(j))}</pre><div class="arow" style="margin-top:10px"><button class="btn go" id="jcopy">Copy</button><span class="lbl">You send it. Nothing goes out from here.</span></div></div>`;
  paintIcons(m);
  $('#jcopy').onclick = () => navigator.clipboard.writeText($('#jtext').textContent).then(() => toast('Copied')).catch(() => toast('Select the text to copy'));
  if ($('#jpick')) $('#jpick').onchange = e => { location.hash = 'join/' + encodeURIComponent(e.target.value); };
}
const JOIN_TXT = [['They make their own repo', 'a private copy of Prizm, under their account'], ['They invite us', 'to that one repo'], ['Their Claude fills the brand folder', '"activate Prizm Lab": site, reviews, Drive first'], ['We send what\'s missing', 'one plain list'], ['First run', 'top ads by spend → teardowns → scripts → production']];


/* ================= SAUCE: your own pass over the spiced script, the one job that is yours ================= */
async function sauceLane(label){
  const h = host(); if (!h.querySelector('#sdet')) h.innerHTML = '<div class="skel">Loading scripts…</div>';
  let d; try { d = await J('/api/desk/sauce?brand=' + encodeURIComponent(S.brand)); } catch (e) { h.innerHTML = `<div class="note stop">${esc(e.message)}</div>`; return; }
  const list = d.scripts || [];
  label = label || (list.find(x => !x.sauce) || list[0] || {}).label;
  const todo = list.filter(x => !x.sauce), done = list.filter(x => x.sauce);
  const day = t => new Date(t * 1000).toLocaleDateString('en-GB', {day:'numeric', month:'short'});
  const row = x => `<a class="ad ${x.label === label ? 'on' : ''}" href="#production/sauce/${encodeURIComponent(x.label)}" style="color:var(--ink)"><b>${esc(nice(x.label.replace(/^[a-z0-9]+-/, '')))}</b><span>${x.sauce ? 'sauced ' + day(x.sauced_at) : 'written ' + day(x.at)}</span></a>`;
  h.innerHTML = `<div class="card sx"><b>Sauce</b><span>The tools wrote every line of the script. You rewrite the lines that need you, beat by beat. Your words are saved next to theirs; the tools' version is never changed.</span></div>
    <div class="split"><div class="card list"><div class="g"><span class="pill p-wait">Needs your sauce</span><span class="lbl">${todo.length}</span></div>${todo.map(row).join('') || '<div class="empty" style="padding:14px">Nothing waiting</div>'}
      ${done.length ? `<div class="g"><span class="pill p-ready">Sauced</span><span class="lbl">${done.length}</span></div>${done.map(row).join('')}` : ''}</div>
    <div class="detail" id="sdet">${label ? '<div class="skel">Opening…</div>' : '<div class="card note">Nothing to sauce yet.</div>'}</div></div>`;
  if (!label) return;
  let g; try { g = await J('/api/desk/sauce-one?label=' + encodeURIComponent(label)); } catch (e) { $('#sdet').innerHTML = `<div class="note stop">${esc(e.message)}</div>`; return; }
  const beats = g.beats || [];
  const media = p => '/api/desk/media?path=' + encodeURIComponent(p);
  const left = `<div class="card sv">${g.video ? `<video src="${media(g.video)}" ${g.poster ? `poster="${media(g.poster)}"` : ''} controls playsinline preload="metadata"></video>` : g.poster ? `<img src="${media(g.poster)}" alt="">` : '<div class="empty">No swipe video on file</div>'}
      <div class="facts">${g.post_url ? `<a href="${esc(g.post_url)}" target="_blank" rel="noopener">The original post ↗</a>` : ''}
        ${g.profile ? `<span><span class="lbl">Profile</span> ${esc(nice(g.profile))}</span>` : ''}
        ${g.writing_cost != null ? `<span><span class="lbl">Writing cost</span> ${usd(g.writing_cost)}</span>` : ''}
        ${g.owner_script ? `<span class="pill p-act">Your script was locked in</span>` : ''}
        <span class="note" style="font-size:12px">The brief doesn't read your Sauce yet. That's the next fix.</span></div></div>`;
  const beatHtml = beats.length ? beats.map(b => { const mine = b.mine != null ? b.mine : b.tools; return `<div class="card beat" data-i="${b.i}">
      <div class="bh"><b>${esc(nice(b.section))}</b><span class="lbl">level ${esc(b.level || '—')}${b.register ? ' · ' + esc(b.register) : ''}</span><span class="pill p-act chg" ${mine !== b.tools ? '' : 'hidden'}>yours</span></div>
      ${b.tools ? `<div class="tw"><span class="lbl">The tools wrote</span>${esc(b.tools)}</div>` : '<div class="tw"><span class="lbl">The tools wrote</span><i>no spoken words (picture only)</i></div>'}
      <textarea rows="${Math.max(2, Math.ceil((mine || '').length / 70))}" data-tools="${esc(b.tools)}">${esc(mine || '')}</textarea></div>`; }).join('')
    : `<div class="card beat"><div class="bh"><b>The whole script</b><span class="lbl">this older script isn't laid out beat by beat</span></div><textarea id="sauceall" rows="24">${esc(g.sauce || g.script)}</textarea></div>`;
  $('#sdet').innerHTML = `<div class="dh"><h2>${esc(nice(label.replace(/^[a-z0-9]+-/, '')))}</h2>${g.sauce ? '<span class="pill p-ready">sauced</span>' : '<span class="pill p-wait">needs your sauce</span>'}<span class="lbl">${beats.length} beats</span></div>
    <div class="sgrid">${left}<div class="beats">${beatHtml}
      <div class="card arow sbar"><span class="lbl" id="scount"></span><button class="btn" id="sreset">Back to the tools' lines</button><button class="btn wait" id="ssave"><i class="ic" data-i="check"></i>Save sauce</button></div></div></div>`;
  paintIcons($('#sdet'));
  const tas = [...document.querySelectorAll('#sdet .beat textarea[data-tools]')];
  const count = () => { const n = tas.filter(t => t.value.trim() !== t.dataset.tools.trim()).length; $('#scount').textContent = beats.length ? `${n} of ${beats.length} beats are yours` : ''; };
  tas.forEach(t => t.oninput = () => { t.closest('.beat').querySelector('.chg').hidden = t.value.trim() === t.dataset.tools.trim(); t.style.height = 'auto'; t.style.height = t.scrollHeight + 2 + 'px'; count(); });
  requestAnimationFrame(() => tas.forEach(t => { t.style.height = 'auto'; t.style.height = t.scrollHeight + 2 + 'px'; }));
  count();
  $('#sreset').onclick = () => { tas.forEach(t => { t.value = t.dataset.tools; t.oninput(); }); };
  $('#ssave').onclick = async () => { const b = $('#ssave'); b.disabled = true;
    const body = beats.length ? {label, beats: tas.map(t => ({i: +t.closest('.beat').dataset.i, text: t.value}))} : {label, text: $('#sauceall').value};
    try { const r = await J('/api/desk/sauce', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)}); toast(beats.length ? `Sauce saved · ${r.changed} beats yours` : 'Sauce saved'); sauceLane(label); } catch (e) { toast(e.message); b.disabled = false; } };
}

boot();
asksBadge();
</script>

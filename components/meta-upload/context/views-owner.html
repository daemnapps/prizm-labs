<title>Acquisition Command</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: a sticky control strip (brand · view · funnel/store/blended) over one view at a time — Money (big numbers, then per ad),
   Flow (vertical step strips with the biggest leak lit red), Priorities (ranked cards). Same zinc/hairline/one-blue look as the Funnel Map. */
:root{
  --bg:#f6f6f8;--panel:#fff;--fg:#18181b;--muted:#71717a;--line:#e4e4e7;--soft:#f1f1f4;
  --accent:#2563eb;--accentbg:#e8efff;
  --good:#15803d;--goodbg:#dcfce7;--warn:#b45309;--warnbg:#fef3c7;--bad:#b91c1c;--badbg:#fee2e2;
  --sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0b0e;--panel:#141418;--fg:#f4f4f5;--muted:#a1a1aa;--line:#26262c;--soft:#1b1b21;
  --accent:#6ea0ff;--accentbg:#16213a;--good:#4ade80;--goodbg:#0b2a17;--warn:#fbbf24;--warnbg:#33260a;--bad:#f87171;--badbg:#3a1010;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0b0e;--panel:#141418;--fg:#f4f4f5;--muted:#a1a1aa;--line:#26262c;--soft:#1b1b21;
  --accent:#6ea0ff;--accentbg:#16213a;--good:#4ade80;--goodbg:#0b2a17;--warn:#fbbf24;--warnbg:#33260a;--bad:#f87171;--badbg:#3a1010;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:22px 72px;display:flex;flex-direction:column;gap:24px}
h1{font-size:clamp(26px,5vw,34px);letter-spacing:-.025em;margin:0;line-height:1.05}
h2{font-size:19px;letter-spacing:-.01em;margin:0;display:flex;align-items:center;gap:8px;text-wrap:balance}
h3{font-size:15px;margin:0}
p{margin:0}
.sub{color:var(--muted);max-width:68ch}
.head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between}
.stamp{font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px;display:inline-flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:7px 13px;border-radius:9px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.seg button .ico{width:15px;height:15px}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg.mode button[aria-pressed="true"]{color:var(--accent)}
section{display:flex;flex-direction:column;gap:14px}
.chip{font-size:12.5px;border-radius:999px;padding:4px 10px;display:inline-flex;gap:6px;align-items:center;font-weight:500;width:max-content;max-width:100%}
.chip .ico{width:14px;height:14px}
.chip.good{background:var(--goodbg);color:var(--good)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.plain{background:var(--soft);color:var(--muted)}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .k{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:flex;gap:6px;align-items:center}
.tile .k .ico{width:14px;height:14px}
.tile .v{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .m{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tile.hero{background:var(--accentbg);border-color:transparent}
.tile.empty{background:var(--soft);border-style:dashed}
.tile.empty .v{color:var(--muted);font-size:20px}
.v.good{color:var(--good)}.v.bad{color:var(--bad)}.v.warn{color:var(--warn)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.stack{height:16px;border-radius:999px;overflow:hidden;display:flex;background:var(--soft)}
.stack span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.parts{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.parts .row{display:grid;grid-template-columns:minmax(0,1fr) 64px 96px;gap:10px;align-items:center}
.parts .num{font-variant-numeric:tabular-nums;text-align:right}
.pill{font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap;display:inline-block}
.pill.funnel{background:var(--accentbg);color:var(--accent)}.pill.store{background:var(--warnbg);color:var(--warn)}.pill.renewal{background:var(--soft);color:var(--muted)}
.pill.kill{background:var(--badbg);color:var(--bad)}.pill.scale{background:var(--goodbg);color:var(--good)}.pill.fix{background:var(--warnbg);color:var(--warn)}.pill.watch{background:var(--soft);color:var(--muted)}
.pill.tag{background:var(--badbg);color:var(--bad)}
.grid{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.grid table{border-collapse:collapse;width:100%;min-width:720px;font-size:13.5px}
.grid th,.grid td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.grid tr:last-child td{border-bottom:0}
.grid th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--soft);white-space:nowrap}
.grid .n{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.grid td.good{color:var(--good);font-weight:700}.grid td.bad{color:var(--bad);font-weight:700}
.adname{font-weight:600;word-break:break-word;max-width:340px}
.adsub{font-family:var(--mono);font-size:11px;color:var(--muted)}
.callout{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border-radius:12px;padding:12px 14px;font-size:14px}
.callout .ico{color:var(--accent);margin-top:2px}
.callout.bad .ico{color:var(--bad)}
.flows{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.steps{display:flex;flex-direction:column}
.st{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;position:relative;padding-block:6px}
.st::before{content:"";position:absolute;left:19px;top:0;bottom:0;width:2px;background:var(--line)}
.st:first-child::before{top:50%}.st:last-child::before{bottom:50%}
.node{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;position:relative;z-index:1;background:var(--accentbg);color:var(--accent);border:2px solid var(--panel)}
.node .ico{width:17px;height:17px}
.st .lab{font-weight:600;font-size:14px}
.st .lost{font-size:12.5px;color:var(--muted)}
.st .cnt{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.st.leak .node{background:var(--badbg);color:var(--bad)}
.st.leak .lost{color:var(--bad);font-weight:600}
.st.blind .node{background:var(--soft);color:var(--muted)}
.st.blind .cnt{color:var(--muted);font-size:14px}
.meter{height:6px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:4px}
.meter span{display:block;height:100%;background:var(--accent);border-radius:99px}
.st.leak .meter span{background:var(--bad)}
.prios{display:flex;flex-direction:column;gap:10px}
.prio{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px}
.prio .rk{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700;background:var(--soft);font-variant-numeric:tabular-nums}
.prio.kill .rk{background:var(--badbg);color:var(--bad)}.prio.scale .rk{background:var(--goodbg);color:var(--good)}.prio.fix .rk{background:var(--warnbg);color:var(--warn)}
.prio .t{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.prio .what{font-weight:600;word-break:break-word}
.prio .numline{font-family:var(--mono);font-size:12.5px;margin-top:4px;word-break:break-word}
.prio .why{font-size:13.5px;color:var(--muted);margin-top:2px}
.counts{display:flex;gap:8px;flex-wrap:wrap}
ul.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted)}
.foot{font-size:12.5px;color:var(--muted);max-width:80ch;display:flex;flex-direction:column;gap:6px}
code{font-family:var(--mono);font-size:12px;background:var(--soft);padding:1px 5px;border-radius:4px;word-break:break-all}
@media (max-width:560px){.tile .v{font-size:24px}.parts .row{grid-template-columns:minmax(0,1fr) 44px 84px}.st .cnt{font-size:18px}}
</style>

","ad":"Brand B_brilliance-face-scrub_brief-0312_batch-2026-10-21-a_cpk-brilliance-face-scrub-portal-yai","score":635.0,"number":"funnel ROAS 1.07 \u00b7 7 customers \u00b7 $90.71 per customer \u00b7 14.3% took an upsell","why":"Pays back on funnel orders alone over 30 days ($635.00 back on $594.22).","rank":1},{"type":"fix","ad":"Brand B Brilliance Body Scrub: quiz / portal \u2192 offer page","score":6464.75,"number":"95 of 143 left (66.4%) in 3 days","why":"The biggest drop on this funnel, page to page (Clarity's visits per page, then the store's own orders).","rank":2},{"type":"fix","ad":"Brand B Brilliance Face Scrub: quiz / portal \u2192 offer page","score":3606.65,"number":"53 of 62 left (85.5%) in 3 days","why":"The biggest drop on this funnel, page to page (Clarity's visits per page, then the store's own orders).","rank":3},{"type":"fix","ad":"Ad tags that don't name the ad","score":854.1,"number":"$854.10 of 30-day revenue on orders whose ad can't be named","why":"Ad URLs carrying {{ad.name}} literally, an ad id the warehouse doesn't know, or a Meta click with no tags.","rank":4},{"type":"fix","ad":"Email flows by repeat revenue","score":156.0,"number":"campaign: 10/20/2026 | Brilliance Body Scrub | But we received this review from one of you | Loyal Customer $156.00 \u00b7 email: 10/10/2026 | Brilliance Body Scrub | Complete your Brand B routine | Returning Customer $57.00 \u00b7 flow: August 2026 - Abandoned Checkout $0.00","why":"Repeat revenue each flow brought back from these customers; the lowest earners are the ones to fix.","rank":5},{"type":"watch","ad":"Brand B_brilliance-body-scrub_brief-prizm-0001_batch-2026-07-08-a_body-scrub-cpk-quiz","score":2716.91,"number":"funnel ROAS 0.84 \u00b7 pixel ROAS 1.02 \u00b7 41 customers \u00b7 $2716.91 spent (30 days)","why":"Sells, but funnel orders alone don't pay the spend back; blended (pixel) is the tie-breaker.","rank":6},{"type":"watch","ad":"Brand B's Grandma - Advertorial #2","score":1154.05,"number":" ys","why":"Clicks arrive but nobody reaches checkout yet; under the kill line ($66.27 over 3+ days).","rank":13}]}},"rules":["Ranked by kind, then by dollars at stake: kill first (spend burning), then scale, fix, watch.","Kill: spent at least one customer's 30-day value (floor $50) over 3+ of the last 7 days, with 0 store orders and 0 pixel purchases.","Scale: 3+ funnel customers in 30 days and funnel revenue at least 1.0\u00d7 spend.","Watch: $10+ spend and link clicks in 7 days but no checkout yet, or sells with funnel ROAS under 1.0.","Fix: the biggest page drop per funnel (3+ lost), clicks that never land (20+ clicks, under 25% seen by Clarity), revenue whose ad can't be named, and email flows.","Leaks are ranked by visits lost \u00d7 the funnel's average order; the page shows only the visits lost."],"asof":"2026-10-30"}</script>
<script>
(function(){
  var DOC = {};
  try { DOC = JSON.parse(document.getElementById('views-data').textContent || '{}'); } catch (e) { DOC = {}; }
  var brands = Object.keys(DOC.brands || {});
  var S = { brand: brands[0], view: 'money', mode: 'funnel' };
  try { var saved = JSON.parse(localStorage.getItem('acq-cmd') || '{}');
        if (saved.brand && brands.indexOf(saved.brand) >= 0) S.brand = saved.brand;
        if (saved.view) S.view = saved.view; if (saved.mode) S.mode = saved.mode; } catch (e) {}
  if (/^#(money|flow|prio)$/.test(location.hash)) S.view = location.hash.slice(1);

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function $m(x){ return x == null ? '—' : '$' + Number(x).toLocaleString('en-US', {minimumFractionDigits: x >= 1000 ? 0 : 2, maximumFractionDigits: x >= 1000 ? 0 : 2}); }
  function $m2(x){ return x == null ? '—' : '$' + Number(x).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}); }
  function n(x){ return x == null ? '—' : Number(x).toLocaleString('en-US'); }
  function rx(x){ return x == null ? '—' : Number(x).toFixed(2) + '×'; }
  function pct(x){ return x == null ? '—' : x + '%'; }
  function ico(id){ return '<svg class="ico"><use href="#i-' + id + '"/></svg>'; }
  function brandName(b){ return b.toUpperCase() === 'Brand A' ? 'Brand A' : b.charAt(0).toUpperCase() + b.slice(1); }
  function roasCls(x){ return x == null ? '' : x >= 1 ? 'good' : x < 0.6 ? 'bad' : 'warn'; }
  var MODE_LABEL = { funnel: 'Funnel only', store: 'Store', blended: 'Blended' };
  var MODE_SUB = { funnel: 'Orders on the funnels (portal / quiz / presell / offer → checkout).',
                   store: 'Orders on the store: the Shopify store minus funnel copies, plus store product pages.',
                   blended: 'Funnel + store: every new purchase the pixel can see.' };

  function save(){ try { localStorage.setItem('acq-cmd', JSON.stringify(S)); } catch (e) {} }

  function drawBar(){
    var bs = document.getElementById('brandSeg');
    bs.innerHTML = brands.map(function(b){ return '<button type="button" id="b-' + esc(b) + '" data-brand="' + esc(b) + '" aria-pressed="' + (b === S.brand) + '">' + esc(brandName(b)) + '</button>'; }).join('');
    [].forEach.call(document.querySelectorAll('#viewSeg button'), function(x){ x.setAttribute('aria-pressed', x.dataset.view === S.view); });
    [].forEach.call(document.querySelectorAll('#modeSeg button'), function(x){ x.setAttribute('aria-pressed', x.dataset.mode === S.mode); });
    document.getElementById('modeSeg').hidden = S.view !== 'money';
    var d = DOC.brands && DOC.brands[S.brand];
    document.getElementById('stamp').innerHTML = '<span class="dot"></span>as of ' + esc(d ? d.asof : (DOC.asof || '—')) + (d && d.money.spend_through ? ' · spend through ' + esc(d.money.spend_through) : '');
  }

  // ---------------------------------------------------------------- MONEY
  function money(d){
    var m = d.money, o30 = m.orders30, o7 = m.orders7, sp = m.spend || {}, mode = S.mode, h = '';
    h += '<section><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><h2>' + ico('money') + 'Money · last 30 days</h2>' +
         (d.spend_status.ok ? '<span class="chip good">' + ico('ok') + 'spend found</span>' : '<span class="chip bad">' + ico('warn') + 'spend source needed</span>') + '</div>';
    h += '<p class="sub">' + esc(MODE_SUB[mode]) + '</p>';
    if (o30){
      var r = o30[mode], r7 = o7 ? o7[mode] : null;
      h += '<div class="tiles">' +
        tile('Revenue', $m(r.revenue), r7 ? 'last 7 days ' + $m(r7.revenue) : '', 'money', 'hero') +
        tile('Orders', n(r.orders), r7 ? 'last 7 days ' + n(r7.orders) : '', 'bag') +
        tile('Average order', $m2(r.aov), r7 ? 'last 7 days ' + $m2(r7.aov) : '', 'cart') +
        (d.spend_status.ok ? tile('Meta spend', $m(sp['30']), 'last 7 days ' + $m(sp['7']), 'spend') : tile('Meta spend', 'needed', 'no spend file in this run', 'spend', 'empty')) +
        (d.spend_status.ok ? tile('ROAS', rx(r.roas), (r7 ? 'last 7 days ' + rx(r7.roas) : '') + (mode === 'store' ? ' · all spend vs store sales' : ''), 'target', '', roasCls(r.roas)) : tile('ROAS', '—', 'needs spend', 'target', 'empty')) +
        (d.spend_status.ok ? tile('Cost per order', $m2(r.cpa), r7 ? 'last 7 days ' + $m2(r7.cpa) : '', 'user') : tile('Cost per order', '—', 'needs spend', 'user', 'empty')) +
        '</div>';
      // split bar
      var tot = o30.funnel.revenue + o30.store.revenue + o30.renewal.revenue || 1;
      h += '<div class="card"><h3>Where the 30-day money came from</h3>' +
        '<div class="stack" role="img" aria-label="Funnel ' + $m(o30.funnel.revenue) + ', store ' + $m(o30.store.revenue) + ', renewals ' + $m(o30.renewal.revenue) + '">' +
        '<span style="width:' + (100*o30.funnel.revenue/tot) + '%;background:var(--accent)"></span>' +
        '<span style="width:' + (100*o30.store.revenue/tot) + '%;background:var(--warn)"></span>' +
        '<span style="width:' + (100*o30.renewal.revenue/tot) + '%;background:var(--muted)"></span></div>' +
        '<div class="legend"><span><i class="sw" style="background:var(--accent)"></i>Funnel ' + $m(o30.funnel.revenue) + ' · ' + n(o30.funnel.orders) + ' orders</span>' +
        '<span><i class="sw" style="background:var(--warn)"></i>Store ' + $m(o30.store.revenue) + ' · ' + n(o30.store.orders) + ' orders</span>' +
        '<span><i class="sw" style="background:var(--muted)"></i>Subscription renewals ' + $m(o30.renewal.revenue) + ' · ' + n(o30.renewal.orders) + ' (beside the split)</span></div>' +
        '<div class="parts">' + o30.parts.map(function(p){ return '<div class="row"><span><span class="pill ' + p.kind + '">' + p.kind + '</span> ' + esc(p.part) + '</span><span class="num">' + n(p.orders) + '</span><span class="num">' + $m2(p.revenue) + '</span></div>'; }).join('') + '</div></div>';
    } else {
      h += '<div class="callout bad">' + ico('warn') + '<span>No order totals in this run. ' + esc(d.spend_status.text) + '</span></div>';
    }
    // journey value
    var j = mode === 'store' ? m.journey_store : m.journey_funnel;
    if (mode === 'blended') j = merge(m.journey_funnel, m.journey_store);
    if (d.sources.journey){
      h += '<div class="card"><h3>New customers in 30 days, what each one is worth</h3><div class="tiles">' +
        tile('New customers', n(j.customers), 'first order in the window', 'user') +
        tile('Upsell take rate', pct(j.take_pct), n(j.upsell_customers) + ' took one', 'up') +
        tile('Upsell revenue', $m(j.upsell_revenue), 'inside the first order', 'up') +
        tile('30-day value', $m2(j.value_per_customer), 'per customer · first order ' + $m2(j.aov_first), 'money', 'hero') +
        tile('Ordered again', n(j.repeat_customers), $m(j.repeat_revenue) + ' repeat revenue', 'repeat') +
        '</div>' + (mode === 'store' && d.money.shopify ? '<p class="sub">The Shopify store\'s customers are not in the journey yet; these are store-page customers on the funnel checkout system only.</p>' : '') + '</div>';
    }
    // per ad
    h += '</section><section><h2>' + ico('target') + 'Per ad · last 30 days</h2>';
    h += '<p class="sub">' + (mode === 'blended' ? 'Blended per ad is what the pixel itself counted (store and funnel together), from the warehouse copy of the ad data. Store orders carry no ad tags, so this is the only per-ad view of them.' :
          mode === 'store' ? 'Store orders per ad, where the order carried the ad\'s tags.' + (m.shopify ? ' Shopify orders with an ad tag in 30 days: ' + n(m.shopify_tagged_30 || 0) + ', so the store side per ad shows only through Blended.' : '') :
          'Customers whose first order came through a funnel from this ad: revenue includes upsells and repeat orders. ROAS = that revenue ÷ the ad\'s spend.') + '</p>';
    var ads = m.ads.filter(function(r){ return r.spend30 > 0 || r.funnel.customers || r.store.customers || r.truth7; });
    h += '<div class="grid"><table><thead><tr><th>Ad</th><th class="n">Spend 30d</th>';
    if (mode === 'blended') h += '<th class="n">Pixel purchases</th><th class="n">Pixel value</th><th class="n">Pixel ROAS</th><th class="n">Pixel CPA</th><th class="n">Our funnel revenue</th>';
    else h += '<th class="n">Customers</th><th class="n">Revenue</th><th class="n">ROAS</th><th class="n">CPA</th><th class="n">Upsell take</th><th class="n">30-day value</th>';
    h += '<th class="n">Spend 7d</th><th class="n">Orders 7d</th></tr></thead><tbody>';
    ads.forEach(function(r){
      var f = mode === 'store' ? r.store : r.funnel, roas = r.spend30 ? (f.revenue / r.spend30) : null, cpa = f.customers && r.spend30 ? r.spend30 / f.customers : null;
      h += '<tr><td><div class="adname">' + esc(r.label) + '</div>' + (r.tag !== 'ok' ? '<span class="pill tag">' + esc(r.tag) + '</span>' : '') + (!r.paid && r.kind === 'ad' && d.spend_status.ok ? ' <span class="adsub">no spend found under this name</span>' : '') + '</td>';
      h += '<td class="n">' + (r.spend30 ? $m2(r.spend30) : '—') + '</td>';
      if (mode === 'blended') h += '<td class="n">' + n(r.buys30) + '</td><td class="n">' + $m2(r.value30) + '</td><td class="n ' + roasCls(r.roas_pixel) + '">' + rx(r.roas_pixel) + '</td><td class="n">' + $m2(r.cpa_pixel) + '</td><td class="n">' + $m2(r.funnel.revenue) + '</td>';
      else h += '<td class="n">' + n(f.customers) + '</td><td class="n">' + $m2(f.revenue) + '</td><td class="n ' + roasCls(roas) + '">' + rx(roas == null ? null : Math.round(roas*100)/100) + '</td><td class="n">' + $m2(cpa) + '</td><td class="n">' + pct(f.take_pct) + '</td><td class="n">' + $m2(f.value_per_customer) + '</td>';
      h += '<td class="n">' + (r.spend7 ? $m2(r.spend7) : '—') + '</td><td class="n">' + (r.truth7 ? n(r.truth7.orders) : '—') + '</td></tr>';
    });
    h += '</tbody></table></div>';
    if (m.emails && m.emails.length){
      h += '<details class="card"><summary><b>Orders that started from an email</b> (' + m.emails.length + ')</summary><div class="parts">' +
        m.emails.map(function(r){ var f = merge(r.funnel, r.store); return '<div class="row"><span>' + esc(r.label.replace(/^email: /,'')) + '</span><span class="num">' + n(f.customers) + '</span><span class="num">' + $m2(f.revenue) + '</span></div>'; }).join('') + '</div></details>';
    }
    return h + '</section>';
  }
  function merge(a, b){
    var o = {}; ['customers','revenue','first_revenue','upsell_customers','upsell_revenue','repeat_customers','repeat_revenue'].forEach(function(k){ o[k] = (a[k]||0) + (b[k]||0); });
    o.take_pct = o.customers ? Math.round(1000*o.upsell_customers/o.customers)/10 : null;
    o.value_per_customer = o.customers ? o.revenue / o.customers : null;
    o.aov_first = o.customers ? o.first_revenue / o.customers : null; return o;
  }
  function tile(k, v, m, icon, cls, vcls){
    return '<div class="tile ' + (cls||'') + '"><span class="k">' + ico(icon) + esc(k) + '</span><span class="v ' + (vcls||'') + '">' + v + '</span>' + (m ? '<span class="m">' + esc(m) + '</span>' : '') + '</div>';
  }

  // ---------------------------------------------------------------- FLOW
  var STAGE_ICON = { 'landed (Clarity)': 'eye', 'checkout started': 'cart', 'ordered': 'bag', 'took an upsell': 'up', 'customers': 'user', 'got an email': 'mail', 'ordered again': 'repeat', 'ad clicks': 'click' };
  function strip(stages, biggest){
    var top = Math.max.apply(null, stages.map(function(s){ return s.count || 0; }).concat([1]));
    return '<div class="steps">' + stages.map(function(s){
      var leak = biggest && s.stage === biggest.into, blind = s.count == null;
      return '<div class="st' + (leak ? ' leak' : '') + (blind ? ' blind' : '') + '"><span class="node">' + ico(STAGE_ICON[s.stage] || 'flow') + '</span>' +
        '<div style="min-width:0"><div class="lab">' + esc(s.stage) + (leak ? ' · biggest leak' : '') + '</div>' +
        (blind ? '<div class="lost">not read in this run</div>' : (s.lost != null ? '<div class="lost">' + (s.lost > 0 ? n(s.lost) + ' lost' + (s.drop_pct != null ? ' (' + s.drop_pct + '%)' : '') : 'no loss') + '</div>' : (s.note ? '<div class="lost">' + esc(s.note) + '</div>' : ''))) +
        (blind ? '' : '<div class="meter"><span style="width:' + (100*(s.count||0)/top) + '%"></span></div>') + '</div>' +
        '<span class="cnt">' + (blind ? '—' : n(s.count)) + '</span></div>';
    }).join('') + '</div>';
  }
  function flow(d){
    var f = d.flow, h = '<section><h2>' + ico('flow') + 'Flow · ad → funnel → order → upsell → email → repeat</h2>';
    h += '<p class="sub">Last ' + esc(d.windows.clarity_days || 3) + ' days, page by page: Clarity counts where visits land; checkouts, orders and upsells are the store\'s own. Red is the biggest leak.</p>';
    if (f.clicks3){
      var share = Math.round(100 * f.sessions3 / f.clicks3);
      h += '<div class="callout' + (share < 25 ? ' bad' : '') + '">' + ico(share < 25 ? 'warn' : 'info') + '<span><b>' + n(f.clicks3) + ' Meta link clicks → ' + n(f.sessions3) + ' Clarity visits</b> on the same ads, last 3 days (' + share + '% arrive). ' + (share < 25 ? 'Most clicks never show as a visit on the funnel.' : '') + '</span></div>';
    }
    h += '<div class="flows">';
    f.recent.forEach(function(x){
      h += '<div class="card"><h3>' + esc(x.funnel) + '</h3><span class="adsub">' + esc((x.hosts||[]).join(' · ')) + '</span>' + strip(x.stages, x.biggest) +
        (x.biggest ? '' : '<p class="sub">No drop measurable yet.</p>') + '</div>';
    });
    if (!f.recent.length) h += '<div class="callout">' + ico('info') + '<span>No Clarity file in this run.</span></div>';
    h += '</div>';
    if (f.after){
      h += '<div class="card"><h3>After the order · new funnel customers, last 30 days</h3>' + strip(f.after.stages, f.after.biggest) +
        (f.after.klaviyo ? '' : '<p class="sub">Email is blank: Klaviyo was not read for this run, so who got an email and which flow brought them back is unknown. It fills on the next run with the Klaviyo key.</p>') + '</div>';
    }
    h += '</section><section><h2>' + ico('click') + 'Per ad</h2><p class="sub">Link clicks from the warehouse copy of the ad data; visits from Clarity (read off the landing link); checkouts, orders and upsells from the store, last 7 days.</p>';
    h += '<div class="grid"><table><thead><tr><th>Ad</th><th class="n">Spend 7d</th><th class="n">Link clicks 7d</th><th class="n">Clarity visits 3d</th><th class="n">Checkouts 7d</th><th class="n">Orders 7d</th><th class="n">Upsells 7d</th></tr></thead><tbody>';
    f.ads.forEach(function(r){
      var dead = r.clicks7 >= 20 && !r.carts7 && !r.orders7;
      h += '<tr><td><div class="adname">' + esc(r.ad) + '</div>' + (r.tag !== 'ok' ? '<span class="pill tag">' + esc(r.tag) + '</span>' : '') + '</td><td class="n">' + (r.spend7 ? $m2(r.spend7) : '—') + '</td><td class="n">' + n(r.clicks7) + '</td><td class="n">' + (r.sessions3 == null ? '—' : n(r.sessions3)) + '</td><td class="n' + (dead ? ' bad' : '') + '">' + n(r.carts7) + '</td><td class="n">' + n(r.orders7) + '</td><td class="n">' + n(r.upsells7) + '</td></tr>';
    });
    h += '</tbody></table></div>';
    if (f.after && f.after.klaviyo && f.after.email.length){
      h += '<div class="grid"><table><thead><tr><th>Email flow / campaign</th><th class="n">Reached</th><th class="n">Opened</th><th class="n">Clicked</th><th class="n">Repeat orders</th><th class="n">Repeat revenue</th></tr></thead><tbody>' +
        f.after.email.map(function(e){ return '<tr><td>' + esc(e.source) + '</td><td class="n">' + n(e.customers_reached) + '</td><td class="n">' + n(e.opened) + '</td><td class="n">' + n(e.clicked) + '</td><td class="n">' + n(e.repeat_orders) + '</td><td class="n">' + $m2(e.repeat_revenue) + '</td></tr>'; }).join('') + '</tbody></table></div>';
    }
    return h + '</section>';
  }

  // ---------------------------------------------------------------- PRIORITIES
  function prio(d){
    var ps = d.priorities, c = { kill: 0, scale: 0, fix: 0, watch: 0 };
    ps.forEach(function(p){ c[p.type]++; });
    var h = '<section><h2>' + ico('list') + 'Priorities</h2><p class="sub">Computed from this run\'s numbers by the rules at the bottom. Nothing here is estimated: each move carries the number behind it.</p>' +
      '<div class="counts">' + ['kill','scale','fix','watch'].map(function(k){ return '<span class="pill ' + k + '">' + c[k] + ' ' + k + '</span>'; }).join('') + '</div>';
    if (!c.scale && d.spend_status.ok) h += '<div class="callout">' + ico('info') + '<span>No ad clears the scale line yet (3+ funnel customers and funnel revenue at least equal to spend, 30 days).</span></div>';
    if (!c.kill && d.spend_status.ok) h += '<div class="callout">' + ico('info') + '<span>No ad meets the kill line: every ad that spent a customer\'s worth over 3+ days has at least one order or pixel purchase.</span></div>';
    h += '<div class="prios">' + ps.map(function(p){
      return '<div class="prio ' + p.type + '"><span class="rk">' + p.rank + '</span><div style="min-width:0"><div class="t"><span class="pill ' + p.type + '">' + p.type + '</span><span class="what">' + esc(p.ad) + '</span></div>' +
        '<div class="numline">' + esc(p.number) + '</div><div class="why">' + esc(p.why) + '</div></div></div>';
    }).join('') + '</div>';
    h += '<div class="card"><h3>The rules</h3><ul class="rules">' + (DOC.rules || []).map(function(r){ return '<li>' + esc(r) + '</li>'; }).join('') + '</ul></div>';
    return h + '</section>';
  }

  function foot(d){
    var w = d.windows, s = d.sources, out = [];
    out.push('Windows: order totals and per ad 30 days to ' + esc(d.asof) + (w.journey ? ' (new customers ' + esc(w.journey[0]) + ' → ' + esc(w.journey[1]) + ')' : '') + '; recent columns 7 days' + (w.truth ? ' (' + esc(w.truth[0]) + ' → ' + esc(w.truth[1]) + ')' : '') + '; Clarity ' + esc(w.clarity_days || '—') + ' days.');
    out.push('Read in this run: store orders ' + (s.truth ? 'yes' : 'no') + ' · journey ' + (s.journey ? 'yes' : 'no') + ' · Clarity ' + (s.clarity ? 'yes' : 'no') + ' · warehouse (spend + order totals) ' + (s.warehouse ? 'yes' : 'no') + ' · Klaviyo ' + (s.klaviyo ? 'yes' : 'no') + '.');
    out.push('Spend: ' + esc(d.spend_status.text) + '. The warehouse restates the last 28 days as Meta attributes late purchases, so recent ROAS can still move. Orders: paid, non-test, over $0; the copies the funnel checkout writes into Shopify are left out so nothing counts twice.');
    out.push('No caveats document exists for the warehouse; treat its conclusions as provisional. Customers never appear on this page, not even hashed. Run folder <code>' + esc(d.folder) + '</code>.');
    return out.map(function(x){ return '<p>' + x + '</p>'; }).join('');
  }

  function render(){
    drawBar();
    var d = DOC.brands && DOC.brands[S.brand], v = document.getElementById('view');
    if (!d){ v.innerHTML = '<div class="callout">' + ico('info') + '<span>No run data in this copy of the page yet. The daily run fills it.</span></div>'; return; }
    v.innerHTML = S.view === 'flow' ? flow(d) : S.view === 'prio' ? prio(d) : money(d);
    document.getElementById('foot').innerHTML = foot(d);
  }
  document.addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.brand) S.brand = b.dataset.brand;
    else if (b.dataset.view) S.view = b.dataset.view;
    else if (b.dataset.mode) S.mode = b.dataset.mode;
    else return;
    save(); render();
  });
  render();
})();
</script>

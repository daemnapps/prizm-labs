<style>
/* A full-screen deck that always fits one window. Layout only — colour, type, radius and shadow come from /studio.css. */
html,body{height:100%;overflow:hidden}
nav.bar,footer.bot,.askbtn{display:none}
.stormbox{position:relative;width:100%;height:100%;min-height:0;cursor:grab;touch-action:none;user-select:none}
.stormbox:active{cursor:grabbing}
.storm{position:absolute;inset:0;width:100%;height:100%}
.stormbox .label{position:absolute;left:50%;bottom:0;transform:translateX(-50%);white-space:nowrap}
.stormbox .till{position:absolute;left:50%;top:0;transform:translateX(-50%);white-space:nowrap;z-index:1;font-family:var(--display);font-size:clamp(28px,min(4vw,6vh),56px);color:var(--green);font-variant-numeric:tabular-nums}
.deck{position:fixed;inset:0;z-index:1;overflow:hidden}
.slide{height:100%;max-width:1480px;margin:0 auto;padding:clamp(34px,7vh,80px) clamp(20px,5vw,80px) clamp(64px,10vh,96px);display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);grid-template-rows:minmax(0,1fr);gap:clamp(20px,5vw,96px)}
.txt{align-self:center;animation:rise .5s both;min-height:0}
.txt h1{font-size:clamp(30px,min(5.2vw,8vh),88px);line-height:1.02;margin-top:var(--s3)}
.txt .lede{margin-top:var(--s4);font-size:clamp(16px,min(1.6vw,2.6vh),24px);max-width:32ch}
.txt .ex{margin-top:var(--s5);border-left:3px solid var(--hue);padding-left:var(--s4);max-width:38ch}
.txt .ex p{color:var(--ink-2);margin-top:var(--s1);font-size:clamp(14px,min(1.25vw,2.1vh),19px)}
.show{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s3);min-height:0;min-width:0;animation:rise .6s .12s both}
.show > *{min-height:0}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.fit{flex:1 1 auto;max-height:100%;max-width:100%;aspect-ratio:9/16;border-radius:var(--r3);overflow:hidden;border:6px solid var(--ink);background:var(--ink);position:relative}
.fit video,.fit img{width:100%;height:100%;object-fit:cover;display:block}
.grid3{flex:1 1 auto;max-height:100%;max-width:100%;aspect-ratio:27/32;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:var(--s2)}
.grid3 figure{margin:0;position:relative;border-radius:var(--r2);overflow:hidden;background:var(--paper);cursor:pointer}
.grid3 img,.grid3 video{width:100%;height:100%;object-fit:cover;display:block}
.grid3 figcaption{position:absolute;left:8px;bottom:8px;transition:opacity .3s,transform .3s}
.grid3 figure.hide figcaption{opacity:0;transform:translateY(6px)}
.cmp{cursor:ew-resize;touch-action:none}
.cmp .top{position:absolute;inset:0;clip-path:inset(0 0 0 var(--cut,50%))}
.cmp .bar{position:absolute;top:0;bottom:0;left:var(--cut,50%);width:3px;background:var(--card)}
.cmp .tag{position:absolute;top:10px}
.big{font-family:var(--display);font-size:clamp(56px,min(12vw,20vh),180px);line-height:.92;font-variant-numeric:tabular-nums}
.show .obj{width:min(100%,62vh);max-width:none;flex:0 1 auto}
.stops{display:grid;gap:var(--s3);width:min(100%,600px)}
.stops button{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--coral);border-radius:var(--r2);padding:var(--s3) var(--s5);font-size:clamp(15px,min(1.4vw,2.3vh),20px)}
.stops .fix{display:block;max-height:0;overflow:hidden;opacity:0;transition:all .35s;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--green)}
.stops button.open{border-left-color:var(--green)}.stops button.open .fix{max-height:40px;opacity:1;margin-top:var(--s2)}
.prog{position:fixed;top:0;left:0;right:0;z-index:3;display:flex;gap:4px;padding:12px clamp(20px,5vw,80px)}
.prog i{flex:1;height:3px;border-radius:var(--r4);background:var(--line);transition:background .4s}.prog i.on{background:var(--ink)}
.ctl{position:fixed;right:clamp(16px,3vw,40px);bottom:clamp(14px,2.5vh,28px);z-index:3;display:flex;gap:var(--s2);transition:opacity .5s}
.idle .ctl,.idle .tip{opacity:0}
.ctl button{all:unset;cursor:pointer;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:10px 14px;border-radius:var(--r4);background:var(--card);border:1px solid var(--line)}
.ctl button:hover{border-color:var(--ink)}
.tip{position:fixed;left:clamp(20px,5vw,80px);bottom:clamp(18px,3vh,32px);z-index:3;transition:opacity .5s}
.photo{aspect-ratio:4/5;border:0}
.photo .ai{position:absolute;left:10px;bottom:10px;--hue:var(--ink-2);background:var(--card)}
.duo{display:flex;gap:var(--s4);align-items:center;justify-content:center;height:100%;width:100%;min-height:0}
.duo>.fit{flex:0 1 auto;height:100%;max-width:45%}
.grid3.g2{grid-template-columns:repeat(2,minmax(0,1fr));aspect-ratio:9/16}.grid3.g3{grid-template-rows:minmax(0,1fr);aspect-ratio:27/16}
.stops.say .fix{text-transform:none;letter-spacing:0;font-family:var(--body);font-size:clamp(14px,min(1.2vw,2vh),18px);color:var(--ink-2)}.stops.say button.open .fix{max-height:160px}
.qr{background:var(--card);padding:var(--s2);border-radius:var(--r2);line-height:0;display:inline-block}
@media(max-aspect-ratio:1/1){.slide{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:var(--s4)}.txt{align-self:end}.txt .ex,.tip{display:none}}
</style>

<script>
(() => {
const M = '/three-doctors/m/';
const L = 'media/';
const photo = (src, alt, ai, cap) => `<div class="fit photo"><img src="${L}${src}" alt="${alt || 'Illustration made with AI'}">${ai ? '<span class="pill ai">Illustration · made with AI</span>' : cap ? `<span class="pill ai">${cap}</span>` : ''}</div>`;
const COVERS = ['control', 'g01-h2', 'g01-h3', 'g01-h4', 'g01-h5', 'g01-h6'];
const PAIRS = [['sw-1', 'p-s1-f1'], ['sw-5', 'p-s8-f1'], ['sw-7', 'p-s21-f1']];

/* One idea per slide: explanation + example on the left, the real thing on the right,
   one thing to touch. The example all the way through is one real ad (daemn.co/three-doctors/).
   `rain` sets how hard it rains behind the slide, 0–6. */
const SLIDES = [
  { rain: 0, hue: 'indigo', eyebrow: 'UMW · 14 Oct 2026 · Damon Dixon, class of 2019',
    h: 'Don\'t start from a blank page.',
    p: 'A different way to think about creating, and the machine we built around it.',
    tip: 'Press and hold the storm',
    show: () => `<div class="stormbox" role="img" aria-label="A storm of video frames"><canvas class="storm"></canvas><span class="label">Press and hold: every frame is an idea</span></div>` },
  { rain: 0, hue: 'indigo', eyebrow: 'Who\'s talking',
    h: 'Damon Dixon.',
    p: 'Twenty years of making things, and watching what people actually do with them.',
    show: () => photo('gold-shirt.jpg', 'Damon Dixon') },
  { rain: 0, hue: 'amber', eyebrow: 'Growing up',
    h: 'It started with YouTube.',
    p: 'I made my first videos at nine. Unlike TV, you could see exactly who watched, and where they stopped.',
    show: () => photo('school.jpg', 'Damon as a kid, school portrait', false, 'Me, school picture day') },
  { rain: 0, hue: 'amber', eyebrow: 'College',
    h: 'Beats on YouTube.',
    p: 'Midway through college I was making music and putting beats on YouTube. Every upload was an experiment I could read back.',
    tip: 'Tap the video for sound',
    show: () => `<div class="fit photo"><video id="v" src="${L}singing-2017.mp4" poster="${L}singing-2017.jpg" muted autoplay loop playsinline></video><span class="pill ai">Me singing, 2017</span></div>` },
  { rain: 0, hue: 'amber', eyebrow: 'Class of 2019',
    h: 'Right here at UMW.',
    p: 'Business administration, a few credits short of a double major in music. Music is what pulled me into creativity.',
    show: () => photo('umw-2023.jpg', 'Damon back at UMW', false, 'Back at UMW, 2023') },
  { rain: 0, hue: 'amber', eyebrow: 'Right out of college',
    h: 'One video changed everything.',
    p: 'Right out of college, one ad carried my first business. I had no idea why it worked. That question is the rest of this talk.',
    show: () => photo('whiteboard-2019.jpg', 'Damon\'s whiteboard, July 2019', false, 'My whiteboard, July 2019') },
  { rain: 0, hue: 'amber', eyebrow: 'Since then',
    h: 'Why does one thing work?',
    p: 'Every product, every factory, every ad since has been me chasing that one question. It turns out the answer has a shape.',
    show: () => photo('china-2023.jpg', 'Damon at a factory in China under a sign that reads Welcome Damon', false, 'Factory visit, China, 2023') },
  { rain: 0, hue: 'indigo', eyebrow: 'Now',
    h: 'Bangkok.',
    p: 'Building AI that lets a small team make what used to take a whole studio. Here\'s how it thinks.',
    show: () => `<div class="grid3">${[1, 2, 3, 4, 5, 6].map(i => `<figure><img src="${L}padel-${i}.jpg" alt="Damon playing padel in Bangkok"></figure>`).join('')}</div>` },
  { rain: 1, hue: 'violet', eyebrow: 'The big idea',
    h: 'Nothing starts from nothing.',
    p: 'Every song you love borrowed a structure. Every meme is a template. The skill isn\'t inventing from zero. It\'s noticing why something works, then making it yours.',
    ex: ['Try it today', 'Next time you can\'t stop watching something, ask: what exactly kept me here?'],
    tip: 'Tap each word to open it',
    show: () => `<div class="stops">${[['Notice', 'What already holds people?'], ['Name', 'Why does it work? Say it in one line.'], ['Remake', 'Keep the why. Change everything else.']].map(([a, b]) => `<button><span class="big" style="font-size:clamp(34px,min(5vw,8vh),72px)">${a}</span><span class="fix">${b}</span></button>`).join('')}</div>` },
  { rain: 1, hue: 'violet', eyebrow: 'Step 1 of 7 · Swipe',
    h: 'Start from what already works.',
    p: 'We collect posts people already can\'t stop watching. The market tested them for free.',
    ex: ['This one', 'A 68-year-old visits three surgeons and gets three different answers. It isn\'t an ad, and people watched to the end.'],
    tip: 'Tap the video for sound',
    show: () => `<div class="fit"><video id="v" src="${M}swipe.mp4" poster="${M}swipe.jpg" muted autoplay loop playsinline></video></div>` },
  { rain: 2, hue: 'indigo', eyebrow: 'Step 2 of 7 · Strip',
    h: 'Keep the shape. Lose their brand.',
    p: 'AI breaks the post into the beats that hold attention.',
    ex: ['What survives', 'Not their faces, their words or their brand. Only the order of the story.'],
    tip: 'Tap each frame to name its beat',
    show: () => `<div class="grid3">${['sw-1', 'sw-2', 'sw-4', 'sw-5', 'sw-7', 'sw-9'].map((s, i) => `<figure class="hide"><img src="${M}${s}.jpg" alt=""><figcaption><span class="pill swipe">${['The hook', 'Visit 1', 'Visit 1', 'Visit 2', 'Visit 3', 'Visit 3'][i]}</span></figcaption></figure>`).join('')}</div>` },
  { rain: 3, hue: 'magenta', eyebrow: 'Step 3 of 7 · Inject',
    h: 'Pour your product in.',
    p: 'Same story shape, our product, written in our customers\' own words.',
    ex: ['Our version', '"Two doctors said bleach or laser for the dark spots on her face. The third handed her a Thai turmeric scrub."'],
    tip: 'Drag across the picture: theirs ↔ ours',
    show: () => `<div class="fit cmp" id="cmp"><img src="${M}${PAIRS[1][0]}.jpg" alt="Their scene"><div class="top"><img src="${M}${PAIRS[1][1]}.jpg" alt="Our scene, made by AI"></div><div class="bar"></div><span class="pill swipe tag" style="left:10px">Theirs</span><span class="pill brief tag" style="right:10px">Ours</span></div>
      <div class="btns">${PAIRS.map((p, i) => `<button class="btn ${i === 1 ? '' : 'ghost'}" data-p="${i}">Scene ${i + 1}</button>`).join('')}</div>` },
  { rain: 4, hue: 'cyan', eyebrow: 'Step 4 of 7 · Multiply',
    h: 'Nobody was filmed.',
    p: 'AI agents cast the people, make every scene and give each person a voice.',
    ex: ['This ad', '4 people, 22 scenes and 4 voices, all made by the machine.'],
    show: () => `<div class="grid3">${['p-s2-f1', 'p-s6-f1', 'p-s16-f1', 'p-s26-f1', 'p-s34-f1', 'p-s40-f1'].map(s => `<figure><img src="${M}${s}.jpg" alt="A scene made by AI"></figure>`).join('')}</div>` },
  { rain: 4, hue: 'coral', eyebrow: 'Step 5 of 7 · Gate',
    h: 'It refuses bad work.',
    p: 'Every mistake the machine catches becomes a rule it checks on every ad after.',
    tip: 'Tap a stop to see the fix',
    show: () => `<div class="duo"><div class="fit"><img src="${M}cover-g01-h5.jpg" alt="A cover where the words landed on her face"></div><div class="stops">${[['Her mouth moved on someone else\'s voice', 'Covered with a close-up'], ['A word got cut off: "Guaranteed"', 'Re-voiced, heard back whole'], ['The music stopped before the end', 'Music under the whole ad'], ['The cover\'s words landed on her face', 'Moved to a clear spot'], ['The post showed a price the site didn\'t', 'Taken out']].map(([a, b]) => `<button><span class="pill stop">Stop</span> ${a}<span class="fix">✓ ${b}</span></button>`).join('')}</div></div>` },
  { rain: 6, hue: 'green', eyebrow: 'Step 6 of 7 · Learn',
    h: 'The audience picks.',
    p: 'Six openings go out at once. People vote with their thumbs, and whatever holds them feeds the next idea.',
    tip: 'Tap an opening to hear it',
    show: () => `<div class="grid3">${COVERS.map(c => `<figure><video src="${M}open-${c}.mp4" poster="${M}cover-${c}.jpg" muted autoplay loop playsinline></video><figcaption><span class="pill ready">● Live</span></figcaption></figure>`).join('')}</div>` },
  { rain: 6, hue: 'amber', eyebrow: 'Step 7 of 7 · Close the loop',
    h: 'See what actually landed.',
    p: 'The Outlier app ties every ad the machine made back to what people actually did with it, so we learn which one truly connected.',
    ex: ['Building now', 'The standouts get remade into new variations, and those go back into the machine.'],
    tip: 'Live demo: the Outlier app',
    show: () => `<div class="stops">${[['Every AI-made ad goes out with its own tracking', 'Every response traces back to one ad'], ['What people did comes back for each ad', 'Real behaviour, not just views'], ['The Outlier app flags the ads that beat the rest', 'The outliers teach the next round'], ['Standouts get remade as new variations', 'Being built right now']].map(([a, b]) => `<button><span class="pill ready">Loop</span> ${a}<span class="fix">✓ ${b}</span></button>`).join('')}</div>` },
  { rain: 5, hue: 'violet', eyebrow: 'Finished this week · theirs → ours',
    h: 'Keep the shock. Give it a reason.',
    p: 'Nine seconds of a stranger\'s fire facial, flames and all, for no reason at all. We kept the jolt and gave it one: a woman who has tried everything for her dark spots.',
    ex: ['The lesson', 'What made people stop (the shock) and what makes them stay (a reason to care) are two different jobs.'],
    tip: 'Tap a video for sound',
    show: () => `<div class="duo"><div class="fit photo"><video src="${L}fire-swipe.mp4" poster="${L}fire-swipe.jpg" muted autoplay loop playsinline></video><span class="pill swipe ai">Theirs</span></div><div class="fit photo"><video src="${L}fire-ours.mp4" poster="${L}fire-ours.jpg" muted autoplay loop playsinline></video><span class="pill brief ai">Ours · AI-made</span></div></div>` },
  { rain: 5, hue: 'magenta', eyebrow: 'Finished this week',
    h: 'Then we wrote it a song.',
    p: 'A country song about a grandmother who went down for one and came home with three. Written, sung and cut to the lyrics by the machine, checked line by line.',
    ex: ['Why a song', 'Nobody skips a song the way they skip an ad.'],
    tip: 'Tap the video for sound',
    show: () => `<div class="fit photo"><video id="v" src="${L}song-ours.mp4" poster="${L}song-ours.jpg" muted autoplay loop playsinline></video><span class="pill ai">Made with AI</span></div>` },
  { rain: 6, hue: 'cyan', eyebrow: 'Iterate, don\'t perfect',
    h: 'Make four. Let them choose.',
    p: 'Same song, four different first seconds: the flex, a punch-in, the fan first, a slow-mo swing. Don\'t argue about which is best. Make all four.',
    ex: ['The mindset', 'A draft you can test beats a masterpiece you\'re still guessing about.'],
    tip: 'Tap an opening to hear it',
    show: () => `<div class="grid3 g2">${[['v1-control', 'The flex'], ['v2-punch-in', 'Punch-in'], ['v3-fan-first', 'Fan first'], ['v4-slowmo-swing', 'Slow-mo']].map(([v, n]) => `<figure><video src="${L}song-${v}.mp4" poster="${L}song-${v}.jpg" muted autoplay loop playsinline></video><figcaption><span class="pill video">${n}</span></figcaption></figure>`).join('')}</div>` },
  { rain: 6, hue: 'violet', eyebrow: 'Just for fun · scroll stoppers',
    h: 'Same chaos. Our guy.',
    p: 'Three viral clips: a street fight, a sidewalk quiz, a man riding a dog. We kept every beat that made people stop, and put our product and our people inside them.',
    ex: ['Try it', 'Flip between theirs and ours. The energy is identical. Only the story underneath changed.'],
    tip: 'Tap Theirs / Ours, tap a video for sound',
    show: () => `<div class="grid3 g3" id="dx">${['fight', 'quiz', 'dog'].map(k => `<figure data-k="${k}"><video src="${L}dx-${k}-ours.mp4" poster="${L}dx-${k}-ours.jpg" muted autoplay loop playsinline></video></figure>`).join('')}</div>
      <div class="btns"><button class="btn ghost" data-dx="theirs">Theirs</button><button class="btn" data-dx="ours">Ours</button></div>` },
  { rain: 6, hue: 'amber', eyebrow: 'The other door · your own idea',
    h: 'Don\'t trust your idea. Interrogate it.',
    p: 'Another new tool starts from a half-formed thought, not someone else\'s video, and asks it every question a good teacher would before anything gets made.',
    ex: ['The idea that went in', '"Women in colder climates are going to feel really dry skin on their face this winter. Face scrub."'],
    tip: 'Tap each question to see its answer',
    show: () => `<div class="stops say">${[['Who is it really for?', 'She wants to look normal in winter. Not younger, just not flaky, and not a face her makeup won\'t sit on.'], ['What does she already know?', 'She can name the problem (tight, flaky, crispy) but hasn\'t tied it to any product. So never open on the product.'], ['What belief has to change?', 'From "I need a richer cream" to "there\'s a flaky layer on top, and taking it off is the step I\'ve been skipping."'], ['Where could it start?', 'Open on the calendar, not the face: it\'s October, and she already knows what the next four months do to her skin.'], ['What can\'t we prove?', 'It lists every gap out loud: no winter before-and-after exists yet, and a "93% felt smoother" line has nothing behind it.'], ['Who says go?', 'A person. Nothing gets made until someone reads it and signs off.']].map(([a, b]) => `<button><span class="pill wait">?</span> ${a}<span class="fix">${b}</span></button>`).join('')}</div>` },
  { rain: 6, hue: 'indigo', eyebrow: 'Your turn',
    h: 'The tools are basically free.',
    p: 'One semester of weekends is enough to make something real. My brother is 21. Within months he was building websites with AI for his first steady client.',
    ex: ['Choose your destiny', 'There\'s never been a time like this.'],
    tip: 'Press and hold the storm',
    show: () => `<div class="duo">${photo('finale.jpg', 'Damon')}<div style="display:flex;flex-direction:column;align-items:center;gap:var(--s3);height:100%;flex:1 1 0;min-width:0"><div class="stormbox" style="flex:1 1 auto"><b class="till" id="till">0</b><canvas class="storm"></canvas></div><div class="btns" style="align-items:center"><span class="qr" id="qr"></span><span class="label">Play with it<br>on your phone<br><b>daemn.co/umw</b></span></div></div></div>` },
];

const $ = s => document.querySelector(s), esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const tok = n => getComputedStyle(document.documentElement).getPropertyValue('--' + n).trim();
const SPEC = ['violet', 'indigo', 'cyan', 'green', 'amber', 'coral', 'magenta'];
const C = {}; ['ink', 'ink-3', 'card', ...SPEC].forEach(k => C[k] = tok(k));
let cur = 0, sound = false;

/* ── slides ── */
$('#prog').innerHTML = SLIDES.map(() => '<i></i>').join('');
function go(i) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  const S = SLIDES[cur], sl = $('#slide');
  sl.style.setProperty('--hue', `var(--${S.hue})`);
  sl.innerHTML = `<div class="txt"><p class="eyebrow">${esc(S.eyebrow)}</p><h1>${esc(S.h)}</h1><p class="lede">${esc(S.p)}</p>${S.ex ? `<div class="ex"><p class="label hue">${esc(S.ex[0])}</p><p>${esc(S.ex[1])}</p></div>` : ''}</div><div class="show">${S.show()}</div>`;
  document.querySelectorAll('#prog i').forEach((d, j) => d.classList.toggle('on', j <= cur));
  $('#tip').textContent = S.tip || '← → to move';
  wire(sl);
  if (i > 0) thunder(.6);
  try { localStorage.setItem('mir-slide', cur); } catch (e) {}
}
function wire(sl) {
  storms.forEach(stop => stop()); storms = [...sl.querySelectorAll('.stormbox')].map(storm);
  const objs = sl.querySelectorAll('.obj[data-obj]');
  (function m(n) { if (!objs.length) return; if (window.daemnObjects) objs.forEach(el => window.daemnObjects.mount(el)); else if (n < 40) setTimeout(() => m(n + 1), 250); })(0);
  const v = sl.querySelector('#v'); if (v) v.onclick = () => { v.muted = !v.muted; };
  sl.querySelectorAll('.duo video').forEach(v => v.onclick = () => { sl.querySelectorAll('.duo video').forEach(o => o.muted = o !== v || !v.muted); });
  sl.querySelectorAll('figure.hide').forEach(f => f.onclick = () => { f.classList.remove('hide'); thunder(.2); });
  sl.querySelectorAll('figure[data-c]').forEach(f => f.onclick = () => {
    const c = f.dataset.c; f.innerHTML = `<video src="${M}open-${c}.mp4" autoplay playsinline controls></video>`; delete f.dataset.c;
  });
  sl.querySelectorAll('.grid3 figure video').forEach(v => v.parentNode.onclick = () => { sl.querySelectorAll('.grid3 video').forEach(o => o.muted = o !== v || !v.muted); });
  sl.querySelectorAll('.stops button').forEach(b => b.onclick = () => { b.classList.toggle('open'); });
  sl.querySelectorAll('[data-dx]').forEach(b => b.onclick = () => {
    sl.querySelectorAll('#dx figure').forEach(f => { const v = f.querySelector('video'), k = f.dataset.k; v.poster = `${L}dx-${k}-${b.dataset.dx}.jpg`; v.src = `${L}dx-${k}-${b.dataset.dx}.mp4`; v.play().catch(() => {}); });
    sl.querySelectorAll('[data-dx]').forEach(x => x.classList.toggle('ghost', x !== b));
  });
  const cmp = sl.querySelector('#cmp');
  if (cmp) {
    const set = x => { const r = cmp.getBoundingClientRect(); cmp.style.setProperty('--cut', Math.max(0, Math.min(100, (x - r.left) / r.width * 100)) + '%'); };
    let drag = false;
    cmp.onpointerdown = e => { drag = true; cmp.setPointerCapture(e.pointerId); set(e.clientX); e.stopPropagation(); };
    cmp.onpointermove = e => { if (drag || e.pointerType === 'mouse') set(e.clientX); };
    cmp.onpointerup = () => drag = false;
    sl.querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
      const p = PAIRS[+b.dataset.p], imgs = cmp.querySelectorAll('img');
      imgs[0].src = M + p[0] + '.jpg'; imgs[1].src = M + p[1] + '.jpg';
      sl.querySelectorAll('[data-p]').forEach(x => x.classList.toggle('ghost', x !== b));
    });
  }
  if ($('#qr')) { try { new QRCode($('#qr'), { text: 'https://daemn.co/umw/', width: 104, height: 104, colorDark: C.ink, colorLight: C.card }); } catch (e) {} }
}
const next = () => go(cur === SLIDES.length - 1 ? 0 : cur + 1), prev = () => go(cur - 1);
$('#next').onclick = next; $('#prev').onclick = prev;
document.addEventListener('keydown', e => {
  if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); next(); }
  if (['ArrowLeft', 'PageUp'].includes(e.key)) prev();
  if (e.key === 'f' || e.key === 'F') present();
});
function present() { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch (e) {} }
$('#fs').onclick = present;
document.addEventListener('fullscreenchange', () => { $('#fs').textContent = document.fullscreenElement ? 'Exit' : 'Present'; });
let tx = null; const deck = $('#deck');
deck.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
deck.addEventListener('touchend', e => { if (tx === null) return; const d = e.changedTouches[0].clientX - tx; if (Math.abs(d) > 60 && !e.target.closest('#cmp')) (d < 0 ? next : prev)(); tx = null; });
let idleT; const wake = () => { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 2600); };
addEventListener('pointermove', wake); addEventListener('keydown', wake); wake();

/* ── sound ── */
let ac, rainGain;
function toggleSound() {
  sound = !sound; $('#snd').textContent = sound ? 'Sound on' : 'Sound off';
  if (!sound || ac) { if (ac) ac.resume(); return; }
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    const buf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
    const bp = ac.createBiquadFilter(); bp.type = 'lowpass'; bp.frequency.value = 520; bp.Q.value = .4;
    rainGain = ac.createGain(); rainGain.gain.value = 0; src.connect(bp).connect(rainGain).connect(ac.destination); src.start();
  } catch (e) {}
}
$('#snd').onclick = toggleSound;
function thunder(k) {
  if (!sound || !ac) return;
  const n = ac.sampleRate * 2, buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.4);
  const s = ac.createBufferSource(); s.buffer = buf; const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 170;
  const g = ac.createGain(); g.gain.value = .8 * k; s.connect(lp).connect(g).connect(ac.destination); s.start();
}

/* ── the idea storm: little video frames spun up a funnel, each in a stop of the PRIZM spectrum ── */
let storms = [], money = 0, shown = 0;
function frameSprite(hue, back) {
  const c = document.createElement('canvas'), w = 108, h = 192; c.width = w; c.height = h;
  const g = c.getContext('2d'), K = tok('card'), I = tok('ink');
  g.fillStyle = I; g.beginPath(); g.roundRect(0, 0, w, h, 14); g.fill();
  g.fillStyle = tok(hue); g.beginPath(); g.roundRect(6, 6, w - 12, h - 12, 10); g.fill();
  if (back) { g.fillStyle = I; g.globalAlpha = .25; g.fillRect(6, 6, w - 12, h - 12); g.globalAlpha = 1; return c; }
  g.fillStyle = K; g.globalAlpha = .9; g.beginPath(); g.moveTo(w / 2 - 14, h / 2 - 20); g.lineTo(w / 2 + 20, h / 2); g.lineTo(w / 2 - 14, h / 2 + 20); g.closePath(); g.fill();
  g.globalAlpha = .5; g.fillRect(16, h - 30, w - 32, 4); g.globalAlpha = 1; g.fillRect(16, h - 30, (w - 32) * .4, 4);
  return c;
}
function storm(box) {
  const cv = box.querySelector('canvas'), cx = cv.getContext('2d'), DPR = Math.min(2, devicePixelRatio || 1);
  const SPR = SPEC.map(k => [frameSprite(k, false), frameSprite(k, true)]);
  let W = 0, H = 0, boost = 0, want = 0, live = true, last = performance.now();
  const fit = () => { W = box.clientWidth; H = box.clientHeight; cv.width = W * DPR; cv.height = H * DPR; cx.setTransform(DPR, 0, 0, DPR, 0, 0); };
  const ro = new ResizeObserver(fit); ro.observe(box); fit();
  const N = W < 360 ? 70 : 140;
  const bills = Array.from({ length: N }, () => ({ h: Math.random(), th: Math.random() * Math.PI * 2, r: .75 + Math.random() * .5, c: Math.floor(Math.random() * SPEC.length), flip: Math.random() * 6, fv: 2 + Math.random() * 5, s: .5 + Math.random() * .5 }));
  box.addEventListener('pointerdown', e => { want = 1; box.setPointerCapture(e.pointerId); thunder(.35); });
  const up = () => { want = 0; }; box.addEventListener('pointerup', up); box.addEventListener('pointercancel', up);
  function frame(t) {
    if (!live) return;
    const dt = Math.min(.05, (t - last) / 1000); last = t;
    boost += (want - boost) * Math.min(1, dt * 3);
    const base = Math.min(W, H) * .05, top = Math.min(W * .48, H * .45), floor = H * .93, span = H * .82;
    cx.clearRect(0, 0, W, H);
    // the funnel's wind lines
    cx.strokeStyle = tok('ink-3'); cx.lineWidth = 1;
    for (let k = 0; k < 9; k++) {
      const h = k / 8, R = base + (top - base) * Math.pow(h, 1.35), y = floor - h * span, sway = Math.sin(t / 900 + h * 3) * W * .03 * h;
      cx.globalAlpha = .08 + boost * .08; cx.beginPath(); cx.ellipse(W / 2 + sway, y, R, R * .22, 0, (t / 300 + k) % (Math.PI * 2), (t / 300 + k) % (Math.PI * 2) + Math.PI * 1.3); cx.stroke();
    }
    cx.globalAlpha = .12; cx.fillStyle = tok('ink-3'); cx.beginPath(); cx.ellipse(W / 2, floor + 6, base * 3 + boost * base * 2, base * .5, 0, 0, Math.PI * 2); cx.fill();
    const speed = 1.4 + boost * 3.2, rise = .07 + boost * .22;
    const drawn = bills.map(b => {
      b.h += dt * rise * (.6 + b.s * .8);
      if (b.h > 1) { b.h = 0; b.th = Math.random() * Math.PI * 2; if (boost > .3 || cur === SLIDES.length - 1) money += 1; }
      const R = (base + (top - base) * Math.pow(b.h, 1.35)) * b.r;
      b.th += dt * speed * (1.6 - b.h) * (top / Math.max(R, 1)) * .18;
      b.flip += dt * b.fv * (1 + boost);
      const sway = Math.sin(t / 900 + b.h * 3) * W * .03 * b.h, z = Math.sin(b.th);
      return { b, x: W / 2 + sway + Math.cos(b.th) * R, y: floor - b.h * span + z * R * .22, z };
    }).sort((p, q) => p.z - q.z);
    for (const { b, x, y, z } of drawn) {
      const depth = (z + 1) / 2, sc = (.22 + .26 * b.s) * (.55 + .45 * depth) * Math.min(1.4, W / 520 + .4), fx = Math.cos(b.flip);
      cx.save(); cx.translate(x, y); cx.rotate(Math.cos(b.th) * .7 + Math.sin(b.flip * .5) * .3); cx.scale(sc * (Math.abs(fx) < .08 ? .08 : fx), sc);
      cx.globalAlpha = .35 + .65 * depth; cx.drawImage(SPR[b.c][fx >= 0 ? 0 : 1], -54, -96); cx.restore();
    }
    cx.globalAlpha = 1;
    if (sound && rainGain) rainGain.gain.value = .05 + boost * .35;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  return () => { live = false; ro.disconnect(); };
}
(function till(t) {
  shown += (money - shown) * .12;
  const el = $('#till'); if (el) el.textContent = Math.round(shown).toLocaleString() + ' ideas';
  requestAnimationFrame(till);
})();

let start = 0; try { start = +(localStorage.getItem('mir-slide') || 0); } catch (e) {}
go(start);
})();

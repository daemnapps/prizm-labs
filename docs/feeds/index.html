<style>
/* layout only — colour, type, radii and the one shadow come from the system */
.hero{padding-top:96px}
.tabs .tab{flex:1 1 200px}
.tabs .tab.org[aria-selected="true"]{background:var(--violet);border-color:var(--violet)}
.who{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;margin:var(--s2) 0 var(--s4)}
.who .label{flex-basis:100%;margin-top:var(--s2)}
.who button{appearance:none;cursor:pointer;font-family:var(--body);font-size:14px;background:var(--card);color:var(--ink);border:1px solid var(--line-2);border-radius:var(--r4);padding:6px 14px}
.who button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bone)}
.wholine{margin:0 0 var(--s4)}
.bar2{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center;justify-content:space-between;margin-bottom:var(--s4)}
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:var(--s4)}
.pc{all:unset;cursor:pointer;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.pc:hover,.pc:focus-visible{border-color:var(--hue)}
.pc img,.pc .noimg{width:100%;aspect-ratio:9/14;object-fit:cover;background:var(--paper);display:block}
.paid .pc img,.paid .pc .noimg{aspect-ratio:1/1}
.pc .b{padding:var(--s3);display:flex;flex-direction:column;gap:var(--s2);flex:1}
.pc .w{font-size:14px;line-height:1.35;margin:0}
.pc .s{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:auto}
.more{display:flex;justify-content:center;margin:var(--s6) 0}
.scrim{position:fixed;inset:0;background:var(--line-2);z-index:200}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bone);box-shadow:var(--float);z-index:201;overflow-y:auto;padding:var(--s5) var(--gutter) var(--s8)}
.sheet .x{position:sticky;top:0;float:right}
.sheet h2{font-size:20px;margin:var(--s6) 0 var(--s3)}
.sheet .cover{width:160px;border-radius:var(--r2);border:1px solid var(--line)}
.sheet .frames{width:100%;border-radius:var(--r2);border:1px solid var(--line);margin-top:var(--s3)}
.sheet .brief{max-height:none}
.sheet ol.steps{margin-top:var(--s4)}
.sheet pre{white-space:pre-wrap;font-size:12px;max-height:180px;overflow:auto}
@media(max-width:640px){.feed{grid-template-columns:repeat(2,1fr);gap:var(--s3)}.sheet{width:100%}.hero{padding-top:72px}}
</style>

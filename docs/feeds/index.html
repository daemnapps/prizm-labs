<style>
/* My Feeds — the board from the desk (port 8820), laid out on the system: layout only */
.m-head{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;padding:var(--s5) 0 0}
.m-head h1{font-size:clamp(24px,3vw,32px);margin-right:var(--s2)}
.m-sub{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.04em}.m-head .m-sub{margin-left:auto}
.m-chip,.m-seg button,.m-acts a,.m-acts button{appearance:none;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-decoration:none;color:var(--ink-2);background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:6px 11px;white-space:nowrap}
.m-chip:hover,.m-seg button:hover,.m-acts a:hover,.m-acts button:hover{border-color:var(--indigo);color:var(--indigo)}
.m-chip.on{color:var(--ink);border-color:var(--ink)}
.m-seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;background:var(--card);max-width:100%;overflow-x:auto}
.m-seg button{border:0;border-right:1px solid var(--line);border-radius:var(--r1)}.m-seg button:last-child{border-right:0}
.m-seg button.on{background:var(--ink);color:var(--bone)}
.m-lanes{margin-top:var(--s4)}.m-lanes button{font-size:12px;padding:9px 18px;text-transform:uppercase;letter-spacing:.12em}
.m-lanes button.on{background:var(--indigo)}
.m-bar{display:flex;gap:var(--s2);padding:var(--s3) 0;flex-wrap:wrap;align-items:center;position:sticky;top:0;background:var(--bone);z-index:5;border-bottom:1px solid var(--line);margin-top:var(--s3)}
.m-bar2{display:flex;gap:var(--s2);padding:var(--s3) 0 0;flex-wrap:wrap;align-items:center}
.m-bar select,.m-bar2 select,.m-bar input{font-family:var(--body);font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:7px 10px;max-width:320px}
.m-bar input{flex:1;min-width:220px;max-width:none}
.m-spacer{flex:1}#desk [hidden]{display:none!important}
.m-feedhead{margin:var(--s3) 0 0;font-size:13px;color:var(--ink-2);border:1px solid var(--line);border-radius:var(--r2);padding:var(--s3) var(--s4);background:var(--card)}
.m-feedhead:empty{display:none}.m-feedhead .m-ask{color:var(--ink);font-size:15px;margin-bottom:var(--s1)}
.m-src{display:inline-block;border:1px solid var(--line);border-radius:var(--r1);padding:1px 7px;margin:2px 3px 2px 0;font:11px var(--mono)}.m-src.pro{border-style:dashed;color:var(--amber)}
.m-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--s3);padding:var(--s4) 0 var(--s5)}
.m-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.m-card:hover{border-color:var(--line-2)}.m-card.out{opacity:.4}
.m-thumb{position:relative;overflow:hidden;aspect-ratio:9/13;background:var(--paper);display:block}.paid .m-thumb{aspect-ratio:1/1}
.m-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.m-pb,.m-bd{font:500 10px var(--mono);letter-spacing:.06em;padding:2px 6px;border-radius:var(--r1);background:var(--ink);color:var(--bone)}
.m-pb{position:absolute;top:8px;left:8px}
.m-badges{position:absolute;bottom:8px;left:8px;right:8px;display:flex;gap:4px;flex-wrap:wrap}
.m-bd.rise{color:var(--green)}.m-bd.punch{color:var(--amber)}.m-bd.new{color:var(--cyan)}
.m-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.m-author{font-weight:600;font-size:13px;color:var(--ink);overflow-wrap:anywhere}.m-what{font-size:13px;color:var(--ink)}
.m-cap{font-size:12px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.m-stats{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-variant-numeric:tabular-nums;margin-top:2px}
.m-stats b{font:600 14.5px var(--body);color:var(--ink)}
.m-stats i{font:10px var(--mono);font-style:normal;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-left:-6px}
.m-sig{font:500 10px var(--mono);letter-spacing:.06em;color:var(--ink-2);border:1px solid var(--line-2);border-radius:var(--r1);padding:1px 6px;white-space:nowrap}
.m-meta{font:11px var(--mono);color:var(--ink-3)}.m-fmt{font:11px var(--mono);color:var(--indigo)}.m-why{font-size:11.5px;color:var(--ink-3)}
.m-acts{display:flex;gap:6px;margin-top:auto;padding-top:8px;flex-wrap:wrap}.m-acts a,.m-acts button{flex:1;text-align:center;padding:5px 6px}
.m-empty{padding:var(--s8) 0;color:var(--ink-3);text-align:center;grid-column:1/-1}
.m-more{display:flex;justify-content:center;margin-bottom:var(--s6)}
.m-pipe{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:var(--s4) 0 0}
.m-st{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:12px;cursor:pointer}.m-st:hover{border-color:var(--line-2)}.m-st.on{border-color:var(--ink)}
.m-st .n{font:11px var(--mono);color:var(--ink-3)}.m-st .nm{font-weight:600;font-size:15px;color:var(--ink)}.m-st .d{font-size:12px;color:var(--ink-2)}.m-st .big{font-size:16px;font-weight:600;margin-top:8px;color:var(--ink)}
.m-stage{margin:12px 0 var(--s6);background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:var(--s4)}
.m-two{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}.m-two h4{margin:12px 0 6px;font-size:13px}
.m-stage table,.m-panel table{font-size:12.5px}.m-stage td,.m-stage th{padding:6px 10px 6px 0}
.kp{color:var(--green)}.dr{color:var(--coral)}
.m-drawers{margin-bottom:var(--s6)}.m-drawers pre{max-height:520px;overflow:auto;font-size:12px}
.m-scrim{position:fixed;inset:0;background:var(--line-2);z-index:200}
.m-panel{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--bone);box-shadow:var(--float);z-index:201;overflow-y:auto;padding:var(--s5) var(--gutter) var(--s8)}
.m-panel .x{position:sticky;top:0;float:right}.m-panel h2{font-size:20px;margin:var(--s6) 0 var(--s3)}
.m-panel .cover{width:160px;border-radius:var(--r2);border:1px solid var(--line)}
.m-panel .frames{width:100%;border-radius:var(--r2);border:1px solid var(--line);margin-top:var(--s3)}
.m-panel pre{white-space:pre-wrap;font-size:12px;max-height:220px;overflow:auto}.m-panel .brief{max-height:none}
.m-panel .m-fm{border-top:1px solid var(--line);padding:var(--s4) 0}.m-panel .m-fm h3{margin-bottom:var(--s2)}.m-panel ol{margin:var(--s2) 0 0 var(--s4)}
@media(max-width:800px){.m-pipe{grid-template-columns:1fr 1fr}.m-two{grid-template-columns:1fr}}
@media(max-width:600px){.m-bar{position:static}.m-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.m-bar select,.m-bar2 select{max-width:100%}.m-bar input{min-width:0;flex-basis:100%}.m-head .m-sub{margin-left:0;flex-basis:100%}}
</style>

  <header class="m-head"><h1>My Feeds</h1>
    <button class="m-chip" id="formatsbtn">Format library</button><button class="m-chip" id="soundsbtn">Trending sounds</button>
    <span class="m-sub" id="stats">Loading…</span></header>

    <select id="sortsel" aria-label="Sort"></select>
    <button class="m-chip" id="dropped">Show thrown out</button>
  </div>
  <div class="m-feedhead" id="feedhead"></div>

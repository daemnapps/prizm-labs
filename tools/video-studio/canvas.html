<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scene Canvas</title>
<style>
/* Layout: scene nodes wired in order on a dotted canvas; the assembly strip pinned under it; one node's workflow opens in a side panel. */
:root{--bg:#eceee9;--dot:#d6dcd6;--surface:#FFF;--ink:#16211c;--muted:#6b7871;--line:#d6dcd6;--soft:#f4f6f2;
 --wire:#1d7a55;--wire-bg:#e3efe8;--yes:#1d7a55;--yes-bg:#e3efe8;--wait:#9A5B00;--wait-bg:#FCEFD8;--no:#B42318;--no-bg:#FDE6E3;
 --display:system-ui,-apple-system,sans-serif;--body:system-ui,-apple-system,sans-serif;--mono:ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161a18;--dot:#38413d;--surface:#222826;--ink:#eef2ee;--muted:#98a49d;--line:#38413d;--soft:#1c211f;--wire:#52c79a;--wire-bg:#1f3329;--yes:#52c79a;--yes-bg:#1f3329;--wait:#F2B45A;--wait-bg:#33270F;--no:#FF8A80;--no-bg:#3A1714;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161a18;--dot:#38413d;--surface:#222826;--ink:#eef2ee;--muted:#98a49d;--line:#38413d;--soft:#1c211f;--wire:#52c79a;--wire-bg:#1f3329;--yes:#52c79a;--yes-bg:#1f3329;--wait:#F2B45A;--wait-bg:#33270F;--no:#FF8A80;--no-bg:#3A1714;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--body)}
button,input,textarea,select{font:inherit;color:inherit}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top h1{font:800 19px/1.1 var(--display);margin:0}
.made{display:flex;align-items:center;gap:8px;font:600 13px var(--body)}
.mbar{width:120px;height:10px;border-radius:5px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}
.mbar i{display:block;height:100%;background:var(--yes);width:0;transition:width .6s}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--soft);border-radius:8px;height:34px;padding:0 12px;cursor:pointer;font:600 13px var(--body)}
.btn.go{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.sp{margin-left:auto}
.embed .top h1{display:none}.remote #pkg{display:none}.embed .top{position:sticky}
.canvas{position:relative;margin:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:20px 20px;padding:24px;min-height:300px}
.grid{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:34px 34px}
svg.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
svg.wires path{fill:none;stroke:var(--wire);stroke-width:2.4}
.node{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 8px rgba(20,24,33,.08);display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0;min-width:0}
.node.sel{outline:2px solid var(--wire);outline-offset:2px}
.node::before,.node::after{content:"";position:absolute;top:16px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--wire)}
.node::before{left:-7px}.node::after{right:-7px}
.nh{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--wire-bg);border-radius:12px 12px 0 0;font:800 13px/1.15 var(--display);color:var(--wire)}
.nh b{font:500 11px var(--mono);color:var(--muted);margin-left:auto}
.thumb{height:210px;background:var(--soft);display:grid;place-items:center;color:var(--muted);overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.7);color:#fff;font:500 11px var(--mono);padding:2px 5px;border-radius:4px}
.hatch{background:repeating-linear-gradient(135deg,var(--soft) 0 8px,var(--surface) 8px 14px)}
.st{display:flex;align-items:center;gap:5px;font:600 12px var(--body);padding:7px 10px;border-top:1px solid var(--line)}
.st.made{color:var(--yes)}.st.waiting{color:var(--wait)}.st.changed,.st.ready{color:var(--wire)}.st.running{color:var(--wire)}
.steps{display:flex;flex-wrap:wrap;gap:4px;padding:0 10px 9px}
.steps span{display:inline-flex;align-items:center;gap:3px;font:500 10.5px var(--mono);background:var(--soft);border-radius:4px;padding:2px 5px;color:var(--muted)}
/* strip */
.stripwrap{position:sticky;bottom:0;z-index:4;box-shadow:0 -8px 24px rgba(20,24,33,.10);margin:0 16px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sh h2{font:800 16px var(--display);margin:0}
.strip{display:flex;gap:3px;height:92px;align-items:stretch}
.slot{flex:var(--w) 1 0;min-width:22px;border-radius:7px;position:relative;overflow:hidden;border:1px solid var(--line);cursor:pointer;padding:0;background:var(--soft)}
.slot.made{border:2px solid var(--yes);background:#000}
.slot img{width:100%;height:100%;object-fit:cover;display:block;opacity:.92}
.slot .lb{position:absolute;left:4px;top:4px;font:600 11px var(--mono);background:var(--surface);color:var(--ink);border-radius:4px;padding:1px 4px}
.slot .ic{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);color:var(--wait)}
.slot.land{animation:land .7s cubic-bezier(.2,.8,.2,1)}
@keyframes land{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
.axis{display:flex;justify-content:space-between;font:500 11px var(--mono);color:var(--muted);margin-top:5px}
/* panel */
.panel{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-12px 0 32px rgba(0,0,0,.14);transform:translateX(105%);transition:transform .22s;z-index:20;display:flex;flex-direction:column}
.panel.open{transform:none}
.ph{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ph h3{margin:0;font:800 17px/1.2 var(--display);flex:1}
.pb{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.pb video{width:100%;max-width:240px;aspect-ratio:9/16;background:#000;border-radius:10px;align-self:center}
.words{background:var(--soft);border-radius:8px;padding:10px;font-size:14px}
.step{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.step .t{display:flex;align-items:center;gap:6px;padding:7px 10px;background:var(--wire-bg);color:var(--wire);font:600 12.5px var(--mono)}
.step .t.wait{background:var(--wait-bg);color:var(--wait)}
.step .f{display:grid;grid-template-columns:70px minmax(0,1fr);gap:6px 8px;padding:9px 10px;align-items:center;font-size:13px}
.step .f label{color:var(--muted);font-size:12px}
.step input,.step textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 7px;font:500 13px var(--mono)}
.step textarea{font-family:var(--body);min-height:44px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{font-size:13px;color:var(--muted)}.msg.err{color:var(--no)}
.run{font:500 12px var(--mono);color:var(--muted);background:var(--soft);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere}
/* how each AI shot was made */
.how{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.how>h4{margin:0;padding:9px 12px;background:var(--wire-bg);color:var(--wire);font:700 13px var(--body);display:flex;gap:8px;align-items:center}
.how>h4 small{margin-left:auto;font:500 11px var(--mono);color:var(--muted)}
.chain{display:flex;flex-direction:column;gap:0;padding:10px 12px}
.hs{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
.hs:first-child{border-top:0}
.hs .m img,.hs .m video{width:96px;aspect-ratio:9/16;object-fit:cover;border-radius:7px;background:#000;display:block}
.hs .m .none{width:96px;aspect-ratio:9/16;border-radius:7px;background:var(--soft);display:grid;place-items:center;font-size:11px;color:var(--muted);text-align:center;padding:6px}
.hs b{display:block;font-size:13px}
.hs .mod{font:500 11px var(--mono);color:var(--muted);overflow-wrap:anywhere}
.hs .pr{margin-top:6px;background:var(--soft);border-radius:7px;padding:8px;font-size:12.5px;line-height:1.45;white-space:pre-wrap}
.hs .pn{font-size:11px;color:var(--muted);margin-top:3px}
.rej{padding:8px 12px 12px;border-top:1px solid var(--line)}
.rej b{font-size:12.5px}.rej ul{margin:4px 0 8px;padding-left:18px;font-size:12.5px}
.rej .row{gap:6px}.rej video,.rej img{width:72px;aspect-ratio:9/16;object-fit:cover;border-radius:6px;background:#000;opacity:.85}
.used{font:500 11.5px var(--mono);color:var(--muted);padding:0 12px 10px}
.proc{margin:10px 12px 0;padding:8px 10px;border-radius:8px;font:600 12.5px var(--body)}
.proc.ok{background:var(--yes-bg);color:var(--yes)}.proc.off{background:var(--wait-bg);color:var(--wait)}
.proc span{font-weight:500;color:var(--ink)}
.cm{margin:10px 12px 0;padding:10px;border:1px solid var(--line);border-radius:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cm b{font-size:12.5px;width:100%}
.cm select{height:34px;border:1px solid var(--line);border-radius:8px;background:var(--soft);padding:0 8px;min-width:0;flex:1 1 220px;font:600 13px var(--body)}
.cm .cmmsg{width:100%;font-size:12px;color:var(--muted)}
/* scene panel: shots, change section, viewer */
.pb>*{flex:none}
.sec2{font:700 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.shots{display:flex;flex-direction:column;gap:8px}
.shot{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:8px}
.sthumb{border:0;padding:0;background:#000;border-radius:7px;overflow:hidden;cursor:zoom-in;width:64px;aspect-ratio:9/16}
.sthumb img{width:100%;height:100%;object-fit:cover;display:block}
.shot b{font-size:13.5px}
.chips2{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0}
.chips2 span{font:600 10.5px var(--body);background:var(--soft);color:var(--muted);border-radius:20px;padding:2px 7px}
.chips2 .ai{background:var(--wait-bg);color:var(--wait)}.chips2 .own{background:var(--yes-bg);color:var(--yes)}
details.chg{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
details.chg summary{cursor:pointer;font-weight:700}
details.chg[open]{display:flex;flex-direction:column;gap:10px}
.hint2{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.lb{position:fixed;inset:0;background:rgba(10,12,16,.86);display:none;place-items:center;z-index:40}
.lb.open{display:grid}
.lbin{display:flex;flex-direction:column;align-items:center;gap:10px}
.lbin img,.lbin video{max-height:84vh;max-width:92vw;border-radius:10px;background:#000}
/* player */
.player{position:fixed;inset:0;background:rgba(10,12,16,.86);display:none;place-items:center;z-index:30}
.player.open{display:grid}
.pwrap{position:relative;height:min(86vh,760px);aspect-ratio:9/16;max-width:92vw}
.pwrap video{width:100%;height:100%;background:#000;border-radius:12px;display:block}
.cap{position:absolute;left:8%;right:8%;bottom:16%;text-align:center;color:#fff;font:800 clamp(16px,3.4vh,28px)/1.15 var(--display);text-shadow:0 2px 0 #000,0 0 12px rgba(0,0,0,.8);pointer-events:none}
.pclose{position:absolute;top:-44px;right:0}
@media (max-width:760px){
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
 svg.wires{display:none}.node::before,.node::after{display:none}
 .canvas{margin:12px 16px;padding:14px}
 .stripwrap{margin:0 16px 12px}
 .strip{flex-wrap:wrap;height:auto}.slot{flex:0 0 calc(16.66% - 3px);height:64px}
 .panel{top:auto;left:0;width:100%;max-height:85%;border-radius:16px 16px 0 0;transform:translateY(105%)}.panel.open{transform:none}
}
@media (prefers-reduced-motion:reduce){.slot.land{animation:none}.panel{transition:none}}
/* motion: the scene's motion as moving skeletons, beside its lines, approved before any paid take */
.mo{border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0;background:var(--surface)}
.mo .mh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.mo .mh b{font:800 15px var(--display)}
.chip{display:inline-flex;align-items:center;gap:4px;font:700 12px var(--body);border-radius:999px;padding:3px 9px;background:var(--soft);color:var(--muted)}
.chip.ok{background:var(--yes-bg);color:var(--yes)}.chip.wait{background:var(--wait-bg);color:var(--wait)}.chip.no{background:var(--no-bg);color:var(--no)}
.mo .mg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.mo video{width:100%;border-radius:8px;background:#000;display:block;aspect-ratio:9/16;object-fit:contain}
.mo .beats{display:flex;flex-direction:column;gap:5px;max-height:420px;overflow:auto}
.mo .beat{display:flex;gap:6px;align-items:flex-start;font-size:13px;line-height:1.3;background:var(--soft);border-radius:7px;padding:6px 8px}
.mo .beat i{font:700 10.5px var(--mono);font-style:normal;color:var(--wire);background:var(--wire-bg);border-radius:4px;padding:1px 5px;flex:none}
.mo .nums{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.mo .nums span{display:inline-flex;align-items:center;gap:4px;font:600 12px var(--body);background:var(--soft);border-radius:6px;padding:4px 8px}
.mo .drop{border:2px dashed var(--line);border-radius:10px;padding:14px;text-align:center;cursor:pointer;font:600 13px var(--body);color:var(--muted)}
.mo .drop.on{border-color:var(--wire);color:var(--wire);background:var(--wire-bg)}
.mo .row2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.mo .row2 input[type=number]{width:64px;height:34px;border:1px solid var(--line);border-radius:8px;padding:0 6px;background:var(--surface)}
.mo .empty2{display:grid;place-items:center;aspect-ratio:9/16;background:var(--soft);border-radius:8px;color:var(--muted);font:600 13px var(--body);text-align:center;padding:10px}
@media (max-width:520px){.mo .mg{grid-template-columns:1fr}}
</style>
</head>
<body>

 <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></symbol>

 <symbol id="i-face" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01M8.5 15a4.5 4.5 0 0 0 7 0"/></symbol>

<div class="top">
 <h1 id="title">Scene Canvas</h1>
 <div class="made"><span class="mbar"><i id="mfill"></i></span><span id="mtxt"></span></div>
 <span class="sp"></span>
 <button class="btn go" id="playall"><svg class="ic"><use href="#i-play"/></svg>Play the cut</button>
 <button class="btn" id="pkg"><svg class="ic"><use href="#i-box"/></svg>Open the edit in HyperFrames</button>
</div>

<div class="canvas"><div class="grid" id="grid"><svg class="wires" id="wires" aria-hidden="true"></svg></div></div>

<div class="stripwrap">
 <div class="sh"><h2>Assembly</h2><span class="msg" id="smsg"></span></div>
 <div class="strip" id="strip"></div>
 <div class="axis"><span>0:00</span><span id="axend"></span></div>
</div>

<aside class="panel" id="panel" aria-hidden="true">
 <div class="ph"><h3 id="pt"></h3><button class="btn" id="px" aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button></div>
 <div class="pb" id="pb"></div>
</aside>

<div class="lb" id="lb" onclick="if(event.target===this)closeLb()"></div>
<div class="player" id="player"><div class="pwrap"><button class="btn pclose" id="plx"><svg class="ic"><use href="#i-x"/></svg>Close</button><video id="pv" playsinline></video><div class="cap" id="cap"></div></div></div>

<script>
const N = new URLSearchParams(location.search).get('brief') || '0322';
if (new URLSearchParams(location.search).get('embed')) document.documentElement.classList.add('embed');
if (!['127.0.0.1', 'localhost'].includes(location.hostname)) document.documentElement.classList.add('remote');   // on the phone: HyperFrames editing stays on the Mac
let S = null, sel = null, prevMade = new Set();
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const icon = t => t.startsWith('ffmpeg') ? 'i-cut' : t === 'human.read' ? 'i-mic' : t.startsWith('capture') ? 'i-browser' : 'i-layers';
const toolName = t => ({'ffmpeg.trim':'cut','human.read':'voice read','capture.page':'page capture','layer.photo':'photo layer','layer.offer':'offer layer'}[t] || t);
const fmt = s => { s = Math.max(0, s); return Math.floor(s/60) + ':' + (s%60).toFixed(1).padStart(4,'0'); };
const fileUrl = (sc, rel) => '/files/' + N + '/scenes/' + sc + '/' + rel;
const estDur = sc => { if (sc.run && sc.status === 'made') return sc.run.duration; const w = (sc.workflow.words||'').split(/\s+/).filter(Boolean).length; return w ? w / 2.7 : 2.5; };

async function load(){
  S = await (await fetch('/api/brief/' + N)).json();
  draw();
}
function draw(){
  $('title').textContent = S.brief.title + ' · ' + S.brief.number;
  const made = S.scenes.filter(s => s.status === 'made').length;
  $('mfill').style.width = (made / S.scenes.length * 100) + '%';
  $('mtxt').textContent = made + ' of ' + S.scenes.length + ' made';
  const g = $('grid');
  g.querySelectorAll('.node').forEach(n => n.remove());
  S.scenes.forEach(sc => {
    const wf = sc.workflow, b = document.createElement('button');
    b.className = 'node' + (sel === sc.scene ? ' sel' : ''); b.id = 'n-' + sc.scene;
    const th = sc.status === 'made'
      ? '<img alt="" src="' + fileUrl(sc.scene, sc.run.files.thumb) + '?h=' + sc.run.workflow_hash + '"><span class="dur">' + sc.run.duration.toFixed(2) + 's</span>'
      : '<svg class="ic" style="width:28px;height:28px"><use href="#' + (sc.waits.includes('voice read') ? 'i-mic' : sc.waits.length ? 'i-layers' : 'i-play') + '"/></svg>';

  if (a === 'take') { document.querySelector('details.chg').open = true; $('pmsg').textContent = j.take + ' is a copy to try. The cut still uses ' + S.scenes.find(x => x.scene === id).pick + ' until you pick ' + j.take + ' under "In the cut".'; }
}
function play(list){
  if (!list.length) return;
  let k = 0; const v = $('pv'); let caps = [];
  const next = async () => {
    if (k >= list.length) { closePlayer(); return; }
    const sc = list[k++];
    caps = (await (await fetch(fileUrl(sc.scene, sc.run.files.captions))).json()).lines || [];
    v.src = fileUrl(sc.scene, sc.run.files.video) + '?h=' + sc.run.workflow_hash; v.play();
  };
  v.onended = next;
  v.ontimeupdate = () => { const c = caps.find(c => v.currentTime >= c.start && v.currentTime < c.end); $('cap').textContent = c ? c.text : ''; };
  $('player').classList.add('open'); next();
}
function closePlayer(){ const v = $('pv'); v.pause(); v.removeAttribute('src'); $('cap').textContent=''; $('player').classList.remove('open'); }
$('plx').onclick = closePlayer;
$('playall').onclick = () => play(S.scenes.filter(s => s.status === 'made'));
$('pkg').onclick = async () => {
  if (document.documentElement.classList.contains('embed') && window.parent !== window) { window.parent.postMessage({go: 'edit'}, '*'); return; }
  $('smsg').textContent = 'Opening the edit in HyperFrames…'; const r = await fetch('/api/hyperframes/' + N, {method:'POST', body: '{}'}); const j = await r.json();
  if (r.ok) location.href = j.url; else $('smsg').textContent = j.error || 'Could not open'; };
$('px').onclick = () => { $('panel').classList.remove('open'); sel = null; document.querySelectorAll('.node').forEach(n => n.classList.remove('sel')); };
addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('lb').classList.contains('open')) return closeLb(); closePlayer(); $('px').click(); } });
addEventListener('resize', () => S && wires());
load();

<!-- Big offer: small headline, the offer's words, a very large price, a short call. Sizes are at full scale; the fit step shrinks them together. -->
<div class="area" data-fit style="justify-content:center;gap:calc(var(--s)*26px)">
 <div class="line" style="font:500 calc(var(--s)*62px)/1.1 Sans;letter-spacing:.08em;text-transform:uppercase">{{head}}</div>
 <div class="line" style="font:400 calc(var(--s)*104px)/1.05 Display">{{lead}}</div>
 <div class="line" style="font:400 calc(var(--s)*400px)/.92 Display;letter-spacing:-.02em">{{price}}</div>
 <div class="line" style="font:500 calc(var(--s)*40px)/1.2 Sans;letter-spacing:.14em;text-transform:uppercase">{{cta}}</div>
</div>

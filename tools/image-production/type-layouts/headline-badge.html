<!-- Headline and badge: a large serif headline over a solid guarantee badge. Sizes are at full scale; the fit step shrinks them together. -->
<div class="area" data-fit style="justify-content:center;gap:calc(var(--s)*40px)">
 <div class="line" style="font:400 calc(var(--s)*150px)/1.04 Display;letter-spacing:-.01em">{{head}}</div>
 <div class="line" style="display:inline-block;align-self:center;background:{{ink}};color:{{ground}};font:500 calc(var(--s)*40px)/1 Sans;letter-spacing:.06em;text-transform:uppercase;padding:calc(var(--s)*26px) calc(var(--s)*52px);border-radius:999px">{{badge}}</div>
</div>
